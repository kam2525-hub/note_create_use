  function playTone(freq, dur, type = 'sine', vol = 0.14, slideTo = null, delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  }

  function playNoise(dur, vol = 0.1, filterFreq = 1200, filterType = 'bandpass', delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = filterType;
    filt.frequency.setValueAtTime(filterFreq, t0);
    const gain = ac.createGain();
    gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(ac.destination);
    src.start(t0);
    src.stop(t0 + dur + 0.02);
  }

      const rem = abs % 10000;

  const BUF_SIZE = 840;
  const BUF_SCALE = 2; // logical artifact space is -210..+210 (420x420)
  const ART_CENTER_X = W / 2;
  const ART_CENTER_Y = 428;
  const ART_DRAW_SIZE = 400; // drawn as 400x400 on main canvas (centered at ART_CENTER)

  function createOffscreen() {
    const c = document.createElement('canvas');
    c.width = BUF_SIZE;
    c.height = BUF_SIZE;
    return c;
  }
  const layerNormal = createOffscreen();
  const layerUV = createOffscreen();
  const layerXRay = createOffscreen();

  // Helper to draw into a layer with origin at center and logical coords (-210..210)
  function withLayer(c, fn) {
    const g = c.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, BUF_SIZE, BUF_SIZE);
    g.save();
    g.translate(BUF_SIZE / 2, BUF_SIZE / 2);
    g.scale(BUF_SCALE, BUF_SCALE);
    fn(g);
    g.restore();
  }

  // =========================================================================
  // PROCEDURAL MUSEUM-QUALITY ARTIFACT RENDERER (10 Artifacts × 3 Layers!)
  // =========================================================================
  function renderArtifactLayers(item) {
    const id = item.def.id;
    const clues = item.activeClues; // array of tool strings ('xray','uv','loupe','scale')
    const hasClue = (t) => clues.includes(t);
    const isSecret = item.isSecret;
    const secretTool = item.def.secretSpot.tool;

    // 1. NORMAL + MICRO-DETAIL LAYER
    withLayer(layerNormal, (g) => {
      g.save();
      g.shadowColor = 'rgba(0,0,0,0.52)';
      g.shadowBlur = 22;
      g.shadowOffsetY = 12;
      drawArtifactBase(g, id, 'normal', hasClue('loupe'));
      g.restore();
      drawArtifactDetails(g, id, hasClue('loupe'));
    });

    // 2. UV BLACKLIGHT LAYER
    withLayer(layerUV, (g) => {
      // Dark violet ambient UV backdrop over artifact shape
      g.fillStyle = '#090418';
      g.fillRect(-210, -210, 420, 420);
      // Draw darkened artifact silhouette under UV
      g.save();
      g.globalAlpha = 0.24;
      g.filter = 'brightness(0.45) contrast(1.2) hue-rotate(210deg) saturate(1.8)';
      g.drawImage(layerNormal, -210, -210, 420, 420);
      g.restore();
      // Natural subtle UV sheen
      drawArtifactUVOverlay(g, id, hasClue('uv'), isSecret && secretTool === 'uv');
    });

    // 3. X-RAY RADIOGRAPH LAYER
    withLayer(layerXRay, (g) => {
      // Deep clinical blue-black radiograph film
      g.fillStyle = '#04121d';
      g.fillRect(-210, -210, 420, 420);
      drawArtifactXRay(g, id, hasClue('xray'), isSecret && secretTool === 'xray');
    });
  }

      g.textBaseline = 'middle';
      romans.forEach((rm, i) => {
        const a = (i * Math.PI) / 6 - Math.PI / 2;
        g.fillText(rm, Math.cos(a) * 80, 12 + Math.sin(a) * 80);

      g.strokeStyle = '#756244';

      g.beginPath();

      g.beginPath();
      g.moveTo(-74, 126);

  function drawGear(g, cx, cy, r, teeth) {
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = '#e0f2fe';
    g.lineWidth = 2.6;
    g.beginPath();
    for (let i = 0; i < teeth * 2; i++) {
      const a = (i * Math.PI) / teeth;
      const rr = i % 2 === 0 ? r : r - 5;
      if (i === 0) g.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      else g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    g.closePath();
    g.stroke();
    g.beginPath(); g.arc(0, 0, r * 0.35, 0, Math.PI * 2); g.stroke();
    g.restore();
  }

  function roundRectPath(g, x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rr, y);
    g.arcTo(x + w, y, x + w, y + h, rr);
    g.arcTo(x + w, y + h, x, y + h, rr);
    g.arcTo(x, y + h, x, y, rr);
    g.arcTo(x, y, x + w, y, rr);
    g.closePath();
  }

  // Generate a balanced, exciting deck of artifacts
  function buildDeck() {
    const indices = ARTIFACT_DEFS.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    return indices;
  }

  function createItemForRound(roundIdx, forcedSpec = null) {
    let def;
    if (forcedSpec && forcedSpec.id) {
      def = ARTIFACT_DEFS.find(d => d.id === forcedSpec.id) || ARTIFACT_DEFS[0];
    } else {
      if (state.deckOrder.length === 0) state.deckOrder = buildDeck();
      const idx = state.deckOrder.shift();
      def = ARTIFACT_DEFS[idx];
    }

    let isReal, isSecret, activeClues;
    if (forcedSpec) {
      isReal = forcedSpec.isReal;
      isSecret = !!forcedSpec.isSecret;
      activeClues = forcedSpec.clues || [];
    } else {
      // Balanced mix (~50% fake, ~50% real; ~30% of reals are SUPER JACKPOT secrets!)
      isReal = rand() < 0.48;
      // Avoid 3 identical outcomes in a row
      if (state.history.length >= 2) {
        const h1 = state.history[state.history.length - 1].isReal;
        const h2 = state.history[state.history.length - 2].isReal;
        if (h1 === h2) isReal = !h1;
      }
      isSecret = isReal && (roundIdx >= 1) && (rand() < 0.42);
      activeClues = [];
      if (!isReal) {
        // Pick 1 primary visual clue (xray/uv/loupe) + optional secondary clue so scanning is always rewarding!
        const visualTools = ['xray', 'uv', 'loupe'];
        const primary = visualTools[Math.floor(rand() * visualTools.length)];
        activeClues.push(primary);
        // On early rounds, sometimes add a second clue (like scale or another visual tool)
        if (roundIdx <= 2 || rand() < 0.45) {
          const rest = ['xray', 'uv', 'loupe', 'scale'].filter(t => t !== primary);
          activeClues.push(rest[Math.floor(rand() * rest.length)]);
        }
      }
    }

    const scaleEscalation = 1 + roundIdx * 0.22;
    const askPrice = Math.round(randRange(def.askMin, def.askMax) * scaleEscalation / 100) * 100;
    const baseMarket = Math.round(askPrice * def.sellMult / 100) * 100;
    const realValue = isSecret ? Math.round(baseMarket * 2.6 / 100) * 100 : baseMarket;

    const measuredWeight = activeClues.includes('scale')
      ? def.fakeWeight + randInt(-12, 12)
      : def.realWeight + randInt(-6, 6);

    const client = CLIENTS[Math.floor(rand() * CLIENTS.length)];

    const item = {
      def,
      client,
      isReal,
      isSecret,
      activeClues,
      askPrice,
      baseMarket,
      realValue,
      measuredWeight,
    };
    renderArtifactLayers(item);
    return item;
  }

  function startGame(mode = 'campaign') {
    ensureAudio();
    state.screen = 'play';
    state.mode = mode;
    state.round = 0;
    state.maxRounds = mode === 'campaign' ? 7 : 999;
    state.cash = 0;
    state.displayCash = 0;
    state.lives = mode === 'campaign' ? 3 : 1;
    state.maxLives = state.lives;
    state.streak = 0;
    state.maxStreak = 0;
    state.correctCount = 0;
    state.history = [];
    state.deckOrder = buildDeck();
    state.particles = [];
    state.floatingTexts = [];
    state.showHelp = false;
    nextRound();
  }

  function nextRound(forcedSpec = null) {
    state.round++;
    state.phase = 'inspect';
    state.phaseTimer = 0;
    state.item = createItemForRound(state.round - 1, forcedSpec);
    state.itemSlide = 0;
    state.maxTime = state.mode === 'endless' ? Math.max(20, 34 - state.round) : 35;
    state.timeLeft = state.maxTime;
    state.foundClues = [];
    state.toolsUsed = {};
    state.scaleAnim = 0;
    state.scaleChecked = false;
    state.playerChoice = null;
    state.stampAnim = 0;
    state.lensActive = false;
    state.pointerDown = false;
    state.tool = 'xray'; // Start on X-Ray because it feels immediately magical!
    SFX.slideIn();

    // Mark artifact seen in save collection
    if (!saveData.discovered.includes(state.item.def.id)) {
      saveData.discovered.push(state.item.def.id);
      writeSave(saveData);
    }
  }

  // =========================================================================
  // JUDGMENT, STAMP & AUCTION LOGIC
  // =========================================================================
  function submitVerdict(choice) {
    if (state.phase !== 'inspect') return;
    ensureAudio();
    state.playerChoice = choice;
    state.phase = 'stamp';
    state.phaseTimer = 0;
    state.stampAnim = 0;
    state.lensActive = false;
    state.shake = 14;
    SFX.stamp(choice === 'buy');
    emitEvent('stamp', { choice, isReal: state.item.isReal, isSecret: state.item.isSecret });

    const item = state.item;
    const isBuy = choice === 'buy';
    const correct = (isBuy && item.isReal) || (!isBuy && !item.isReal);
    state.verdictCorrect = correct;

    if (correct) {
      state.correctCount++;
      state.streak++;
      state.maxStreak = Math.max(state.maxStreak, state.streak);
    } else {
      state.streak = 0;
      state.lives--;
    }

    const streakMult = 1 + Math.min(state.streak - 1, 5) * 0.15;
    const evidenceBonus = state.foundClues.length * 400;

    if (isBuy && item.isReal) {
      // Prepare thrilling Auction Frenzy!
      const profit = Math.round((item.realValue - item.askPrice) * streakMult / 100) * 100 + evidenceBonus;
      state.verdictDelta = profit;
      state.auctionCurrent = item.askPrice;
      state.auctionTarget = item.realValue;
      state.auctionStep = 0;
      state.auctionBids = buildAuctionBids(item.askPrice, item.realValue, item.isSecret);
      state.verdictTitle = item.isSecret ? '★超国宝 落札!!★' : '真作 落札成功!!';
      state.verdictSub = item.isSecret
        ? `隠し秘宝で相場爆騰！純利益 +${formatYen(profit)}`
        : `見事な目利き！純利益 +${formatYen(profit)}`;
    } else if (!isBuy && !item.isReal) {
      // Nailed a Forgery!
      const reward = Math.round((500 + evidenceBonus) * streakMult / 50) * 50;
      state.verdictDelta = reward;
      state.verdictTitle = '贋作 看破!!';
      state.verdictSub = state.foundClues.length > 0
        ? `偽造の証拠を完全確保！鑑定報酬 +${formatYen(reward)}`
        : `危機一髪で偽物を回避！鑑定料 +${formatYen(reward)}`;
    } else if (isBuy && !item.isReal) {
      // Bought a Fake -> Disaster!
      const loss = -item.askPrice;
      state.verdictDelta = loss;
      state.verdictTitle = '偽物を掴んだ…!!';
      const mainClueTool = item.activeClues[0];
      state.verdictSub = item.def.clueSpots[mainClueTool].label;
    } else {
      // Rejected a Genuine Artifact -> Missed Fortune!
      state.verdictDelta = 0;
      state.verdictTitle = '痛恨の見逃し…!!';
      state.verdictSub = `本物だった！他店で ${formatYen(item.realValue)} で落札…`;
    }
  }

  function buildAuctionBids(start, target, isSecret) {
    const bidders = ['欧州の貴族', 'ドバイ石油王', '闇の収集家', '国立博物館', '伝説の富豪VIP'];
    const steps = isSecret ? 7 : 5;
    const bids = [];
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const eased = Math.pow(t, isSecret ? 1.35 : 1.05);
      const val = Math.round(lerp(start, target, eased) / 100) * 100;
      bids.push({
        who: bidders[(i - 1) % bidders.length],
        val,
        isFinal: i === steps,
      });
    }
    return bids;
  }

  function finalizeRoundCash() {
    state.cash += state.verdictDelta;
    state.history.push({
      id: state.item.def.id,
      name: state.item.def.name,
      isReal: state.item.isReal,
      isSecret: state.item.isSecret,
      correct: state.verdictCorrect,
      delta: state.verdictDelta,
    });
    if (state.verdictCorrect) {
      SFX.win(state.item.isSecret && state.playerChoice === 'buy');
      state.flashColor = state.item.isSecret ? '#fde047' : '#34d399';
      state.flashAlpha = 0.28;
      spawnParticles(W / 2, 420, state.item.isSecret ? 70 : 38,
        ['#fde047', '#f59e0b', '#fef08a', '#ffffff', '#34d399'], 340, 380);
      addFloatingText(W / 2, 134, `+${formatYen(state.verdictDelta)}`, '#fde047', 30);
      emitEvent('win', { delta: state.verdictDelta, isSecret: state.item.isSecret });
    } else {
      SFX.fail();
      state.shake = 18;
      state.flashColor = '#ef4444';
      state.flashAlpha = 0.32;
      if (state.verdictDelta < 0) {
        addFloatingText(W / 2, 134, formatYen(state.verdictDelta), '#fb7185', 30);
      }
      emitEvent('fail', { delta: state.verdictDelta });
    }
  }

  function finishGame() {
    state.screen = 'result';
    if (state.mode === 'campaign' && state.cash > saveData.bestProfit) {
      saveData.bestProfit = state.cash;
      writeSave(saveData);
    }
    if (state.mode === 'endless' && state.correctCount > saveData.bestEndless) {
      saveData.bestEndless = state.correctCount;
      writeSave(saveData);
    }
    emitEvent('result', { cash: state.cash, correct: state.correctCount });
  }

  // =========================================================================
  // SCANNER CLUE DETECTION
  // =========================================================================
  function checkScannerClues(dt) {
    if (!state.item || state.phase !== 'inspect') return;
    const item = state.item;

    // Scale tool auto-checks weight when activated
    if (state.tool === 'scale') {
      if (!state.scaleChecked && state.scaleAnim > 0.65) {
        state.scaleChecked = true;
        state.toolsUsed.scale = true;
        const isFakeWeight = item.activeClues.includes('scale');
        SFX.scaleTap(!isFakeWeight);
        if (isFakeWeight && !state.foundClues.some(c => c.tool === 'scale')) {
          const sp = item.def.clueSpots.scale;
          state.foundClues.push({ tool: 'scale', x: 0, y: 0, label: sp.label, isSecret: false, anim: 0 });
          SFX.clueFound(false);
          state.shake = 7;
          addFloatingText(W / 2, 360, '⚠️ 重量異常を検知！', '#fb7185', 22);
          emitEvent('clue', { tool: 'scale', isSecret: false });
        } else if (!isFakeWeight) {
          addFloatingText(W / 2, 360, '⚖️ 重量・打音 正常', '#34d399', 20);
        }
      }
      return;
    }

    if (!state.lensActive) return;

    // Convert lens canvas pos -> artifact local coords (-210..+210)
    const scaleFactor = 420 / ART_DRAW_SIZE;
    const lx = (state.lensX - ART_CENTER_X) * scaleFactor;
    const ly = (state.lensY - ART_CENTER_Y) * scaleFactor;

    if (Math.hypot(lx, ly) < 175) {
      state.toolsUsed[state.tool] = true;
      state.hasEverScanned = true;
      state.scanTickCooldown -= dt;
      if (state.scanTickCooldown <= 0 && (state.tool === 'xray' || state.tool === 'uv')) {
        SFX.scanTick();
        state.scanTickCooldown = 0.14;
      }
    }

    // Check active fake clue for current tool
    if (item.activeClues.includes(state.tool) && !state.foundClues.some(c => c.tool === state.tool)) {
      const sp = item.def.clueSpots[state.tool];
      const dist = Math.hypot(lx - sp.x, ly - sp.y);
      if (dist < sp.r) {
        state.clueHoldProgress += dt * 4.5;
        if (state.clueHoldProgress >= 1) {
          state.clueHoldProgress = 0;
          state.foundClues.push({ tool: state.tool, x: sp.x, y: sp.y, label: sp.label, isSecret: false, anim: 0 });
          SFX.clueFound(false);
          state.shake = 8;
          spawnParticles(state.lensX, state.lensY, 18, ['#fb7185', '#fde047', '#ffffff'], 180, 180);
          addFloatingText(state.lensX, state.lensY - 58, '⚠️ 偽造の証拠を発見！', '#fb7185', 21);
          emitEvent('clue', { tool: state.tool, isSecret: false });
        }
        return;
      }
    }

    // Check secret jackpot clue for current tool
    if (item.isSecret && item.def.secretSpot.tool === state.tool && !state.foundClues.some(c => c.isSecret)) {
      const sp = item.def.secretSpot;
      const dist = Math.hypot(lx - sp.x, ly - sp.y);
      if (dist < sp.r) {
        state.clueHoldProgress += dt * 4.2;
        if (state.clueHoldProgress >= 1) {
          state.clueHoldProgress = 0;
          state.foundClues.push({ tool: state.tool, x: sp.x, y: sp.y, label: sp.label, isSecret: true, anim: 0 });
          SFX.clueFound(true);
          state.shake = 9;
          spawnParticles(state.lensX, state.lensY, 26, ['#fde047', '#f59e0b', '#ffffff'], 220, 150);
          addFloatingText(state.lensX, state.lensY - 58, '✨ 超国宝の秘宝を発見！', '#fde047', 22);
          emitEvent('clue', { tool: state.tool, isSecret: true });
        }
        return;
      }
    }

    state.clueHoldProgress = Math.max(0, state.clueHoldProgress - dt * 3);
  }

  // =========================================================================
  // UI BUTTON HITBOX REGISTRY (Single source of truth for draw + pointer!)
  // =========================================================================
  let hitboxes = [];
  function registerHitbox(id, x, y, w, h, onClick) {
    hitboxes.push({ id, x, y, w, h, onClick });
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W,
      y: ((e.clientY - rect.top) / rect.height) * H,
    };
  }

  function handlePointerDown(e) {
    if (SHORTS_MODE) return;
    ensureAudio();
    const pos = getCanvasPos(e);
    const isTouch = e.pointerType === 'touch';

    // Check UI buttons first (reverse order so top modals take priority)
    for (let i = hitboxes.length - 1; i >= 0; i--) {
      const hb = hitboxes[i];
      if (pos.x >= hb.x && pos.x <= hb.x + hb.w && pos.y >= hb.y && pos.y <= hb.y + hb.h) {
        hb.onClick();
        return;
      }
    }

    // Play screen: dragging over velvet mat activates scanner lens!
    if (state.screen === 'play' && state.phase === 'inspect' && !state.showHelp) {
      if (pos.y >= 175 && pos.y <= 650 && state.tool !== 'scale') {
        state.pointerDown = true;
        state.lensActive = true;
        state.pointerX = pos.x;
        state.pointerY = pos.y;
        const offsetY = isTouch ? -44 : 0;
        state.lensX = clamp(pos.x, 45, W - 45);
        state.lensY = clamp(pos.y + offsetY, 200, 625);
      }
    }
  }

  function handlePointerMove(e) {
    if (SHORTS_MODE) return;
    const pos = getCanvasPos(e);
    const isTouch = e.pointerType === 'touch';

    if (state.screen === 'play' && state.phase === 'inspect' && state.tool !== 'scale' && !state.showHelp) {
      if (state.pointerDown) {
        state.pointerX = pos.x;
        state.pointerY = pos.y;
        const offsetY = isTouch ? -44 : 0;
        state.lensX = clamp(pos.x, 45, W - 45);
        state.lensY = clamp(pos.y + offsetY, 200, 625);
        state.lensActive = true;
      } else if (!isTouch && pos.y >= 205 && pos.y <= 635) {
        // Desktop hover preview for effortless feel!
        state.lensX = clamp(pos.x, 45, W - 45);
        state.lensY = clamp(pos.y, 205, 635);
        state.lensActive = true;
      } else if (!isTouch) {
        state.lensActive = false;
      }
    }
  }

  function handlePointerUp() {
    if (SHORTS_MODE) return;
    state.pointerDown = false;
  }

  canvas.addEventListener('pointerdown', handlePointerDown);
  window.addEventListener('pointermove', handlePointerMove);
  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);

  // Keyboard shortcuts for PC power players
  window.addEventListener('keydown', (e) => {
    if (SHORTS_MODE) return;
    if (state.screen === 'play' && state.phase === 'inspect') {
      if (e.key === '1') selectTool('loupe');
      if (e.key === '2') selectTool('uv');
      if (e.key === '3') selectTool('xray');
      if (e.key === '4') selectTool('scale');
    } else if (state.screen === 'play' && state.phase === 'verdict' && (e.key === 'Enter' || e.key === ' ')) {
      advanceAfterVerdict();
    }
  });

  function selectTool(toolId) {
    if (state.phase !== 'inspect') return;
    state.tool = toolId;
    state.clueHoldProgress = 0;
    SFX.toolClick(toolId);
    if (toolId === 'scale') {
      state.scaleAnim = 0;
      state.lensActive = false;
    }
  }

  function advanceAfterVerdict() {
    if (state.lives <= 0 || state.round >= state.maxRounds) {
      finishGame();
    } else {
      nextRound();
    }
  }

  // =========================================================================
  // SHORTS AUTO-CHOREOGRAPHY (18.0s Viral Showcase!)
  // =========================================================================
  let shortsStage = 0;
  function updateShortsChoreography(dt) {
    const t = state.elapsed;
    // Stage 0 (0.0s): Start right on Imperial Watch (FAKE with CR2032 Battery in X-Ray!)
    if (shortsStage === 0) {
      shortsStage = 1;
      state.screen = 'play';
      state.mode = 'campaign';
      state.lives = 3;
      state.cash = 1200;
      state.displayCash = 1200;
      state.hasEverScanned = true;
      nextRound({ id: 'watch', isReal: false, isSecret: false, clues: ['xray'] });
      state.tool = 'loupe';
    }
    // Stage 1 (0.4s..2.2s): Brief Loupe sweep on watch face
    if (t >= 0.4 && t < 2.2) {
      const p = (t - 0.4) / 1.8;
      state.tool = 'loupe';
      state.lensActive = true;
      state.lensX = ART_CENTER_X + Math.sin(p * Math.PI * 1.4) * 78;
      state.lensY = ART_CENTER_Y + Math.cos(p * Math.PI * 1.2) * 58;
    }
    // Stage 2 (2.2s..4.8s): Switch to X-RAY -> Sweep right over CR2032 Battery!!
    if (t >= 2.2 && t < 4.9) {
      if (shortsStage === 1) { shortsStage = 2; state.tool = 'xray'; emitEvent('tool', { tool: 'xray' }); }
      const p = clamp((t - 2.2) / 1.6, 0, 1);
      state.lensActive = true;
      state.lensX = lerp(ART_CENTER_X - 115, ART_CENTER_X + 6, easeOutCubic(p));
      state.lensY = lerp(ART_CENTER_Y - 70, ART_CENTER_Y + 14, easeOutCubic(p));
    }
    // Stage 3 (4.9s): Slam FAKE stamp!
    if (t >= 4.9 && shortsStage === 2) {
      shortsStage = 3;
      submitVerdict('reject');
    }
    // Stage 4 (7.4s): Next Artifact -> Ming Dragon Vase (SUPER JACKPOT SECRET!)
    if (t >= 7.4 && shortsStage === 3) {
      shortsStage = 4;
      nextRound({ id: 'vase', isReal: true, isSecret: true, clues: [] });
      state.tool = 'uv';
      emitEvent('next', { id: 'vase' });
    }
    // Stage 5 (7.9s..9.8s): Sweep UV Blacklight across vase neck -> Clean!
    if (t >= 7.9 && t < 9.9 && shortsStage === 4) {
      const p = (t - 7.9) / 2.0;
      state.tool = 'uv';
      state.lensActive = true;
      state.lensX = ART_CENTER_X + Math.sin(p * Math.PI * 1.6) * 76;
      state.lensY = ART_CENTER_Y - 70 + p * 55;
    }
    // Stage 6 (9.9s..12.5s): Switch to X-RAY -> Sweep to vase base -> SECRET GOLDEN TREASURE!!
    if (t >= 9.9 && t < 12.6) {
      if (shortsStage === 4) { shortsStage = 5; state.tool = 'xray'; emitEvent('tool', { tool: 'xray' }); }
      const p = clamp((t - 9.9) / 1.5, 0, 1);
      state.lensActive = true;
      state.lensX = lerp(ART_CENTER_X + 88, ART_CENTER_X, easeOutCubic(p));
      state.lensY = lerp(ART_CENTER_Y - 30, ART_CENTER_Y + 56, easeOutCubic(p));
    }
    // Stage 7 (12.6s): Slam BUY stamp -> MASSIVE ¥2億 AUCTION EXPLOSION!!
    if (t >= 12.6 && shortsStage === 5) {
      shortsStage = 6;
      submitVerdict('buy');
    }
  }

  // =========================================================================
  // MAIN UPDATE LOOP
  // =========================================================================
  function update(dt) {
    state.elapsed += dt;

    if (SHORTS_MODE) {
      updateShortsChoreography(dt);
    }

    // Smooth cash ticker
    state.displayCash += (state.cash - state.displayCash) * Math.min(1, dt * 8);

    // Decay screen shake & flash
    state.shake = Math.max(0, state.shake - dt * 42);
    state.flashAlpha = Math.max(0, state.flashAlpha - dt * 1.6);

    // Ambient dust motes
    for (const m of state.dustMotes) {
      m.x += m.vx * dt + Math.sin(state.elapsed * 0.9 + m.phase) * 4 * dt;
      m.y += m.vy * dt;
      if (m.y < 10) { m.y = H - 20; m.x = randRange(30, W - 30); }
      if (m.x < 10) m.x = W - 10;
      if (m.x > W - 10) m.x = 10;
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) { state.particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vrot * dt;
    }

    // Floating texts
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const f = state.floatingTexts[i];
      f.life -= dt;
      if (f.life <= 0) { state.floatingTexts.splice(i, 1); continue; }
      f.y -= 48 * dt;
    }

    if (state.screen === 'title') {
      state.titleDemoTime += dt;
      return;
    }

    if (state.screen !== 'play') return;

    // Play phases
    state.itemSlide = Math.min(1, state.itemSlide + dt * 3.4);
    state.phaseTimer += dt;

    for (const c of state.foundClues) {
      c.anim = Math.min(1, c.anim + dt * 4.5);
    }

    if (state.phase === 'inspect') {
      if (state.tool === 'scale') {
        state.scaleAnim = Math.min(1, state.scaleAnim + dt * 2.4);
      }
      checkScannerClues(dt);

      if (!SHORTS_MODE && !state.showHelp) {
        state.timeLeft -= dt;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          // Auto-reject on timeout
          submitVerdict('reject');
        }
      }
    } else if (state.phase === 'stamp') {
      state.stampAnim = Math.min(1, state.phaseTimer / 0.36);
      if (state.phaseTimer >= 0.72) {
        if (state.playerChoice === 'buy' && state.item.isReal) {
          state.phase = 'auction';
          state.phaseTimer = 0;
          SFX.gavel();
          emitEvent('auction_start');
        } else {
          state.phase = 'verdict';
          state.phaseTimer = 0;
          finalizeRoundCash();
        }
      }
    } else if (state.phase === 'auction') {
      const stepInterval = state.item.isSecret ? 0.34 : 0.36;
      const targetStep = Math.floor(state.phaseTimer / stepInterval);
      if (targetStep > state.auctionStep && state.auctionStep < state.auctionBids.length) {
        const bid = state.auctionBids[state.auctionStep];
        state.auctionStep++;
        state.auctionCurrent = bid.val;
        SFX.bidTick(state.auctionStep);
        state.shake = bid.isFinal ? 12 : 4;
        spawnParticles(W / 2, 360, bid.isFinal ? 36 : 8, ['#fde047', '#f59e0b', '#ffffff'], 240, 260);
        if (bid.isFinal) {
          SFX.gavel();
          emitEvent('auction_sold', { val: bid.val });
        }
      }
      const totalDur = state.auctionBids.length * stepInterval + 0.65;
      if (state.phaseTimer >= totalDur) {
        state.phase = 'verdict';
        state.phaseTimer = 0;
        finalizeRoundCash();
      }
    }
  }

  // =========================================================================
  // RENDERING — ANTIQUE MAHOGANY APPRAISAL STUDIO
  // =========================================================================
  function drawDeskBackground() {
    // Rich warm walnut/mahogany desk grain
    const woodGrad = ctx.createLinearGradient(0, 0, 0, H);
    woodGrad.addColorStop(0, '#1f120b');
    woodGrad.addColorStop(0.22, '#2d1a10');
    woodGrad.addColorStop(0.75, '#25150c');
    woodGrad.addColorStop(1, '#140b06');
    ctx.fillStyle = woodGrad;
    ctx.fillRect(0, 0, W, H);

    // Subtle horizontal wood grain streaks
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.16)';
    ctx.lineWidth = 2;
    for (let y = 18; y < H; y += 26) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(180, y + ((y % 52) - 26) * 0.15, 360, y - 4, W, y + 2);
      ctx.stroke();
    }

    // Overhead warm brass banker's lamp spotlight cone
    const lampGrad = ctx.createRadialGradient(W / 2, 220, 30, W / 2, 410, 420);
    lampGrad.addColorStop(0, 'rgba(255, 222, 150, 0.22)');
    lampGrad.addColorStop(0.5, 'rgba(218, 152, 62, 0.08)');
    lampGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
    ctx.fillStyle = lampGrad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawVelvetMat() {
    const mx = 22, my = 196, mw = W - 44, mh = 454;

    // Outer mahogany frame shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 8;
    const matGrad = ctx.createRadialGradient(W / 2, my + mh * 0.45, 30, W / 2, my + mh * 0.5, 320);
    matGrad.addColorStop(0, '#164232'); // Deep emerald-velvet museum appraisal mat!
    matGrad.addColorStop(0.7, '#0d2b20');
    matGrad.addColorStop(1, '#081b14');
    ctx.fillStyle = matGrad;
    roundRectPath(ctx, mx, my, mw, mh, 18);
    ctx.fill();
    ctx.restore();

    // Double antique brass embossed border
    ctx.strokeStyle = 'rgba(218, 174, 88, 0.55)';
    ctx.lineWidth = 2;
    roundRectPath(ctx, mx + 6, my + 6, mw - 12, mh - 12, 14);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(218, 174, 88, 0.22)';
    ctx.lineWidth = 1;
    roundRectPath(ctx, mx + 12, my + 12, mw - 24, mh - 24, 10);
    ctx.stroke();

    // Subtle appraisal grid & millimeter ruler at bottom of mat
    ctx.strokeStyle = 'rgba(218, 174, 88, 0.07)';
    ctx.lineWidth = 1;
    for (let x = mx + 44; x < mx + mw - 30; x += 36) {
      ctx.beginPath(); ctx.moveTo(x, my + 24); ctx.lineTo(x, my + mh - 32); ctx.stroke();
    }
    for (let y = my + 44; y < my + mh - 36; y += 36) {
      ctx.beginPath(); ctx.moveTo(mx + 24, y); ctx.lineTo(mx + mw - 24, y); ctx.stroke();
    }

    // Brass ruler ticks along bottom edge
    ctx.strokeStyle = 'rgba(218, 174, 88, 0.35)';
    ctx.fillStyle = 'rgba(218, 174, 88, 0.48)';
    ctx.font = '600 9px monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 20; i++) {
      const rx = mx + 38 + i * ((mw - 76) / 20);
      const tall = i % 5 === 0 ? 9 : 5;
      ctx.beginPath();
      ctx.moveTo(rx, my + mh - 14);
      ctx.lineTo(rx, my + mh - 14 - tall);
      ctx.stroke();
      if (i % 5 === 0) ctx.fillText(`${i}cm`, rx, my + mh - 26);

  function drawArtifactAndScanner() {
    if (!state.item) return;
    const slideOff = (1 - easeOutCubic(state.itemSlide)) * 280;
    const cx = ART_CENTER_X + slideOff;
    let cy = ART_CENTER_Y;

    // If Scale tool is active, draw Precision Brass/Digital Scale beneath the artifact!
    let scaleLift = 0;
    if (state.tool === 'scale' && state.phase === 'inspect') {
      const bounce = easeOutBack(state.scaleAnim);
      scaleLift = -22 * bounce;
      drawPrecisionScale(cx, cy + 132, bounce);
    }

    const drawX = cx - ART_DRAW_SIZE / 2;
    const drawY = cy + scaleLift - ART_DRAW_SIZE / 2;

    // Base Normal Artifact Layer
    ctx.drawImage(layerNormal, drawX, drawY, ART_DRAW_SIZE, ART_DRAW_SIZE);

    // Subtle UV room dim when UV Light is actively scanning
    if (state.lensActive && state.tool === 'uv' && state.phase === 'inspect') {
      ctx.save();
      roundRectPath(ctx, 22, 196, W - 44, 454, 18);
      ctx.clip();
      ctx.fillStyle = 'rgba(8, 3, 22, 0.56)';
      ctx.fillRect(22, 196, W - 44, 454);
      ctx.restore();
    }

    // ACTIVE REAL-TIME SCANNER LENS!
    if (state.lensActive && state.phase === 'inspect' && state.tool !== 'scale') {
      const lx = state.lensX;
      const ly = state.lensY;
      const lr = state.tool === 'loupe' ? 84 : 92;

      ctx.save();
      ctx.beginPath();
      ctx.arc(lx, ly, lr, 0, Math.PI * 2);
      ctx.clip();

      if (state.tool === 'loupe') {
        // 2.6x OPTICAL MAGNIFICATION directly from 840x840 HD buffer!
        ctx.fillStyle = '#0e2c21';
        ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
        const zoom = 2.6;
        const relX = (lx - cx) / ART_DRAW_SIZE; // -0.5..+0.5
        const relY = (ly - cy) / ART_DRAW_SIZE;
        const magSize = ART_DRAW_SIZE * zoom;
        ctx.drawImage(
          layerNormal,
          lx - (0.5 + relX) * magSize,
          ly - (0.5 + relY) * magSize,
          magSize,
          magSize
        );
        // Subtle optical glass sheen
        const glassGrad = ctx.createRadialGradient(lx - lr * 0.35, ly - lr * 0.35, 8, lx, ly, lr);
        glassGrad.addColorStop(0, 'rgba(255,255,255,0.22)');
        glassGrad.addColorStop(0.7, 'rgba(255,255,255,0)');
        glassGrad.addColorStop(1, 'rgba(0,0,0,0.28)');
        ctx.fillStyle = glassGrad;
        ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
      } else if (state.tool === 'uv') {
        // ULTRAVIOLET FLUORESCENCE LAYER
        ctx.fillStyle = '#090418';
        ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
        ctx.drawImage(layerUV, drawX, drawY, ART_DRAW_SIZE, ART_DRAW_SIZE);
        // Subtle animated fluorescent micro-flecks inside UV beam
        ctx.fillStyle = 'rgba(216, 180, 254, 0.35)';
        for (let k = 0; k < 8; k++) {
          const fx = lx + Math.sin(k * 2.3 + state.elapsed * 0.7) * (lr * 0.72);
          const fy = ly + Math.cos(k * 1.9 - state.elapsed * 0.6) * (lr * 0.72);
          ctx.beginPath(); ctx.arc(fx, fy, 1.3, 0, Math.PI * 2); ctx.fill();
        }
        // Violet beam vignette
        const uvGrad = ctx.createRadialGradient(lx, ly, lr * 0.25, lx, ly, lr);
        uvGrad.addColorStop(0, 'rgba(168, 85, 247, 0.08)');
        uvGrad.addColorStop(0.85, 'rgba(126, 34, 206, 0.22)');
        uvGrad.addColorStop(1, 'rgba(15, 5, 36, 0.72)');
        ctx.fillStyle = uvGrad;
        ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
      } else if (state.tool === 'xray') {
        // CLINICAL X-RAY RADIOGRAPH LAYER
        ctx.fillStyle = '#04121d';
        ctx.fillRect(lx - lr, ly - lr, lr * 2, lr * 2);
        ctx.drawImage(layerXRay, drawX, drawY, ART_DRAW_SIZE, ART_DRAW_SIZE);
        // Animated horizontal radiograph scanlines + sweep bar
        ctx.fillStyle = 'rgba(56, 189, 248, 0.11)';
        for (let sy = ly - lr; sy < ly + lr; sy += 4) {
          ctx.fillRect(lx - lr, sy, lr * 2, 1.4);
        }
        const sweepY = ly - lr + ((state.elapsed * 140) % (lr * 2));
        ctx.fillStyle = 'rgba(186, 230, 253, 0.35)';
        ctx.fillRect(lx - lr, sweepY, lr * 2, 3);
      }
      ctx.restore();

      // Physical Lens Frame / Rim
      ctx.save();
      if (state.tool === 'loupe') {
        // Ornate brass loupe ring + handle stub
        ctx.strokeStyle = '#926014';
        ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(lx, ly, lr + 3, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(lx, ly, lr + 2, 0, Math.PI * 2); ctx.stroke();
        // Brass crosshair
        ctx.strokeStyle = 'rgba(254, 240, 138, 0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(lx - 14, ly); ctx.lineTo(lx + 14, ly);
        ctx.moveTo(lx, ly - 14); ctx.lineTo(lx, ly + 14);
        ctx.stroke();
      } else if (state.tool === 'uv') {
        ctx.shadowColor = '#a855f7';
        ctx.shadowBlur = 18;
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(18, 7, 38, 0.88)';
        roundRectPath(ctx, lx - 38, ly - lr - 23, 76, 18, 9);
        ctx.fill();
        ctx.fillStyle = '#e9d5ff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('UV 365nm', lx, ly - lr - 10);
      } else if (state.tool === 'xray') {
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 16;
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.arc(lx, ly, lr, 0, Math.PI * 2); ctx.stroke();
        // Clinical reticle ticks
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 2;
        for (let a = 0; a < 4; a++) {
          const ang = a * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(lx + Math.cos(ang) * (lr - 10), ly + Math.sin(ang) * (lr - 10));
          ctx.lineTo(lx + Math.cos(ang) * (lr + 6), ly + Math.sin(ang) * (lr + 6));
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(4, 18, 29, 0.9)';
        roundRectPath(ctx, lx - 42, ly - lr - 23, 84, 18, 9);
        ctx.fill();
        ctx.fillStyle = '#bae6fd';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('X-RAY 85kV', lx, ly - lr - 10);
      }

      // Lock-on Progress Arc when hovering over a clue!
      if (state.clueHoldProgress > 0.05) {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(lx, ly, lr + 8, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * state.clueHoldProgress);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Draw Discovered Evidence Pins right on the Artifact (outer dashed frame so text stays legible!)
    const toScreen = ART_DRAW_SIZE / 420;
    for (const c of state.foundClues) {
      if (c.tool === 'scale') continue;
      const px = cx + c.x * toScreen;
      const py = cy + scaleLift + c.y * toScreen;
      const pulse = 1 + Math.sin(state.elapsed * 7) * 0.08;
      const ringR = (c.isSecret ? 30 : 44) * c.anim * pulse;
      ctx.save();
      ctx.strokeStyle = c.isSecret ? '#fde047' : '#fb7185';
      ctx.lineWidth = 2.6;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.arc(px, py, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      const badgeX = px + ringR * 0.76;
      const badgeY = py - ringR * 0.76;
      ctx.fillStyle = c.isSecret ? '#facc15' : '#e11d48';
      ctx.beginPath();
      ctx.arc(badgeX, badgeY, 13 * c.anim, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.fillStyle = c.isSecret ? '#1c0f06' : '#ffffff';
      ctx.font = '900 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(c.isSecret ? '★' : '!', badgeX, badgeY + 0.5);
      ctx.restore();
    }

    // First-time gentle drag hint pulse
    if (!state.hasEverScanned && state.phase === 'inspect' && state.tool !== 'scale' && !SHORTS_MODE) {
      const hx = cx + Math.sin(state.elapsed * 2.4) * 58;
      const hy = cy + Math.cos(state.elapsed * 2.4) * 28;
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
      roundRectPath(ctx, hx - 96, hy - 18, 192, 34, 17);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#e0f2fe';
      ctx.font = '800 13px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('👆 指でなぞって透視！', hx, hy + 4);
      ctx.restore();
    }
  }

  function drawPrecisionScale(cx, cy, anim) {
    const item = state.item;
    const isFakeWeight = item.activeClues.includes('scale');
    const dispWeight = Math.round(item.measuredWeight * clamp(anim, 0, 1));

    // Brass weighing platform under item
    ctx.save();
    const panGrad = ctx.createLinearGradient(cx - 120, cy, cx + 120, cy);
    panGrad.addColorStop(0, '#855812');
    panGrad.addColorStop(0.5, '#f6d170');
    panGrad.addColorStop(1, '#784c0c');
    ctx.fillStyle = panGrad;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 16, 128, 22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Digital Readout Box
    const bx = cx - 152, by = cy + 32, bw = 304, bh = 54;
    ctx.fillStyle = '#111827';
    roundRectPath(ctx, bx, by, bw, bh, 12);
    ctx.fill();
    ctx.strokeStyle = state.scaleChecked ? (isFakeWeight ? '#fb7185' : '#34d399') : '#d4a853';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.textAlign = 'left';
    ctx.fillStyle = state.scaleChecked ? (isFakeWeight ? '#fb7185' : '#34d399') : '#fde047';
    ctx.font = '900 26px monospace';
    ctx.fillText(`${dispWeight.toLocaleString()}g`, bx + 16, by + 35);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#94a3b8';
    ctx.font = '700 11px "Noto Sans JP", sans-serif';
    ctx.fillText(`規定 ${item.def.realWeight.toLocaleString()}g`, bx + bw - 14, by + 22);
    ctx.fillStyle = state.scaleChecked ? (isFakeWeight ? '#fda4af' : '#6ee7b7') : '#fde68a';
    ctx.font = '800 13px "Noto Sans JP", sans-serif';

    ctx.fillText(statusTxt, bx + bw - 14, by + 42);
    ctx.restore();
  }

      ctx.strokeStyle = active ? t.color : 'rgba(218, 174, 88, 0.3)';

      ctx.restore();

      ctx.textAlign = 'center';

      ctx.fillText(t.name, tx + tw / 2, dockY + 53);
      ctx.fillStyle = active ? t.color : '#9c8669';

        ctx.fillText('✓', tx + tw - 12, dockY + 16);
      }

      registerHitbox(`tool_${t.id}`, tx, dockY, tw, th, () => selectTool(t.id));
    });

    // Two Huge Tactile Rubber Stamp Decision Buttons!
    const sy = 804;
    const sw = (W - 44 - 16) / 2;
    const sh = 104;

    // LEFT: FAKE / REJECT (Crimson Stamp)
    const fx = 22;
    const fakeGrad = ctx.createLinearGradient(fx, sy, fx, sy + sh);
    fakeGrad.addColorStop(0, '#dc2626');
    fakeGrad.addColorStop(1, '#7f1d1d');
    ctx.save();
    ctx.shadowColor = 'rgba(220, 38, 38, 0.35)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = fakeGrad;
    roundRectPath(ctx, fx, sy, sw, sh, 16);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#fca5a5';
    ctx.lineWidth = 2;
    roundRectPath(ctx, fx + 4, sy + 4, sw - 8, sh - 8, 12);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff1f2';
    ctx.font = '900 28px "Shippori Mincho", serif';
    ctx.fillText('贋作・却下', fx + sw / 2, sy + 48);
    ctx.fillStyle = '#fecdd3';
    ctx.font = '800 13px "Noto Sans JP", sans-serif';
    ctx.fillText('偽物と見抜いて追い返す', fx + sw / 2, sy + 78);
    registerHitbox('btn_fake', fx, sy, sw, sh, () => submitVerdict('reject'));

    // RIGHT: GENUINE / BUY (Emerald-Gold Stamp)
    const bx = 22 + sw + 16;
    const buyGrad = ctx.createLinearGradient(bx, sy, bx, sy + sh);
    buyGrad.addColorStop(0, '#16a34a');
    buyGrad.addColorStop(1, '#14532d');
    ctx.save();
    ctx.shadowColor = 'rgba(22, 163, 74, 0.38)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = buyGrad;
    roundRectPath(ctx, bx, sy, sw, sh, 16);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 2.2;
    roundRectPath(ctx, bx + 4, sy + 4, sw - 8, sh - 8, 12);
    ctx.stroke();

    ctx.fillStyle = '#fefce8';
    ctx.font = '900 28px "Shippori Mincho", serif';
    ctx.fillText('真作・買取', bx + sw / 2, sy + 48);
    ctx.fillStyle = '#fef08a';
    ctx.font = '800 13px "Noto Sans JP", sans-serif';
    ctx.fillText(`${formatYen(state.item.askPrice)}で買い取る`, bx + sw / 2, sy + 78);
    registerHitbox('btn_buy', bx, sy, sw, sh, () => submitVerdict('buy'));
  }

  function drawStampOverlay() {
    const t = easeOutBack(state.stampAnim);
    const scale = lerp(2.4, 1.0, clamp(state.stampAnim, 0, 1));
    const isBuy = state.playerChoice === 'buy';

    ctx.save();
    ctx.translate(W / 2, ART_CENTER_Y);
    ctx.rotate(isBuy ? -0.14 : 0.14);
    ctx.scale(scale, scale);
    ctx.globalAlpha = clamp(state.stampAnim * 1.6, 0, 0.96);

    const col = isBuy ? '#16a34a' : '#dc2626';
    ctx.fillStyle = isBuy ? 'rgba(20, 83, 45, 0.88)' : 'rgba(127, 29, 29, 0.9)';
    roundRectPath(ctx, -155, -62, 310, 124, 16);
    ctx.fill();
    ctx.strokeStyle = isBuy ? '#fde047' : '#fca5a5';
    ctx.lineWidth = 7;
    ctx.stroke();
    ctx.lineWidth = 2;
    roundRectPath(ctx, -143, -50, 286, 100, 10);
    ctx.stroke();

    ctx.fillStyle = isBuy ? '#fef08a' : '#fff1f2';
    ctx.font = '900 54px "Shippori Mincho", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isBuy ? '真 作' : '贋 作', 0, -4);
    ctx.font = '800 15px "Cinzel", serif';
    ctx.fillText(isBuy ? 'AUTHENTIC • BUY' : 'FORGERY • REJECT', 0, 34);
    ctx.restore();
  }

  function drawAuctionOverlay() {
    // Dramatic Dark Gold Auction Spotlight
    ctx.fillStyle = 'rgba(10, 6, 4, 0.78)';
    ctx.fillRect(0, 86, W, H - 86);

    const cardX = 30, cardY = 215, cardW = W - 60, cardH = 440;
    const bg = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
    bg.addColorStop(0, '#2a190e');
    bg.addColorStop(1, '#140b06');
    ctx.fillStyle = bg;
    roundRectPath(ctx, cardX, cardY, cardW, cardH, 22);
    ctx.fill();
    ctx.strokeStyle = state.item.isSecret ? '#fde047' : '#d4a853';
    ctx.lineWidth = state.item.isSecret ? 3.5 : 2.5;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = state.item.isSecret ? '#fde047' : '#e5bd66';
    ctx.font = '900 15px "Cinzel", "Noto Sans JP", sans-serif';
    ctx.fillText(state.item.isSecret ? '✨ ★ 超国宝 特別オークション ★ ✨' : '🔨 闇オークション 競り中!!', W / 2, cardY + 42);

    ctx.fillStyle = '#f6e7c1';
    ctx.font = '800 20px "Shippori Mincho", serif';
    ctx.fillText(state.item.def.name, W / 2, cardY + 76);

    // Big Escalating Price Counter
    const pulse = 1 + Math.sin(state.elapsed * 18) * 0.03;
    ctx.save();
    ctx.translate(W / 2, cardY + 158);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = state.item.isSecret ? '#fef08a' : '#fde047';
    ctx.font = '900 50px "Cinzel", "Noto Sans JP", sans-serif';
    ctx.fillText(formatYen(state.auctionCurrent), 0, 0);
    ctx.restore();

    ctx.fillStyle = '#86efac';
    ctx.font = '700 14px "Noto Sans JP", sans-serif';
    ctx.fillText(`買値 ${formatYen(state.item.askPrice)} → 急騰中！`, W / 2, cardY + 198);

    // Live Bidder Feed
    const visibleCount = Math.min(state.auctionStep, state.auctionBids.length);
    const startIdx = Math.max(0, visibleCount - 4);
    for (let i = startIdx; i < visibleCount; i++) {
      const b = state.auctionBids[i];
      const rowY = cardY + 232 + (i - startIdx) * 46;
      const isLast = i === visibleCount - 1;
      ctx.fillStyle = isLast ? 'rgba(250, 204, 21, 0.2)' : 'rgba(255,255,255,0.05)';
      roundRectPath(ctx, cardX + 22, rowY, cardW - 44, 38, 10);
      ctx.fill();
      if (isLast) {
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.textAlign = 'left';
      ctx.fillStyle = isLast ? '#fef08a' : '#cbd5e1';
      ctx.font = '700 14px "Noto Sans JP", sans-serif';
      ctx.fillText(`🙋 ${b.who}`, cardX + 36, rowY + 24);
      ctx.textAlign = 'right';
      ctx.fillStyle = isLast ? '#fde047' : '#e2e8f0';
      ctx.font = '900 16px "Noto Sans JP", sans-serif';
      ctx.fillText(formatYen(b.val), cardX + cardW - 36, rowY + 24);
    }
  }

  function drawVerdictOverlay() {
    ctx.fillStyle = 'rgba(10, 6, 4, 0.72)';
    ctx.fillRect(0, 86, W, H - 86);

    const cx = 32, cy = 228, cw = W - 64, ch = 438;
    const ok = state.verdictCorrect;
    const isSecretWin = ok && state.item.isSecret && state.playerChoice === 'buy';

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.75)';
    ctx.shadowBlur = 32;
    const cardGrad = ctx.createLinearGradient(cx, cy, cx, cy + ch);
    cardGrad.addColorStop(0, ok ? (isSecretWin ? '#3a2709' : '#122e22') : '#381016');
    cardGrad.addColorStop(1, '#120a07');
    ctx.fillStyle = cardGrad;
    roundRectPath(ctx, cx, cy, cw, ch, 22);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = ok ? (isSecretWin ? '#fde047' : '#34d399') : '#fb7185';
    ctx.lineWidth = 3;
    roundRectPath(ctx, cx, cy, cw, ch, 22);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = '46px sans-serif';
    ctx.fillText(isSecretWin ? '👑' : (ok ? '⚖️' : '💥'), W / 2, cy + 66);

    ctx.fillStyle = ok ? (isSecretWin ? '#fde047' : '#6ee7b7') : '#fda4af';
    ctx.font = '900 30px "Shippori Mincho", "Noto Sans JP", serif';
    ctx.fillText(state.verdictTitle, W / 2, cy + 114);

    // Big Profit/Loss Number
    ctx.fillStyle = state.verdictDelta > 0 ? '#fde047' : (state.verdictDelta < 0 ? '#fb7185' : '#cbd5e1');
    ctx.font = '900 40px "Cinzel", "Noto Sans JP", sans-serif';
    const dSign = state.verdictDelta > 0 ? '+' : '';
    ctx.fillText(`${dSign}${formatYen(state.verdictDelta)}`, W / 2, cy + 174);

    // Explanation box (always explains the exact truth/forgery!)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    roundRectPath(ctx, cx + 20, cy + 202, cw - 40, 126, 14);
    ctx.fill();

    ctx.fillStyle = '#e5bd66';
    ctx.font = '800 13px "Noto Sans JP", sans-serif';
    const truthLabel = state.item.isReal
      ? (state.item.isSecret ? '【鑑定結果：超国宝・本物】' : '【鑑定結果：真作・本物】')
      : '【鑑定結果：精巧な贋作（偽物）】';
    ctx.fillText(truthLabel, W / 2, cy + 230);

    ctx.fillStyle = '#f8fafc';
    ctx.font = '700 14px "Noto Sans JP", sans-serif';
    wrapText(ctx, state.verdictSub, W / 2, cy + 260, cw - 68, 22);

    if (!state.item.isReal && state.item.activeClues.length > 0) {
      const cTool = state.item.activeClues[0];
      ctx.fillStyle = '#fda4af';
      ctx.font = '700 12.5px "Noto Sans JP", sans-serif';
      ctx.fillText(`決め手：${state.item.def.clueSpots[cTool].label}`, W / 2, cy + 312);
    } else if (state.item.isSecret) {
      ctx.fillStyle = '#fef08a';
      ctx.font = '700 12.5px "Noto Sans JP", sans-serif';
      ctx.fillText(state.item.def.secretSpot.label, W / 2, cy + 312);
    }

    // Next Button
    const bx = cx + 28, by = cy + 350, bw = cw - 56, bh = 64;
    const isGameOver = state.lives <= 0 || state.round >= state.maxRounds;
    const btnGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
    btnGrad.addColorStop(0, '#fcd34d');
    btnGrad.addColorStop(1, '#b47412');
    ctx.fillStyle = btnGrad;
    roundRectPath(ctx, bx, by, bw, bh, 14);
    ctx.fill();
    ctx.fillStyle = '#1c0f06';
    ctx.font = '900 20px "Noto Sans JP", sans-serif';
    ctx.fillText(isGameOver ? '最終鑑定結果を見る →' : '次の骨董品を鑑定する →', W / 2, by + 39);
    registerHitbox('next_round', bx, by, bw, bh, advanceAfterVerdict);
  }

  function drawHelpModal() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
    ctx.fillRect(0, 0, W, H);

    const mx = 34, my = 180, mw = W - 68, mh = 560;
    ctx.fillStyle = '#1f130c';
    roundRectPath(ctx, mx, my, mw, mh, 20);
    ctx.fill();
    ctx.strokeStyle = '#d4a853';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fde047';
    ctx.font = '900 22px "Shippori Mincho", serif';
    ctx.fillText('鑑定マニュアル', W / 2, my + 46);

    const rows = [
      ['🔍 ルーペ', '骨董品を2.6倍拡大！底面の銘や年号、サインの偽造を見抜け。'],
      ['🟣 UVライト', '肉眼で見えない蛍光インク・接着剤の亀裂・隠し紋章を発光！'],
      ['🩻 X線スキャナー', '内部を完全透視！現代の乾電池・鉄釘・空洞、あるいは隠し秘宝を発見！'],
      ['⚖️ 電子秤', 'タップで計量＆打音チェック！規定重量と大きく違えば偽物確定。'],
      ['💎 超国宝シークレット', '本物の中には隠し秘宝が眠る品も！見抜けば落札額が約3倍に爆騰！'],
    ];

    ctx.textAlign = 'left';
    rows.forEach(([title, body], idx) => {
      const ry = my + 86 + idx * 80;
      ctx.fillStyle = '#fde68a';
      ctx.font = '800 15px "Noto Sans JP", sans-serif';
      ctx.fillText(title, mx + 24, ry);
      ctx.fillStyle = '#e2d5c0';
      ctx.font = '500 13px "Noto Sans JP", sans-serif';
      wrapTextLeft(ctx, body, mx + 24, ry + 22, mw - 48, 19);
    });

    const bx = mx + 60, by = my + mh - 74, bw = mw - 120, bh = 52;
    ctx.fillStyle = '#d9961f';
    roundRectPath(ctx, bx, by, bw, bh, 12);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1c0f06';
    ctx.font = '900 17px "Noto Sans JP", sans-serif';
    ctx.fillText('閉じる', W / 2, by + 32);
    registerHitbox('close_help', 0, 0, W, H, () => { state.showHelp = false; });
  }

  // =========================================================================
  // RESULT CERTIFICATE SCREEN
  // =========================================================================
  function getAppraiserRank(cash, lives, accuracy) {
    if (lives <= 0 && cash <= 0) return { grade: 'F', title: '闇市で破産…', color: '#fb7185' };
    if (cash >= 35000 && accuracy >= 0.85) return { grade: 'SSS', title: '伝説の闇鑑定王', color: '#fde047' };
    if (cash >= 20000) return { grade: 'S', title: '国宝の絶対目利き', color: '#f59e0b' };
    if (cash >= 10000) return { grade: 'A', title: '一流オークション鑑定士', color: '#34d399' };
    if (cash >= 3000) return { grade: 'B', title: '一人前の古美術商', color: '#38bdf8' };
    return { grade: 'C', title: '見習い鑑定士', color: '#cbd5e1' };
  }

  function drawResultScreen() {
    drawDeskBackground();

    // Vintage Gilded Certificate Paper
    const cx = 28, cy = 62, cw = W - 56, ch = 664;
    const pGrad = ctx.createLinearGradient(cx, cy, cx, cy + ch);
    pGrad.addColorStop(0, '#fcf5e3');
    pGrad.addColorStop(1, '#e7d2ab');
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.65)';
    ctx.shadowBlur = 28;
    ctx.fillStyle = pGrad;
    roundRectPath(ctx, cx, cy, cw, ch, 18);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = '#b4832c';
    ctx.lineWidth = 4;
    roundRectPath(ctx, cx + 10, cy + 10, cw - 20, ch - 20, 12);
    ctx.stroke();

    const acc = state.history.length ? state.correctCount / state.history.length : 0;
    const rank = getAppraiserRank(state.cash, state.lives, acc);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#7c4e15';
    ctx.font = '800 13px "Cinzel", serif';
    ctx.fillText('OFFICIAL APPRAISAL CERTIFICATE', W / 2, cy + 48);

    ctx.fillStyle = '#24140a';
    ctx.font = '900 28px "Shippori Mincho", serif';
    ctx.fillText(state.lives <= 0 ? '鑑定営業 終了' : '闇オークション 完遂！', W / 2, cy + 88);

    // Wax Seal Rank Badge
    ctx.save();
    ctx.fillStyle = '#991b1b';
    ctx.beginPath(); ctx.arc(W / 2, cy + 162, 52, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(W / 2, cy + 162, 44, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = rank.color;
    ctx.font = '900 38px "Cinzel", serif';
    ctx.fillText(rank.grade, W / 2, cy + 174);
    ctx.restore();

    ctx.fillStyle = '#451a03';
    ctx.font = '900 20px "Shippori Mincho", serif';
    ctx.fillText(`称号：${rank.title}`, W / 2, cy + 242);

    // Total Profit Banner
    ctx.fillStyle = '#23140b';
    roundRectPath(ctx, cx + 28, cy + 262, cw - 56, 86, 14);
    ctx.fill();
    ctx.fillStyle = '#d4a853';
    ctx.font = '700 12px "Noto Sans JP", sans-serif';
    ctx.fillText('最終獲得資産', W / 2, cy + 288);
    ctx.fillStyle = state.cash >= 0 ? '#fde047' : '#fb7185';
    ctx.font = '900 38px "Cinzel", "Noto Sans JP", sans-serif';
    ctx.fillText(formatYen(state.cash), W / 2, cy + 332);

    // Stats Row
    const stats = [
      ['正解数', `${state.correctCount} / ${state.history.length}`],
      ['最大連勝', `${state.maxStreak}連続`],
      ['図鑑発見', `${saveData.discovered.length} / ${ARTIFACT_DEFS.length}`],
    ];
    stats.forEach(([lbl, val], i) => {
      const sx = cx + 28 + i * ((cw - 56) / 3);
      const sw = (cw - 56) / 3 - 8;
      ctx.fillStyle = 'rgba(120, 72, 24, 0.12)';
      roundRectPath(ctx, sx + 4, cy + 364, sw, 64, 10);
      ctx.fill();
      ctx.fillStyle = '#6b421c';
      ctx.font = '700 12px "Noto Sans JP", sans-serif';
      ctx.fillText(lbl, sx + sw / 2 + 4, cy + 388);
      ctx.fillStyle = '#24140a';
      ctx.font = '900 18px "Noto Sans JP", sans-serif';
      ctx.fillText(val, sx + sw / 2 + 4, cy + 414);
    });

    // Item History List (up to 7 rows)
    ctx.textAlign = 'left';
    const showList = state.history.slice(-7);
    showList.forEach((h, i) => {
      const ry = cy + 452 + i * 28;
      ctx.fillStyle = i % 2 === 0 ? 'rgba(120, 72, 24, 0.08)' : 'transparent';
      ctx.fillRect(cx + 28, ry - 16, cw - 56, 24);
      ctx.fillStyle = '#24140a';
      ctx.font = '700 13px "Noto Sans JP", sans-serif';
      const icon = h.correct ? (h.isSecret ? '💎' : '⭕') : '❌';
      ctx.fillText(`${icon} ${h.name}`, cx + 36, ry);
      ctx.textAlign = 'right';
      ctx.fillStyle = h.delta > 0 ? '#15803d' : (h.delta < 0 ? '#b91c1c' : '#64748b');
      ctx.font = '800 13px "Noto Sans JP", sans-serif';
      ctx.fillText(`${h.delta > 0 ? '+' : ''}${formatYen(h.delta)}`, cx + cw - 36, ry);
      ctx.textAlign = 'left';
    });

    // Action Buttons below certificate
    const b1 = { x: 28, y: 748, w: W - 56, h: 72 };
    const b1g = ctx.createLinearGradient(b1.x, b1.y, b1.x, b1.y + b1.h);
    b1g.addColorStop(0, '#fcd34d');
    b1g.addColorStop(1, '#b47412');
    ctx.fillStyle = b1g;
    roundRectPath(ctx, b1.x, b1.y, b1.w, b1.h, 16);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#1c0f06';
    ctx.font = '900 22px "Noto Sans JP", sans-serif';
    ctx.fillText('もう一度 鑑定する', W / 2, b1.y + 44);
    registerHitbox('retry', b1.x, b1.y, b1.w, b1.h, () => startGame(state.mode));

    const b2 = { x: 28, y: 836, w: W - 56, h: 58 };
    ctx.fillStyle = 'rgba(28, 16, 10, 0.92)';
    roundRectPath(ctx, b2.x, b2.y, b2.w, b2.h, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(218, 174, 88, 0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#f6e7c1';
    ctx.font = '800 16px "Noto Sans JP", sans-serif';
    ctx.fillText('タイトルへ戻る', W / 2, b2.y + 35);
    registerHitbox('back_title', b2.x, b2.y, b2.w, b2.h, () => {
      state.screen = 'title';
      titlePreviewBuilt = false;
    });
  }

  function wrapText(c, text, cx, y, maxW, lh) {
    let line = '';
    let yy = y;
    for (const ch of text) {
      if (c.measureText(line + ch).width > maxW) {
        c.fillText(line, cx, yy);
        line = ch;
        yy += lh;
      } else line += ch;
    }
    if (line) c.fillText(line, cx, yy);
  }

  function wrapTextLeft(c, text, x, y, maxW, lh) {
    let line = '';
    let yy = y;
    for (const ch of text) {
      if (c.measureText(line + ch).width > maxW) {
        c.fillText(line, x, yy);
        line = ch;
        yy += lh;
      } else line += ch;
    }
    if (line) c.fillText(line, x, yy);
  }

  // =========================================================================
  // GLOBAL FX & MASTER RENDER
  // =========================================================================
  function drawEffects() {
    // Floating ambient lamp dust motes
    for (const m of state.dustMotes) {
      ctx.fillStyle = `rgba(255, 226, 150, ${m.a})`;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Confetti & Sparkle Particles
    for (const p of state.particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
      else { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.55, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }

    // Floating Texts
    for (const f of state.floatingTexts) {
      const a = clamp(f.life / f.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `900 ${f.size}px "Noto Sans JP", sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.lineWidth = 5;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // Screen Flash
    if (state.flashAlpha > 0.01 && state.flashColor) {
      ctx.fillStyle = state.flashColor;
      ctx.globalAlpha = state.flashAlpha;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    hitboxes = [];
    ctx.save();
    if (state.shake > 0.2) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    if (state.screen === 'title') {
      drawTitleScreen();
    } else if (state.screen === 'play') {
      drawDeskBackground();
      drawVelvetMat();
      drawSpecCard();
      drawArtifactAndScanner();
      drawEvidenceBanner();
      drawToolDockAndStamps();
      drawTopHUD();

      if (state.phase === 'stamp') drawStampOverlay();
      else if (state.phase === 'auction') drawAuctionOverlay();
      else if (state.phase === 'verdict') drawVerdictOverlay();

      if (state.showHelp) drawHelpModal();
    } else if (state.screen === 'result') {
      drawResultScreen();
    }

    drawEffects();
    ctx.restore();
  }

  // Deterministic stepping hook for Shorts frame capture
  window.__stepFrame = (dt = 1 / 60) => {
    update(dt);
    render();
  };

  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    if (!window.__manualStep) {
      update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
