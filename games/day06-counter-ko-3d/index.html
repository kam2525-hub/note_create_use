  let rngSeed = SHORTS_MODE ? 20260606 : ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
  function rand() {
    rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
    return rngSeed / 4294967296;
  }
  function randRange(a, b) { return a + (b - a) * rand(); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    const x = clamp(t, 0, 1);
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  // =========================================================================
  // WEB AUDIO ENGINE (iOS Safari compatible, muted in SHORTS_MODE)
  // =========================================================================
  let audioCtx = null;
  function unlockAudio() {
    if (SHORTS_MODE || save.muted) return;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }

  function playTone(freq, freqEnd, dur, type = 'sine', gainVal = 0.2, delay = 0) {
    if (SHORTS_MODE || save.muted || !audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + dur);
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  function playNoise(dur, gainVal = 0.2, highpass = 400, delay = 0) {
    if (SHORTS_MODE || save.muted || !audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.setValueAtTime(highpass, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(audioCtx.destination);
    src.start(now);
  }

    swipeCue: { dir: '', timer: 0 },

    // VFX Particles & Popups & Camera Flashes
    particles: [],
    rings: [],
    popups: [],
    crowdFlashes: [],
    uiButtons: [],
  };

  function getDiff() { return DIFFICULTIES[state.diffId]; }

  function setBanner(text, sub = '', color = '#fde047', dur = 0.85) {
    state.banner = { text, sub, color, timer: dur, dur, scale: 1.35 };
  }

  function addPopup(text, x, y, color = '#ffffff', size = 28, dur = 0.72) {
    state.popups.push({ text, x, y, color, size, timer: dur, dur, vy: -95 });
  }

  function spawnParticles(x, y, count, colors, speedMin = 120, speedMax = 460, sizeMin = 3, sizeMax = 9) {
    for (let i = 0; i < count; i++) {
      const ang = randRange(0, Math.PI * 2);
      const spd = randRange(speedMin, speedMax);
      state.particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - randRange(40, 140),
        size: randRange(sizeMin, sizeMax),
        color: colors[randInt(0, colors.length - 1)],
        life: randRange(0.24, 0.56),
        maxLife: 0.56,
        grav: randRange(420, 880),
        kind: rand() < 0.35 ? 'spark' : 'dot',
      });
    }
  }

  function spawnRing(x, y, color, maxR = 220, dur = 0.32, lineW = 10) {
    state.rings.push({ x, y, color, maxR, timer: dur, dur, lineW });
  }

  function triggerCrowdFlashes(n = 8) {
    for (let i = 0; i < n; i++) {
      state.crowdFlashes.push({
        x: randRange(25, W - 25),
        y: randRange(130, 390),
        r: randRange(12, 34),
        timer: randRange(0.14, 0.34),
        dur: 0.34,
      });
    }
  }

  // =========================================================================
  // START FIGHT
  // =========================================================================
  function startFight(diffId, stageIdx, skipIntro = false) {
    state.diffId = diffId;
    state.stageIdx = clamp(stageIdx, 0, 4);
    const cfg = ROSTER[diffId][state.stageIdx];

    state.screen = 'fight';
    state.fightTime = 0;
    state.hitstop = 0;
    state.slowMoTimer = 0;
    state.slowMoScale = 1.0;
    state.screenShake = 0;
    state.flashAlpha = 0;
    state.speedLines = 0;
    state.vignetteRed = 0;
    state.camX = 0; state.camY = 0; state.camZ = 0; state.camRoll = 0; state.camFovBoost = 0;

    state.player = {
      hp: 100,
      maxHp: 100,
      koGauge: 0,
      combo: 0,
      maxCombo: 0,
      justCount: 0,
      dodgeDir: 'none',
      dodgeTimer: 0,
      dodgeDur: 0.30,
      dodgeCooldown: 0,
      dodgeQuality: 'none',
      dodgeInvuln: 0,
      punchSide: 'none',
      punchTimer: 0,
      punchDur: 0.18,
      punchHitDone: false,
      hurtTimer: 0,
      guarding: false,
    };

    state.enemy = {
      cfg,
      hp: cfg.hp,
      maxHp: cfg.hp,
      state: skipIntro ? 'idle' : 'intro',
      stateTimer: skipIntro ? 0.3 : 0.95,
      attackType: 'left_hook',
      windupDur: cfg.windup,
      comboLeft: 0,
      counterWindow: 0,
      counterBonus: 1.0,
      guardHigh: false,
      hitRecoilX: 0,
      hitRecoilY: 0,
      hitRecoilZ: 0,
      hitFlash: 0,
      bobPhase: 0,
      koProgress: 0,
      attackResolved: false,
      feintDir: 'left_hook',
    };

    state.particles = [];
    state.rings = [];
    state.popups = [];
    state.swipeCue = { dir: '', timer: 0 };

    if (!skipIntro) {
      setBanner(`STAGE ${cfg.stage} / 5`, `${cfg.jpName}  - ${cfg.title}`, DIFFICULTIES[diffId].color, 0.95);
      SFX.bell();
      emitEvent('bell', { stage: cfg.stage, diff: diffId });
      triggerCrowdFlashes(12);
    }
  }

  // =========================================================================
  // COMBAT LOGIC: 0-FRAME DODGE, STRICT TIMING, DUCK-HUNTING UPPERCUT, COUNTER
  // =========================================================================
  function isCorrectDodgeDirection(attackType, dir) {
    if (attackType === 'left_hook') return dir === 'right' || dir === 'duck';
    if (attackType === 'right_hook') return dir === 'left' || dir === 'duck';
    if (attackType === 'straight') return dir === 'left' || dir === 'right';
    if (attackType === 'duck_upper') return dir === 'left' || dir === 'right'; // DUCK = TRAP!
    return false;
  }

  function triggerDodge(dir) {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.14) return;
    if (p.dodgeTimer > 0.08 && p.dodgeDir === dir) return;

    // 0-Frame dodge cancel! Immediately cancels punch recovery
    p.punchSide = 'none';
    p.punchTimer = 0;
    p.dodgeDir = dir;
    p.dodgeDur = dir === 'duck' ? 0.30 : 0.32;
    p.dodgeTimer = p.dodgeDur;
    p.dodgeQuality = 'none';
    p.dodgeInvuln = 0;

    SFX.whoosh();
    emitEvent('dodge', { dir });

    // Evaluate STRICT TIMING against incoming attack!
    if (e.state === 'windup' && !e.attackResolved) {
      const rem = e.stateTimer;
      const diff = getDiff();

      // Special trap: DUCKING into a Duck-Hunting Uppercut!
      if (e.attackType === 'duck_upper' && dir === 'duck') {
        p.dodgeQuality = 'duck_trap';
        addPopup('⚠ ダック狩りだ!!', W / 2, 460, '#fb7185', 26, 0.55);
        return;
      }

      if (isCorrectDodgeDirection(e.attackType, dir)) {
        if (rem <= diff.justWin) {
          // PERFECT STRICT TIMING JUST SLIP!!
          p.dodgeQuality = 'just';
          p.dodgeInvuln = rem + 0.18;
          p.justCount++;
          p.koGauge = clamp(p.koGauge + 26, 0, 100);
          e.attackResolved = true;

          // Immediate crisp visual/time feedback!
          state.slowMoTimer = 0.24;
          state.slowMoScale = 0.26;
          state.speedLines = 0.34;
          state.speedLineColor = '#38bdf8';
          state.flashAlpha = 0.26;
          state.flashColor = '#38bdf8';

          const msTxt = `${Math.max(0.02, rem).toFixed(2)}s`;
          addPopup(`JUST SLIP!! ${msTxt}`, W / 2, 345, '#38bdf8', 34, 0.78);
          spawnRing(W / 2, H * 0.45, '#38bdf8', 250, 0.28, 8);
          SFX.justSlip();
          emitEvent('just_slip', { dir, rem: +rem.toFixed(3), attack: e.attackType });
          triggerCrowdFlashes(6);

          // Advance enemy directly into whiff/next-combo immediately after slip!
          e.state = 'strike';
          e.stateTimer = 0.11;
        } else if (rem <= diff.goodWin) {
          // Good slip (safe dodge, modest counter bonus)
          p.dodgeQuality = 'good';
          p.dodgeInvuln = rem + 0.14;
          p.koGauge = clamp(p.koGauge + 10, 0, 100);
          e.attackResolved = true;
          addPopup('NICE SLIP!', W / 2, 365, '#a3e635', 26, 0.58);
          emitEvent('good_slip', { dir });
          e.state = 'strike';
          e.stateTimer = 0.12;
        } else {
          // TOO EARLY! Strict timing discipline!
          p.dodgeQuality = 'early';
          p.dodgeInvuln = 0;
          addPopup('早すぎ!! EARLY', W / 2, 390, '#fbbf24', 26, 0.55);
          emitEvent('early_dodge', { dir });
        }
      } else {
        // Wrong direction!
        p.dodgeQuality = 'wrong';
        p.dodgeInvuln = 0;
        addPopup('逆方向!!', W / 2, 390, '#fb7185', 25, 0.50);
      }
    } else if (e.state === 'feint') {
      // Baited by feint!
      p.dodgeQuality = 'early';
      addPopup('フェイントに釣られた!', W / 2, 390, '#fbbf24', 23, 0.55);
    }
  }

  function triggerPunch(side) {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.12) return;
    if (p.punchTimer > 0.06) return;

    p.punchSide = side;
    p.punchDur = 0.17;
    p.punchTimer = p.punchDur;
    p.punchHitDone = false;
    // Slight lean back to center when countering
    if (p.dodgeTimer > 0.10) p.dodgeTimer = 0.10;
  }

  function triggerUppercut() {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.12) return;
    if (p.punchTimer > 0.07) return;

    const isUltra = p.koGauge >= 100;
    p.punchSide = isUltra ? 'ultra' : 'upper';
    p.punchDur = isUltra ? 0.34 : 0.24;
    p.punchTimer = p.punchDur;
    p.punchHitDone = false;
    if (isUltra) {
      p.koGauge = 0;
      state.slowMoTimer = 0.28;
      state.slowMoScale = 0.35;
      state.speedLines = 0.52;
      state.speedLineColor = '#fde047';
      setBanner('ULTRA COUNTER!!', '一撃必殺アッパーカット!!', '#fde047', 0.80);
      emitEvent('ultra_launch');
    }
  }

  function resolvePlayerPunchImpact() {
    const p = state.player;
    const e = state.enemy;
    const isUpper = p.punchSide === 'upper';
    const isUltra = p.punchSide === 'ultra';
    const inCounter = e.counterWindow > 0 || e.state === 'whiff' || e.state === 'stunned';
    const counterHit = inCounter || isUltra;

    // Guard check if enemy is idle and guarded (and not ultra/counter)
    if (!counterHit && e.state === 'idle' && e.guardHigh) {
      const chip = isUpper ? 8 : 4;
      e.hp = Math.max(1, e.hp - chip);
      e.hitRecoilZ = 0.14;
      e.hitFlash = 0.08;
      state.screenShake = Math.max(state.screenShake, 5);
      addPopup('GUARDED', W / 2, 330, '#cbd5e1', 22, 0.45);
      spawnParticles(W / 2, 355, 8, ['#cbd5e1', '#94a3b8'], 80, 220, 2, 5);
      SFX.blocked();
      emitEvent('blocked');
      return;
    }

    // Calculate juicy damage!
    let baseDmg = isUltra ? 135 : (isUpper ? 32 : 18);
    if (counterHit && !isUltra) {
      baseDmg = Math.round(baseDmg * (e.counterBonus || 2.1));
    }
    p.combo++;
    if (p.combo > p.maxCombo) p.maxCombo = p.combo;
    const comboMult = 1 + Math.min(p.combo - 1, 6) * 0.08;
    const finalDmg = Math.round(baseDmg * comboMult);

    e.hp = Math.max(0, e.hp - finalDmg);
    if (!isUltra) {
      p.koGauge = clamp(p.koGauge + (counterHit ? 14 : 6), 0, 100);
    }

    // Recoil & jaw snap!
    e.hitFlash = isUltra ? 0.28 : (counterHit ? 0.18 : 0.11);
    e.hitRecoilZ = isUltra ? 0.90 : (isUpper ? 0.55 : 0.36);
    e.hitRecoilX = p.punchSide === 'left' ? 0.52 : (p.punchSide === 'right' ? -0.52 : (rand() - 0.5) * 0.25);
    e.hitRecoilY = (isUpper || isUltra) ? -0.85 : -0.18;

    // Interrupt windup if ULTRA hits
    if (isUltra && e.hp > 0) {
      e.state = 'stunned';
      e.stateTimer = 0.95;
      e.counterWindow = 0.95;
      e.counterBonus = 2.4;
    } else if (counterHit && e.state === 'whiff') {
      e.state = 'stunned';
      e.stateTimer = Math.max(e.stateTimer, 0.48);
    }

    // Hitstop, shake, sparks, sweat!
    const impactX = W / 2 + (p.punchSide === 'left' ? -24 : p.punchSide === 'right' ? 24 : 0);
    const impactY = (isUpper || isUltra) ? 315 : 335;

    if (isUltra || e.hp <= 0) {
      state.hitstop = isUltra ? 0.16 : 0.14;
      state.screenShake = 26;
      state.flashAlpha = 0.62;
      state.flashColor = isUltra ? '#fde047' : '#ffffff';
      state.speedLines = 0.65;
      state.speedLineColor = '#fde047';
      spawnParticles(impactX, impactY, 42, ['#fde047', '#ffffff', '#fb7185', '#38bdf8'], 180, 680, 4, 12);
      spawnRing(impactX, impactY, '#fde047', 340, 0.40, 14);
      spawnRing(impactX, impactY, '#ffffff', 220, 0.28, 8);
      triggerCrowdFlashes(16);
      SFX.ultraKO();
      emitEvent(e.hp <= 0 ? 'ko_hit' : 'ultra_hit', { dmg: finalDmg, combo: p.combo });
    } else if (counterHit) {
      state.hitstop = isUpper ? 0.085 : 0.055;
      state.screenShake = isUpper ? 17 : 12;
      state.flashAlpha = 0.24;
      state.flashColor = '#fde047';
      state.speedLines = 0.25;
      state.speedLineColor = '#fde047';
      spawnParticles(impactX, impactY, 22, ['#fde047', '#ffffff', '#38bdf8', '#fb923c'], 150, 500, 3, 9);
      spawnRing(impactX, impactY, '#fde047', 210, 0.26, 9);
      triggerCrowdFlashes(6);
      SFX.punchHit(isUpper, true);
      emitEvent('counter_hit', { side: p.punchSide, dmg: finalDmg, combo: p.combo });
    } else {
      state.hitstop = 0.025;
      state.screenShake = 6;
      spawnParticles(impactX, impactY, 10, ['#ffffff', '#e2e8f0', '#fde047'], 100, 320, 2, 6);
      spawnRing(impactX, impactY, '#ffffff', 110, 0.18, 5);
      SFX.punchHit(isUpper, false);
      emitEvent('punch_hit', { side: p.punchSide, dmg: finalDmg });
    }

    // Popups
    const label = isUltra ? `ULTRA KO!! -${finalDmg}`
      : (counterHit ? `COUNTER!! -${finalDmg}` : `-${finalDmg}`);
    addPopup(
      label,
      impactX + randRange(-24, 24),
      impactY - 26,
      isUltra ? '#fde047' : (counterHit ? '#fde047' : '#ffffff'),
      isUltra ? 38 : (counterHit ? 30 : 23),
      0.72
    );

    // Check KO!
    if (e.hp <= 0) {
      triggerEnemyKO();
    }
  }

  function triggerEnemyKO() {
    const e = state.enemy;
    e.state = 'ko';
    e.koProgress = 0;
    e.stateTimer = 2.0;
    state.slowMoTimer = 0.85;
    state.slowMoScale = 0.30;
    state.speedLines = 0.85;
    state.speedLineColor = '#fde047';
    setBanner('K.O.!!', `${e.cfg.jpName} を完全粉砕!!`, '#fde047', 1.6);
    SFX.bell();
    emitEvent('ko_finish', { fighter: e.cfg.name });

    if (!SHORTS_MODE) {
      save.totalKOs++;
      if (state.player.maxCombo > save.bestCombo) save.bestCombo = state.player.maxCombo;
      const arr = save.cleared[state.diffId];
      if (!arr.includes(state.stageIdx)) arr.push(state.stageIdx);
      persistSave();
    }
  }

  function pickNextAttack() {
    const e = state.enemy;
    const cfg = e.cfg;
    const r = rand();
    if (r < cfg.upperRate) return 'duck_upper';
    if (r < cfg.upperRate + 0.24) return 'straight';
    return rand() < 0.5 ? 'left_hook' : 'right_hook';
  }

  function startEnemyAttack(attackType, comboRemaining) {
    const e = state.enemy;
    const cfg = e.cfg;
    e.attackType = attackType;
    e.comboLeft = comboRemaining;
    e.attackResolved = false;
    // Slight variance in windup keeps players honest
    const speedFactor = attackType === 'duck_upper' ? 1.08 : (attackType === 'straight' ? 0.94 : 1.0);
    e.windupDur = cfg.windup * speedFactor;
    e.state = 'windup';
    e.stateTimer = e.windupDur;
    e.guardHigh = false;

    if (attackType === 'duck_upper') {
      SFX.upperWarn();
      emitEvent('upper_warn');
    }
  }

  function resolveEnemyStrike() {
    const e = state.enemy;
    const p = state.player;
    const diff = getDiff();

    // Did player already cleanly slip this attack?
    if (e.attackResolved && p.dodgeInvuln > 0) {
      // Enemy whiffs!
      if (e.comboLeft > 0) {
        // Chain next hit in combo!
        const nextAtk = pickNextAttack();
        startEnemyAttack(nextAtk, e.comboLeft - 1);
        // Slightly faster follow-up
        e.windupDur *= 0.88;
        e.stateTimer = e.windupDur;
      } else {
        // Final hit whiffed -> COUNTER OPPORTUNITY!
        e.state = 'whiff';
        e.stateTimer = diff.counterWindow;
        e.counterWindow = diff.counterWindow;
        e.counterBonus = p.dodgeQuality === 'just' ? 2.35 : 1.65;
        if (e.attackType === 'duck_upper' && p.dodgeQuality === 'just') {
          e.counterBonus = 2.75; // Extra reward for dodging Duck-Hunting Uppercut!
        }
        addPopup('COUNTER CHANCE!!', W / 2, 275, '#fde047', 27, 0.70);
      }
      return;
    }

    // Player gets HIT!
    const isDuckCaught = e.attackType === 'duck_upper' && p.dodgeDir === 'duck' && p.dodgeTimer > 0;
    let dmg = Math.round(e.cfg.dmg * diff.dmgMult);
    if (isDuckCaught) {
      dmg = Math.round(dmg * 1.85);
    } else if (p.dodgeQuality === 'early') {
      dmg = Math.round(dmg * (1.0 + 0.15 * diff.earlyPunish));
    }

    p.hp = Math.max(0, p.hp - dmg);
    p.combo = 0;
    p.hurtTimer = isDuckCaught ? 0.42 : 0.28;
    state.screenShake = isDuckCaught ? 28 : 18;
    state.vignetteRed = isDuckCaught ? 0.95 : 0.65;
    state.flashAlpha = isDuckCaught ? 0.55 : 0.30;
    state.flashColor = '#ef4444';
    state.hitstop = isDuckCaught ? 0.10 : 0.05;

    if (isDuckCaught) {
      setBanner('DUCK CAUGHT!!', 'アッパーで顎をカチ上げられた!!', '#f43f5e', 0.85);
      addPopup(`CRITICAL!! -${dmg}`, W / 2, 460, '#f43f5e', 36, 0.85);
      spawnParticles(W / 2, 540, 28, ['#f43f5e', '#fde047', '#ffffff'], 160, 520, 4, 10);
      SFX.playerHit(true);
      emitEvent('duck_caught', { dmg });
    } else {
      addPopup(`HIT! -${dmg}`, W / 2, 480, '#fb7185', 30, 0.68);
      SFX.playerHit(false);
      emitEvent('player_hit', { dmg });
    }

    if (p.hp <= 0) {
      state.screen = 'defeat';
      setBanner('DOWN... K.O.', 'リベンジして見切れ!!', '#f43f5e', 1.4);
      SFX.bell();
      return;
    }

    // After hitting player, enemy resets to idle
    e.state = 'idle';
    e.stateTimer = e.cfg.cooldown * 0.9;
    e.comboLeft = 0;
  }

  // =========================================================================
  // SHORTS CHOREOGRAPHY (14.5s VIRAL SCRIPT — 100% REAL ENGINE RENDERED!)
  // =========================================================================
  let shortsActionsDone = new Set();
  function runShortsChoreography(t) {
    const once = (key, fn) => {
      if (!shortsActionsDone.has(key)) {
        shortsActionsDone.add(key);
        fn();
      }
    };

    // ACT 1 (0.00s - 1.15s): NUCLEAR 1-SECOND COLD OPEN — ZEUS OMEGA COUNTER KO SLAM!
    if (t >= 0.0) {
      once('act1_setup', () => {
        startFight('vhard', 4, true); // ZEUS OMEGA!
        state.player.koGauge = 100;
        state.enemy.hp = 120;
        state.enemy.maxHp = 580;
        state.enemy.attackType = 'duck_upper';
        state.enemy.windupDur = 0.42;
        state.enemy.state = 'windup';
        state.enemy.stateTimer = 0.24; // Immediate threat on frame 0!
        state.swipeCue = { dir: 'right', timer: 0.24 };
        emitEvent('cold_open_start');
      });
    }
    if (t >= 0.14) {
      once('act1_slip', () => {
        state.enemy.stateTimer = 0.05;
        triggerDodge('right');
      });
    }
    if (t >= 0.30) {
      once('act1_ultra', () => {
        state.enemy.counterWindow = 1.0;
        state.enemy.state = 'whiff';
        state.player.koGauge = 100;
        triggerUppercut();
        // Fast snap into impact right at ~0.43s (under 0.5s!) for nuclear 1-sec hook!
        state.slowMoTimer = 0;
        state.slowMoScale = 1.0;
      });
    }

    // ACT 2 (1.15s - 4.10s): 0-FRAME SWIPE ACTION — MARCO CRUZ (EASY BOSS)
    if (t >= 1.15) {
      once('act2_setup', () => {
        startFight('easy', 4, true);
        state.flashAlpha = 0.45;
        state.flashColor = '#ffffff';
        state.enemy.state = 'windup';
        state.enemy.attackType = 'left_hook';
        state.enemy.windupDur = 0.62;
        state.enemy.stateTimer = 0.52;
        state.swipeCue = { dir: 'right', timer: 0.55 };
        emitEvent('cut_act2');
      });
    }
    if (t >= 1.60) {
      once('act2_slip1', () => {
        state.enemy.stateTimer = 0.07;
        triggerDodge('right');
      });
    }
    if (t >= 1.92) once('act2_p1', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('left'); });
    if (t >= 2.14) once('act2_p2', () => triggerPunch('right'));
    if (t >= 2.38) once('act2_p3', () => triggerUppercut());

    if (t >= 2.75) {
      once('act2_atk2', () => {
        state.enemy.state = 'windup';
        state.enemy.attackType = 'right_hook';
        state.enemy.windupDur = 0.52;
        state.enemy.stateTimer = 0.46;
        state.enemy.attackResolved = false;
        state.swipeCue = { dir: 'left', timer: 0.48 };
      });
    }
    if (t >= 3.15) {
      once('act2_slip2', () => {
        state.enemy.stateTimer = 0.06;
        triggerDodge('left');
      });
    }
    if (t >= 3.45) once('act2_p4', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('right'); });
    if (t >= 3.68) once('act2_p5', () => triggerPunch('left'));

    // ACT 3 (4.10s - 7.40s): DUCK-HUNTING UPPERCUT TRAP! — VIKTOR KRANE (HARD STAGE 4)
    if (t >= 4.10) {
      once('act3_setup', () => {
        startFight('hard', 3, true); // Viktor Krane
        state.flashAlpha = 0.40;
        state.flashColor = '#f43f5e';
        state.enemy.state = 'windup';
        state.enemy.attackType = 'left_hook';
        state.enemy.windupDur = 0.50;
        state.enemy.stateTimer = 0.42;
        state.swipeCue = { dir: 'duck', timer: 0.45 };
        emitEvent('cut_act3');
      });
    }
    if (t >= 4.46) {
      once('act3_duck', () => {
        state.enemy.stateTimer = 0.08;
        triggerDodge('duck');
      });
    }
    if (t >= 4.74) once('act3_p0', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('left'); });

  // =========================================================================
  // UPDATE LOOP
  // =========================================================================
  function update(rawDt) {
    const dtClamped = Math.min(rawDt, 0.05);
    state.elapsed += dtClamped;
    if (SHORTS_MODE) {
      shortsElapsed += dtClamped;
      runShortsChoreography(shortsElapsed);
    }

    // Decay visual overlays even during hitstop
    if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - dtClamped * 2.6);
    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dtClamped * 58);
    if (state.speedLines > 0) state.speedLines = Math.max(0, state.speedLines - dtClamped * 1.4);
    if (state.vignetteRed > 0) state.vignetteRed = Math.max(0, state.vignetteRed - dtClamped * 2.2);
    if (state.banner.timer > 0) {
      state.banner.timer = Math.max(0, state.banner.timer - dtClamped);
      state.banner.scale = lerp(state.banner.scale, 1.0, Math.min(1, dtClamped * 14));
    }
    if (state.swipeCue.timer > 0) state.swipeCue.timer = Math.max(0, state.swipeCue.timer - dtClamped);

    // Hitstop freeze for juicy punch impact!
    if (state.hitstop > 0) {
      state.hitstop = Math.max(0, state.hitstop - dtClamped);
      return;
    }

    // Slow-motion scaling
    let timeScale = 1.0;
    if (state.slowMoTimer > 0) {
      state.slowMoTimer = Math.max(0, state.slowMoTimer - dtClamped);
      timeScale = state.slowMoScale;
    }
    const dt = dtClamped * timeScale;

    // Update particles & rings & popups & crowd flashes
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.life -= dtClamped;
      if (pt.life <= 0) { state.particles.splice(i, 1); continue; }
      pt.vy += pt.grav * dtClamped;
      pt.x += pt.vx * dtClamped;
      pt.y += pt.vy * dtClamped;
    }
    for (let i = state.rings.length - 1; i >= 0; i--) {
      const rg = state.rings[i];
      rg.timer -= dtClamped;
      if (rg.timer <= 0) state.rings.splice(i, 1);
    }
    for (let i = state.popups.length - 1; i >= 0; i--) {
      const pp = state.popups[i];
      pp.timer -= dtClamped;
      pp.y += pp.vy * dtClamped;
      pp.vy *= 0.92;
      if (pp.timer <= 0) state.popups.splice(i, 1);
    }
    for (let i = state.crowdFlashes.length - 1; i >= 0; i--) {
      const cf = state.crowdFlashes[i];
      cf.timer -= dtClamped;
      if (cf.timer <= 0) state.crowdFlashes.splice(i, 1);
    }

    if (state.screen !== 'fight') return;

    state.fightTime += dt;
    const p = state.player;
    const e = state.enemy;

    // Player timers
    if (p.dodgeTimer > 0) {
      p.dodgeTimer = Math.max(0, p.dodgeTimer - dt);
      if (p.dodgeTimer === 0) p.dodgeDir = 'none';
    }
    if (p.dodgeInvuln > 0) p.dodgeInvuln = Math.max(0, p.dodgeInvuln - dt);
    if (p.hurtTimer > 0) p.hurtTimer = Math.max(0, p.hurtTimer - dt);

    if (p.punchTimer > 0) {
      p.punchTimer = Math.max(0, p.punchTimer - dt);
      const prog = 1 - p.punchTimer / p.punchDur;
      if (!p.punchHitDone && prog >= 0.36) {
        p.punchHitDone = true;
        resolvePlayerPunchImpact();
      }
      if (p.punchTimer === 0) p.punchSide = 'none';
    }

    // First-person 3D Camera Motion
    let targetCamX = Math.sin(state.elapsed * 2.2) * 5;
    let targetCamY = Math.cos(state.elapsed * 4.4) * 3;
    let targetRoll = 0;
    let targetFov = 0;

    if (p.dodgeTimer > 0) {
      const env = Math.sin((p.dodgeTimer / p.dodgeDur) * Math.PI);
      if (p.dodgeDir === 'left') {
        targetCamX = -92 * env;
        targetCamY = 18 * env;
        targetRoll = -0.14 * env;
      } else if (p.dodgeDir === 'right') {
        targetCamX = 92 * env;
        targetCamY = 18 * env;
        targetRoll = 0.14 * env;
      } else if (p.dodgeDir === 'duck') {
        targetCamY = 105 * env;
        targetFov = -0.05 * env;
      }
    }
    if (p.punchTimer > 0) {
      const pEnv = Math.sin((p.punchTimer / p.punchDur) * Math.PI);
      targetFov += (p.punchSide === 'ultra' ? 0.16 : 0.06) * pEnv;
      if (p.punchSide === 'left') targetRoll += 0.04 * pEnv;
      if (p.punchSide === 'right') targetRoll -= 0.04 * pEnv;
    }
    if (p.hurtTimer > 0) {
      targetCamY -= 38 * (p.hurtTimer / 0.35);
      targetRoll += Math.sin(state.elapsed * 45) * 0.12;
    }

    const camEase = Math.min(1, dtClamped * 20);
    state.camX = lerp(state.camX, targetCamX, camEase);
    state.camY = lerp(state.camY, targetCamY, camEase);
    state.camRoll = lerp(state.camRoll, targetRoll, camEase);
    state.camFovBoost = lerp(state.camFovBoost, targetFov, camEase);

    // Enemy recoil decay
    e.hitRecoilX = lerp(e.hitRecoilX, 0, Math.min(1, dtClamped * 12));
    e.hitRecoilY = lerp(e.hitRecoilY, 0, Math.min(1, dtClamped * 12));
    e.hitRecoilZ = lerp(e.hitRecoilZ, 0, Math.min(1, dtClamped * 10));
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dtClamped);
    if (e.counterWindow > 0) e.counterWindow = Math.max(0, e.counterWindow - dt);
    e.bobPhase += dt * (e.state === 'stunned' ? 9.5 : 3.8);

    // Enemy State Machine
    if (e.state === 'ko') {
      e.koProgress = Math.min(1, e.koProgress + dt * 1.15);
      e.stateTimer -= dtClamped;
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        state.screen = 'victory';
      }
      return;
    }

    e.stateTimer -= dt;

    if (e.state === 'intro') {
      if (e.stateTimer <= 0) {
        e.state = 'idle';
        e.stateTimer = 0.45;
      }
    } else if (e.state === 'idle') {
      // Toggle guard organically
      e.guardHigh = Math.sin(state.elapsed * 2.5 + state.stageIdx) > -0.15;
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        // Decide feint or direct attack
        const nextAtk = pickNextAttack();
        const comboCnt = rand() < 0.45 ? randInt(0, e.cfg.comboMax - 1) : 0;
        if (rand() < e.cfg.feintRate) {
          e.state = 'feint';
          e.feintDir = nextAtk === 'left_hook' ? 'right_hook' : 'left_hook';
          e.attackType = nextAtk;
          e.comboLeft = comboCnt;
          e.stateTimer = 0.22;
        } else {
          startEnemyAttack(nextAtk, comboCnt);
        }
      }
    } else if (e.state === 'feint') {
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        startEnemyAttack(e.attackType, e.comboLeft);
      }
    } else if (e.state === 'windup') {
      if (e.stateTimer <= 0) {
        e.state = 'strike';
        e.stateTimer = 0.10;
        resolveEnemyStrike();
      }
    } else if (e.state === 'strike') {
      if (e.stateTimer <= 0) {
        if (e.attackResolved) {
          resolveEnemyStrike();
        } else {
          e.state = 'idle';
          e.stateTimer = e.cfg.cooldown;
        }
      }
    } else if (e.state === 'whiff' || e.state === 'stunned') {
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        e.state = 'idle';
        e.stateTimer = e.cfg.cooldown * 0.72;
        e.counterWindow = 0;
      }
    }
  }

  // =========================================================================
  // 3D PERSPECTIVE RENDERER (ARENA + ARTICULATED BOXER + 1ST-PERSON GLOVES)
  // =========================================================================
  function drawArena(cx, cy) {
    const cfg = state.enemy.cfg;
    const tint = cfg.arenaTint || '#1d4ed8';

    // Deep arena ceiling & crowd bowl
    const skyG = ctx.createLinearGradient(0, 0, 0, H);
    skyG.addColorStop(0, '#04050b');
    skyG.addColorStop(0.32, '#0b0e1c');
    skyG.addColorStop(0.56, '#14182a');
    skyG.addColorStop(0.68, '#1e2438');
    skyG.addColorStop(1, '#0b0e18');
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, W, H);

    // Arena colored dramatic glow behind boxer
    const auraG = ctx.createRadialGradient(cx, cy - 110, 20, cx, cy - 100, 390);
    auraG.addColorStop(0, tint + '88');
    auraG.addColorStop(0.5, tint + '28');
    auraG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = auraG;
    ctx.fillRect(0, 0, W, H);

    // Overhead volumetric arena spotlights (sweeping slightly)
    ctx.save();
    for (let i = -1; i <= 1; i++) {
      const sway = Math.sin(state.elapsed * 0.9 + i * 2.1) * 32;
      const sx = cx + i * 170;
      const sg = ctx.createLinearGradient(sx, 0, sx + sway, 620);
      sg.addColorStop(0, 'rgba(255,255,255,0.20)');
      sg.addColorStop(0.55, 'rgba(200,230,255,0.06)');
      sg.addColorStop(1, 'rgba(200,230,255,0)');
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(sx - 24, -10);
      ctx.lineTo(sx + 24, -10);
      ctx.lineTo(sx + 135 + sway, 640);
      ctx.lineTo(sx - 135 + sway, 640);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // Distant arena stadium tiers & bokeh lights
    ctx.save();
    for (let i = 0; i < 28; i++) {
      const lx = ((i * 73 + 29) % (W + 120)) - 60 + (cx - W / 2) * 0.18;
      const ly = 135 + ((i * 37) % 210);
      const pulse = 0.22 + 0.18 * Math.sin(state.elapsed * 3 + i);
      ctx.fillStyle = i % 3 === 0 ? `rgba(56,189,248,${pulse})` : (i % 3 === 1 ? `rgba(253,224,71,${pulse * 0.85})` : `rgba(255,255,255,${pulse * 0.7})`);
      ctx.beginPath();
      ctx.arc(lx, ly, 2.5 + (i % 3) * 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Camera flashes in crowd!
    for (const cf of state.crowdFlashes) {
      const a = (cf.timer / cf.dur);
      const fg = ctx.createRadialGradient(cf.x, cf.y, 1, cf.x, cf.y, cf.r);
      fg.addColorStop(0, `rgba(255,255,255,${a * 0.95})`);
      fg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.arc(cf.x, cf.y, cf.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Ring Horizon & 3D Canvas Mat
    const horizonY = cy + 125;
    const matG = ctx.createLinearGradient(0, horizonY, 0, H);
    matG.addColorStop(0, '#1e293b');
    matG.addColorStop(0.45, '#334155');
    matG.addColorStop(1, '#0f172a');
    ctx.fillStyle = matG;
    ctx.beginPath();
    ctx.moveTo(-80, H + 40);
    ctx.lineTo(W + 80, H + 40);
    ctx.lineTo(cx + 380, horizonY);
    ctx.lineTo(cx - 380, horizonY);
    ctx.closePath();
    ctx.fill();

    // Perspective mat grid lines & center ring emblem
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * 68, horizonY);
      ctx.lineTo(cx + i * 195, H + 20);
      ctx.stroke();
    }
    // Center ring circle in perspective
    ctx.strokeStyle = tint + '55';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.ellipse(cx, horizonY + 125, 220, 42, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Corner Posts (left & right background)
    const postL = cx - 255;
    const postR = cx + 255;
    for (const [px, col] of [[postL, '#dc2626'], [postR, '#2563eb']]) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(px - 16, horizonY - 220, 32, 232);
      ctx.fillStyle = col;
      ctx.fillRect(px - 12, horizonY - 208, 24, 210);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(px - 8, horizonY - 208, 6, 210);
    }

    // 3-Tier Taut Boxing Ropes (back wall + perspective sides)
    const ropeYs = [horizonY - 178, horizonY - 118, horizonY - 58];
    const ropeCols = ['#ef4444', '#f8fafc', '#3b82f6'];
    for (let r = 0; r < 3; r++) {
      const ry = ropeYs[r];
      ctx.strokeStyle = ropeCols[r];
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(postL, ry);
      ctx.lineTo(postR, ry);
      ctx.stroke();
      // Side perspective ropes going toward viewer
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(postL, ry);
      ctx.lineTo(-90, ry + 135 + r * 35);
      ctx.moveTo(postR, ry);
      ctx.lineTo(W + 90, ry + 135 + r * 35);
      ctx.stroke();
      // Highlight glint
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(postL, ry - 2);
      ctx.lineTo(postR, ry - 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGlove3D(x, y, radius, mainCol, trimCol, glowCol = null, glowAlpha = 0) {
    ctx.save();
    if (glowCol && glowAlpha > 0.02) {
      ctx.shadowColor = glowCol;
      ctx.shadowBlur = 32 * glowAlpha;
    }
    // Main leather body
    const g = ctx.createRadialGradient(x - radius * 0.28, y - radius * 0.32, radius * 0.12, x, y, radius * 1.05);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.22, mainCol);
    g.addColorStop(0.82, mainCol);
    g.addColorStop(1, '#09090b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, radius * 1.04, radius * 0.94, 0, 0, Math.PI * 2);
    ctx.fill();

    // Thumb cushion
    ctx.fillStyle = mainCol;
    ctx.beginPath();
    ctx.ellipse(x - radius * 0.72, y + radius * 0.16, radius * 0.34, radius * 0.44, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // Specular leather highlight
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.beginPath();
    ctx.ellipse(x - radius * 0.25, y - radius * 0.35, radius * 0.36, radius * 0.18, -0.4, 0, Math.PI * 2);
    ctx.fill();

    // Wrist cuff tape
    ctx.shadowBlur = 0;
    ctx.fillStyle = trimCol;
    ctx.beginPath();
    ctx.roundRect(x - radius * 0.56, y + radius * 0.68, radius * 1.12, radius * 0.42, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawOpponent3D(cx, cy) {
    const e = state.enemy;
    const cfg = e.cfg;
    const bobX = Math.sin(e.bobPhase) * 12;
    const bobY = Math.abs(Math.cos(e.bobPhase)) * 10;

    // 3D depth scale (recoil pushes enemy back, windup/strike lunges forward!)
    let zScale = cfg.scale * (1 - e.hitRecoilZ * 0.20);
    let offsetX = bobX + e.hitRecoilX * 62;
    let offsetY = bobY + e.hitRecoilY * 36;
    let bodyTilt = e.hitRecoilX * 0.22;

    // Attack windup & lunge kinematics
    let windupProg = 0;
    let attackPhase = 'none';
    if (e.state === 'windup') {
      windupProg = clamp(1 - e.stateTimer / e.windupDur, 0, 1);
      attackPhase = 'windup';
      if (e.attackType === 'duck_upper') {
        // Crouches deep to launch Duck-Hunting Uppercut!
        offsetY += easeOutCubic(windupProg) * 58;
        zScale *= 1 + windupProg * 0.08;
      } else if (e.attackType === 'left_hook') {
        offsetX -= easeOutCubic(windupProg) * 46;
        bodyTilt -= easeOutCubic(windupProg) * 0.16;
      } else if (e.attackType === 'right_hook') {
        offsetX += easeOutCubic(windupProg) * 46;
        bodyTilt += easeOutCubic(windupProg) * 0.16;
      } else {
        zScale *= 1 - windupProg * 0.06;
      }
    } else if (e.state === 'strike') {
      attackPhase = 'strike';
      zScale *= 1.18;
      offsetY -= 12;
    } else if (e.state === 'whiff') {
      bodyTilt += (e.attackType === 'left_hook' ? 0.24 : -0.24);
      offsetY += 16;
    } else if (e.state === 'stunned') {
      offsetX += Math.sin(state.elapsed * 28) * 14;
      bodyTilt += Math.sin(state.elapsed * 16) * 0.14;
    } else if (e.state === 'feint') {
      offsetX += (e.feintDir === 'left_hook' ? -28 : 28) * Math.sin((e.stateTimer / 0.22) * Math.PI);
    } else if (e.state === 'ko') {
      const k = easeOutCubic(e.koProgress);
      offsetY += k * 255;
      zScale *= Math.max(0.42, 1 - k * 0.48);
      bodyTilt += k * 0.55;
    }

    const bx = cx + offsetX;
    const by = cy + 68 + offsetY;

    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(bodyTilt);
    ctx.scale(zScale, zScale);

    // Boss / God Energy Aura
    if (cfg.aura && e.state !== 'ko') {
      const auraR = 175 + Math.sin(state.elapsed * 8) * 12;
      const ag = ctx.createRadialGradient(0, -110, 30, 0, -110, auraR);
      ag.addColorStop(0, cfg.aura + '55');
      ag.addColorStop(0.6, cfg.aura + '1a');
      ag.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.arc(0, -110, auraR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ground Contact Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.beginPath();
    ctx.ellipse(0, 175, 110 * cfg.bulk, 24, 0, 0, Math.PI * 2);
    ctx.fill();

    // Trunks & Belt
    const waistW = 74 * cfg.bulk;
    ctx.fillStyle = cfg.trunks;
    ctx.beginPath();
    ctx.roundRect(-waistW, 56, waistW * 2, 108, 16);
    ctx.fill();
    // Side stripe on trunks
    ctx.fillStyle = cfg.trunksTrim;
    ctx.fillRect(-waistW + 6, 66, 12, 88);
    ctx.fillRect(waistW - 18, 66, 12, 88);
    // Waistband / Championship Belt
    ctx.fillStyle = cfg.belt ? cfg.belt : cfg.trunksTrim;
    ctx.fillRect(-waistW - 2, 48, waistW * 2 + 4, 22);
    if (cfg.belt) {
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath();
      ctx.ellipse(0, 59, 26, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Muscular Sculpted Torso (3D gradient shading)
    const shW = 104 * cfg.bulk;
    const torsoG = ctx.createLinearGradient(-shW, -120, shW, 60);
    torsoG.addColorStop(0, cfg.skinShade);
    torsoG.addColorStop(0.32, cfg.skin);
    torsoG.addColorStop(0.68, cfg.skin);
    torsoG.addColorStop(1, cfg.skinShade);
    ctx.fillStyle = e.hitFlash > 0.04 ? '#ffffff' : torsoG;
    ctx.beginPath();
    ctx.moveTo(-shW, -108);
    ctx.quadraticCurveTo(0, -132, shW, -108);
    ctx.lineTo(waistW, 56);
    ctx.lineTo(-waistW, 56);
    ctx.closePath();
    ctx.fill();

    // Pecs & Abs definition
    if (e.hitFlash <= 0.04) {
      ctx.strokeStyle = cfg.skinShade;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      // Pecs
      ctx.moveTo(-shW * 0.68, -42);
      ctx.quadraticCurveTo(-shW * 0.30, -26, -6, -42);
      ctx.moveTo(shW * 0.68, -42);
      ctx.quadraticCurveTo(shW * 0.30, -26, 6, -42);
      // Abs centerline
      ctx.moveTo(0, -40);
      ctx.lineTo(0, 34);
      ctx.stroke();
    }

    // Shoulders (Deltoids)
    for (const sx of [-shW + 6, shW - 6]) {
      const dg = ctx.createRadialGradient(sx - 10, -106, 6, sx, -92, 46 * cfg.bulk);
      dg.addColorStop(0, cfg.skin);
      dg.addColorStop(1, cfg.skinShade);
      ctx.fillStyle = e.hitFlash > 0.04 ? '#ffffff' : dg;
      ctx.beginPath();
      ctx.arc(sx, -92, 40 * cfg.bulk, 0, Math.PI * 2);
      ctx.fill();
    }

    // Neck
    ctx.fillStyle = cfg.skinShade;
    ctx.fillRect(-24, -158, 48, 46);

    // HEAD (snaps dynamically on hit!)
    const headSnapX = e.hitRecoilX * 26;
    const headSnapY = e.hitRecoilY * 22;
    ctx.save();
    ctx.translate(headSnapX, -196 + headSnapY);
    ctx.rotate(e.hitRecoilX * 0.32);

    // Ears
    ctx.fillStyle = cfg.skinShade;
    ctx.beginPath();
    ctx.ellipse(-52, 4, 10, 18, 0, 0, Math.PI * 2);
    ctx.ellipse(52, 4, 10, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // Head cranium & jaw
    const headG = ctx.createRadialGradient(-16, -24, 10, 0, 0, 68);
    headG.addColorStop(0, cfg.skin);
    headG.addColorStop(0.75, cfg.skin);
    headG.addColorStop(1, cfg.skinShade);
    ctx.fillStyle = e.hitFlash > 0.04 ? '#fff7ed' : headG;
    ctx.beginPath();
    ctx.moveTo(-50, -18);
    ctx.quadraticCurveTo(-52, -66, 0, -68);
    ctx.quadraticCurveTo(52, -66, 50, -18);
    ctx.lineTo(42, 34);
    ctx.quadraticCurveTo(0, 66, -42, 34);
    ctx.closePath();
    ctx.fill();

    // Hair Styles
    ctx.fillStyle = cfg.hair;
    if (cfg.hairStyle === 'short') {
      ctx.beginPath();
      ctx.arc(0, -24, 52, Math.PI * 1.04, Math.PI * 1.96);
      ctx.fill();
    } else if (cfg.hairStyle === 'spiky') {
      ctx.beginPath();
      ctx.moveTo(-52, -24);
      ctx.lineTo(-42, -74); ctx.lineTo(-22, -58);
      ctx.lineTo(0, -86); ctx.lineTo(22, -58);
      ctx.lineTo(42, -74); ctx.lineTo(52, -24);
      ctx.closePath();
      ctx.fill();
    } else if (cfg.hairStyle === 'mohawk') {
      ctx.beginPath();
      ctx.moveTo(-16, -34);
      ctx.lineTo(-14, -96);
      ctx.lineTo(0, -104);
      ctx.lineTo(14, -96);
      ctx.lineTo(16, -34);
      ctx.closePath();
      ctx.fill();
    } else if (cfg.hairStyle === 'slick') {
      ctx.beginPath();
      ctx.moveTo(-52, -22);
      ctx.quadraticCurveTo(-20, -84, 48, -56);
      ctx.lineTo(52, -22);
      ctx.closePath();
      ctx.fill();
    }

    // Accessories (Headband / Crown / Visor / Scar / Beard)
    if (cfg.accessory === 'headband') {
      ctx.fillStyle = cfg.accessoryCol || '#ef4444';
      ctx.fillRect(-52, -38, 104, 15);
    } else if (cfg.accessory === 'crown') {
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(-40, -56);
      ctx.lineTo(-44, -92); ctx.lineTo(-18, -72);
      ctx.lineTo(0, -102); ctx.lineTo(18, -72);
      ctx.lineTo(44, -92); ctx.lineTo(40, -56);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 3;
      ctx.stroke();
    } else if (cfg.accessory === 'scar') {
      ctx.strokeStyle = '#991b1b';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(14, -22);
      ctx.lineTo(30, 18);
      ctx.stroke();
    } else if (cfg.accessory === 'beard') {
      ctx.fillStyle = cfg.hair;
      ctx.beginPath();
      ctx.moveTo(-42, 16);
      ctx.quadraticCurveTo(0, 68, 42, 16);
      ctx.lineTo(34, 42);
      ctx.quadraticCurveTo(0, 66, -34, 42);
      ctx.closePath();
      ctx.fill();
    }

    // Eyes & Fierce Brows
    if (cfg.accessory === 'visor') {
      ctx.fillStyle = '#d946ef';
      ctx.fillRect(-44, -16, 88, 20);
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillRect(-38, -13, 30, 6);
    } else {
      const hurtFace = e.hitFlash > 0.02 || e.state === 'ko' || e.state === 'stunned';
      if (hurtFace) {
        // X-eyes or squinted pain!
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        for (const ex of [-20, 20]) {
          ctx.beginPath();
          ctx.moveTo(ex - 9, -12); ctx.lineTo(ex + 9, 2);
          ctx.moveTo(ex + 9, -12); ctx.lineTo(ex - 9, 2);
          ctx.stroke();
        }
      } else {
        // Intense glowing/focused eyes
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-20, -6, 11, 7, 0, 0, Math.PI * 2);
        ctx.ellipse(20, -6, 11, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = e.attackType === 'duck_upper' && e.state === 'windup' ? '#ef4444' : '#0f172a';
        ctx.beginPath();
        ctx.arc(-19, -6, 4.5, 0, Math.PI * 2);
        ctx.arc(19, -6, 4.5, 0, Math.PI * 2);
        ctx.fill();
        // Furrowed angry brows
        ctx.strokeStyle = cfg.hair === '#f8fafc' ? '#cbd5e1' : '#18181b';
        ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.moveTo(-34, -20); ctx.lineTo(-8, -12);
        ctx.moveTo(34, -20); ctx.lineTo(8, -12);
        ctx.stroke();
      }
    }

    // Nose & Mouthguard
    ctx.strokeStyle = cfg.skinShade;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(-5, 12); ctx.lineTo(5, 12);
    ctx.stroke();

    ctx.fillStyle = (e.hitFlash > 0.02 || e.state === 'windup') ? '#f8fafc' : '#7f1d1d';
    ctx.beginPath();
    ctx.roundRect(-18, 22, 36, e.hitFlash > 0.02 ? 15 : 9, 4);
    ctx.fill();

    // Stunned orbiting stars
    if (e.state === 'stunned' || e.counterWindow > 0) {
      for (let s = 0; s < 3; s++) {
        const ang = state.elapsed * 7 + (s * Math.PI * 2) / 3;
        const sx = Math.cos(ang) * 64;
        const sy = -78 + Math.sin(ang) * 14;
        ctx.fillStyle = '#fde047';
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore(); // end head

    // ENEMY ARMS & GLOVES (3D Articulated)
    let lgX = -96, lgY = -88, lgR = 46; // screen-left glove (enemy right hand)
    let rgX = 96, rgY = -88, rgR = 46;  // screen-right glove (enemy left hand)
    let lgGlow = null, rgGlow = null, glowA = 0;

    if (e.guardHigh && e.state === 'idle') {
      lgX = -48; lgY = -148;
      rgX = 48; rgY = -148;
    } else if (e.state === 'whiff' || e.state === 'stunned') {
      lgX = -135; lgY = -15;
      rgX = 135; rgY = -15;
    } else if (e.state === 'feint') {
      if (e.feintDir === 'left_hook') { lgX = -150; lgY = -95; }
      else { rgX = 150; rgY = -95; }
    } else if (e.state === 'windup') {
      const w = easeOutCubic(windupProg);
      const isJustNow = e.stateTimer <= getDiff().justWin;
      glowA = 0.45 + w * 0.55;
      if (e.attackType === 'left_hook') {
        lgX = lerp(-105, -205, w);
        lgY = lerp(-85, -108, w);
        lgR = 46 + w * 20;
        lgGlow = isJustNow ? '#fde047' : '#f97316';
      } else if (e.attackType === 'right_hook') {
        rgX = lerp(105, 205, w);
        rgY = lerp(-85, -108, w);
        rgR = 46 + w * 20;
        rgGlow = isJustNow ? '#fde047' : '#f97316';
      } else if (e.attackType === 'straight') {
        rgX = lerp(90, 8, w);
        rgY = lerp(-85, -118, w);
        rgR = 48 + w * 30;
        rgGlow = isJustNow ? '#fde047' : '#38bdf8';
      } else if (e.attackType === 'duck_upper') {
        // DUCK-HUNTING UPPERCUT: drops VERY LOW with crimson-magenta lightning!
        rgX = lerp(95, 22, w);
        rgY = lerp(-60, 72, w);
        rgR = 50 + w * 30;
        rgGlow = isJustNow ? '#fde047' : '#f43f5e';
      }
    } else if (e.state === 'strike') {
      if (e.attackType === 'left_hook') { lgX = 30; lgY = -115; lgR = 108; lgGlow = '#fde047'; glowA = 1; }
      else if (e.attackType === 'right_hook') { rgX = -30; rgY = -115; rgR = 108; rgGlow = '#fde047'; glowA = 1; }
      else if (e.attackType === 'straight') { rgX = 0; rgY = -115; rgR = 116; rgGlow = '#38bdf8'; glowA = 1; }
      else if (e.attackType === 'duck_upper') { rgX = 0; rgY = -170; rgR = 122; rgGlow = '#f43f5e'; glowA = 1; }
    } else if (e.state === 'ko') {
      lgX = -155; lgY = -30;
      rgX = 155; rgY = -30;
    }

    // Draw muscular forearms connecting shoulders to gloves
    ctx.strokeStyle = cfg.skin;
    ctx.lineCap = 'round';
    ctx.lineWidth = 34 * cfg.bulk;
    ctx.beginPath();
    ctx.moveTo(-shW + 6, -86);
    ctx.quadraticCurveTo(-shW - 22, -20, lgX, lgY + 18);
    ctx.moveTo(shW - 6, -86);
    ctx.quadraticCurveTo(shW + 22, -20, rgX, rgY + 18);
    ctx.stroke();

    // Draw Gloves
    drawGlove3D(lgX, lgY, lgR, cfg.glove, cfg.gloveTrim, lgGlow, glowA);
    drawGlove3D(rgX, rgY, rgR, cfg.glove, cfg.gloveTrim, rgGlow, glowA);

    // STRICT TIMING RING & DUCK-HUNTING UPPERCUT TELEGRAPH OVERLAY!
    if (e.state === 'windup' && !e.attackResolved) {
      const diff = getDiff();
      const frac = clamp(e.stateTimer / e.windupDur, 0, 1);
      const isJustZone = e.stateTimer <= diff.justWin;
      const tx = e.attackType === 'left_hook' ? lgX : rgX;
      const ty = e.attackType === 'left_hook' ? lgY : rgY;

      // Shrinking strict-timing ring around incoming glove
      const baseR = 62;
      const shrinkR = baseR + frac * 78;
      ctx.save();
      ctx.strokeStyle = isJustZone ? '#fde047' : (e.attackType === 'duck_upper' ? '#f43f5e' : 'rgba(255,255,255,0.65)');
      ctx.lineWidth = isJustZone ? 8 : 4;
      ctx.beginPath();
      ctx.arc(tx, ty, shrinkR, 0, Math.PI * 2);
      ctx.stroke();

      // Target inner just-circle
      ctx.strokeStyle = isJustZone ? '#38bdf8' : 'rgba(253,224,71,0.45)';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.arc(tx, ty, baseR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Rising crimson lightning for DUCK-HUNTING UPPERCUT!
      if (e.attackType === 'duck_upper') {
        ctx.strokeStyle = isJustZone ? '#fde047' : '#f43f5e';
        ctx.lineWidth = 6;
        for (let a = -1; a <= 1; a++) {
          ctx.beginPath();
          ctx.moveTo(tx + a * 34, ty + 95);
          ctx.lineTo(tx + a * 20 + Math.sin(state.elapsed * 40 + a) * 10, ty + 20);
          ctx.lineTo(tx + a * 26, ty - 75);
          ctx.stroke();
        }
        // Upward danger chevron
        ctx.fillStyle = isJustZone ? '#fde047' : '#f43f5e';
        ctx.beginPath();
        ctx.moveTo(tx, ty - 115);
        ctx.lineTo(tx - 24, ty - 78);
        ctx.lineTo(tx + 24, ty - 78);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    ctx.restore(); // end opponent transform
  }

  function drawPlayerGloves1stPerson() {
    const p = state.player;
    const bob = Math.sin(state.elapsed * 3.6) * 8;
    const isUltraReady = p.koGauge >= 100;

    // Base resting first-person glove coordinates
    let lx = 108, ly = H - 115 + bob, lr = 86;
    let rx = W - 108, ry = H - 115 - bob, rr = 86;

    // Dodge shift
    if (p.dodgeTimer > 0) {
      const env = Math.sin((p.dodgeTimer / p.dodgeDur) * Math.PI);
      if (p.dodgeDir === 'left') { lx -= 46 * env; rx -= 58 * env; ly += 14 * env; }
      else if (p.dodgeDir === 'right') { lx += 58 * env; rx += 46 * env; ry += 14 * env; }
      else if (p.dodgeDir === 'duck') { ly += 78 * env; ry += 78 * env; }
    }

    // Punch lunge animation in 3D perspective (scales down slightly as fist rockets toward opponent's chin!)
    if (p.punchTimer > 0) {
      const prog = 1 - p.punchTimer / p.punchDur;
      const thrust = Math.sin(prog * Math.PI);
      if (p.punchSide === 'left') {
        lx = lerp(lx, W / 2 - 22, thrust);
        ly = lerp(ly, 355, thrust);
        lr = lerp(86, 60, thrust);
        // Motion trail
        ctx.save();
        ctx.strokeStyle = 'rgba(56,189,248,0.45)';
        ctx.lineWidth = 44 * thrust;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(100, H - 90);
        ctx.lineTo(lx, ly);
        ctx.stroke();
        ctx.restore();
      } else if (p.punchSide === 'right') {
        rx = lerp(rx, W / 2 + 22, thrust);
        ry = lerp(ry, 355, thrust);
        rr = lerp(86, 60, thrust);
        ctx.save();
        ctx.strokeStyle = 'rgba(56,189,248,0.45)';
        ctx.lineWidth = 44 * thrust;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W - 100, H - 90);
        ctx.lineTo(rx, ry);
        ctx.stroke();
        ctx.restore();
      } else if (p.punchSide === 'upper' || p.punchSide === 'ultra') {
        const isUltra = p.punchSide === 'ultra';
        rx = lerp(W / 2 + 55, W / 2, thrust);
        ry = lerp(H + 30, 310, easeOutCubic(thrust));
        rr = lerp(104, isUltra ? 76 : 64, thrust);
        // Rising fiery uppercut arc!
        ctx.save();
        const ug = ctx.createLinearGradient(rx, H, rx, ry);
        ug.addColorStop(0, isUltra ? 'rgba(244,63,94,0)' : 'rgba(56,189,248,0)');
        ug.addColorStop(0.5, isUltra ? 'rgba(253,224,71,0.85)' : 'rgba(56,189,248,0.65)');
        ug.addColorStop(1, '#ffffff');
        ctx.strokeStyle = ug;
        ctx.lineWidth = isUltra ? 68 * thrust : 42 * thrust;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(W / 2 + 40, H + 10);
        ctx.quadraticCurveTo(W / 2 + 12, H * 0.65, rx, ry);
        ctx.stroke();
        ctx.restore();
      }
    }

    const gCol = isUltraReady ? '#f59e0b' : '#0284c7';
    const gTrim = isUltraReady ? '#fef08a' : '#e0f2fe';
    const glow = isUltraReady ? '#fde047' : (state.enemy.counterWindow > 0 ? '#38bdf8' : null);
    const glowA = isUltraReady ? 0.85 : (state.enemy.counterWindow > 0 ? 0.65 : 0);

    drawGlove3D(lx, ly, lr, gCol, gTrim, glow, glowA);
    drawGlove3D(rx, ry, rr, gCol, gTrim, glow, glowA);
  }

  // =========================================================================
  // TELEGRAPH WARNINGS, SPEED LINES & HUD
  // =========================================================================
  function drawActionOverlays() {
    const e = state.enemy;
    const p = state.player;
    const diff = getDiff();

    // Manga-style Radial Speed Lines on JUST SLIP & ULTRA KO!
    if (state.speedLines > 0.02) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.65, state.speedLines);
      ctx.strokeStyle = state.speedLineColor;
      const num = 28;
      for (let i = 0; i < num; i++) {
        const ang = (i / num) * Math.PI * 2 + state.elapsed * 2;
        const r1 = 230 + (i % 3) * 35;
        const r2 = 620;
        ctx.lineWidth = (i % 2 === 0) ? 5 : 2.5;
        ctx.beginPath();
        ctx.moveTo(W / 2 + Math.cos(ang) * r1, H * 0.44 + Math.sin(ang) * r1);
        ctx.lineTo(W / 2 + Math.cos(ang) * r2, H * 0.44 + Math.sin(ang) * r2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Impact Rings
    for (const rg of state.rings) {
      const prog = 1 - rg.timer / rg.dur;
      const r = rg.maxR * easeOutCubic(prog);
      ctx.save();
      ctx.globalAlpha = (1 - prog) * 0.9;
      ctx.strokeStyle = rg.color;
      ctx.lineWidth = rg.lineW * (1 - prog * 0.7);
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Particles (sparks & sweat)
    for (const pt of state.particles) {
      const a = clamp(pt.life / pt.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = pt.color;
      if (pt.kind === 'spark') {
        ctx.strokeStyle = pt.color;
        ctx.lineWidth = pt.size * 0.65;
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);
        ctx.lineTo(pt.x - pt.vx * 0.035, pt.y - pt.vy * 0.035);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Side Danger Flash & Duck-Hunting Uppercut Warning Callout
    if (e.state === 'windup' && !e.attackResolved) {
      const isJust = e.stateTimer <= diff.justWin;
      if (e.attackType === 'duck_upper') {
        // Blazing bottom crimson warning band!
        const g = ctx.createLinearGradient(0, H - 240, 0, H);
        g.addColorStop(0, 'rgba(244,63,94,0)');
        g.addColorStop(1, isJust ? 'rgba(253,224,71,0.55)' : 'rgba(244,63,94,0.52)');
        ctx.fillStyle = g;
        ctx.fillRect(0, H - 240, W, 240);

        ctx.save();
        ctx.font = '900 28px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        const txt = isJust ? '⚡ 今だ!! 横スワイプ!!' : '⚠ ダック狩りアッパー!! しゃがみ厳禁!';
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#09090b';
        ctx.strokeText(txt, W / 2, 650);
        ctx.fillStyle = isJust ? '#fde047' : '#fb7185';
        ctx.fillText(txt, W / 2, 650);
        ctx.restore();
      } else if (diff.showHintArrows) {
        const hintTxt = e.attackType === 'left_hook' ? '→ 右スワイプ / ↓ ダック'
          : (e.attackType === 'right_hook' ? '← 左スワイプ / ↓ ダック' : '←→ 横スワイプ!');
        ctx.save();
        ctx.font = '900 22px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#09090b';
        ctx.strokeText(hintTxt, W / 2, 650);
        ctx.fillStyle = isJust ? '#fde047' : '#e2e8f0';
        ctx.fillText(hintTxt, W / 2, 650);
        ctx.restore();
      }
    }

    // Animated Swipe Cue Arrow (for Shorts & Stage 1 onboarding)
    if (state.swipeCue.timer > 0) {
      const d = state.swipeCue.dir;
      const pulse = 0.7 + 0.3 * Math.sin(state.elapsed * 26);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.font = '900 32px "Chakra Petch", "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      const label = d === 'right' ? 'SWIPE ━━▶' : (d === 'left' ? '◀━━ SWIPE' : '▼ DUCK ▼');
      const col = d === 'duck' ? '#a3e635' : '#38bdf8';
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#09090b';
      ctx.strokeText(label, W / 2, 730);
      ctx.fillStyle = col;
      ctx.fillText(label, W / 2, 730);
      ctx.restore();
    }

    // ULTRA READY Prompt
    if (p.koGauge >= 100 && e.state !== 'ko') {
      const pulse = 0.8 + 0.2 * Math.sin(state.elapsed * 14);
      ctx.save();
      ctx.translate(W / 2, H - 195);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = 'rgba(245,158,11,0.92)';
      ctx.beginPath();
      ctx.roundRect(-165, -24, 330, 48, 999);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = '900 22px "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#09090b';
      ctx.fillText('▲ 上スワイプで必殺 ULTRA KO!!', 0, 8);
      ctx.restore();
    }

    // Popups
    for (const pp of state.popups) {
      const a = clamp(pp.timer / (pp.dur * 0.45), 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = `900 ${pp.size}px "Chakra Petch", "Noto Sans JP", sans-serif`;

      ctx.strokeStyle = '#09090b';

    // Red Damage Vignette
    if (state.vignetteRed > 0.01) {
      const vg = ctx.createRadialGradient(W / 2, H / 2, 180, W / 2, H / 2, 560);

      ctx.fillRect(0, 0, W, H);

    // Fullscreen Impact Flash
    if (state.flashAlpha > 0.01) {
      ctx.save();
      ctx.globalAlpha = state.flashAlpha;
      ctx.fillStyle = state.flashColor;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // Big Slam Banner (STAGE INTRO / ULTRA / K.O.!)
    if (state.banner.timer > 0) {
      const b = state.banner;
      const a = clamp(b.timer / 0.22, 0, 1);

      ctx.globalAlpha = a;
      ctx.translate(W / 2, H * 0.56);

      ctx.strokeStyle = b.color;
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.font = 'italic 900 44px "Chakra Petch", "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#09090b';
      ctx.strokeText(b.text, 0, 6, 476);
      ctx.fillStyle = b.color;
      ctx.fillText(b.text, 0, 6, 476);

      if (b.sub) {
        ctx.font = '900 18px "Noto Sans JP", sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(b.sub, 0, 36, 476);

  // =========================================================================
  function render() {
    state.uiButtons = [];

    if (state.screen === 'title') {
      drawTitleScreen();
      return;
    }
    if (state.screen === 'select') {
      drawStageSelectScreen();
      return;
    }

    // First-person 3D Fight Scene
    const shakeX = (rand() - 0.5) * 2 * state.screenShake;
    const shakeY = (rand() - 0.5) * 2 * state.screenShake;

    ctx.save();
    ctx.translate(W / 2 + shakeX, H / 2 + shakeY);
    ctx.rotate(state.camRoll);
    const zoom = 1 + state.camFovBoost;
    ctx.scale(zoom, zoom);
    ctx.translate(-W / 2 - state.camX, -H / 2 - state.camY);

    drawArena(W / 2, H * 0.44);
    drawOpponent3D(W / 2, H * 0.45);
    ctx.restore();

    // Foreground First-Person Player Gloves (slightly counter-shifted for parallax!)
    ctx.save();
    ctx.translate(shakeX * 0.65 - state.camX * 0.25, shakeY * 0.65 - state.camY * 0.18);
    drawPlayerGloves1stPerson();
    ctx.restore();

    drawActionOverlays();
    drawFightHUD();

    if (state.screen === 'victory') drawResultOverlay(true);
    else if (state.screen === 'defeat') drawResultOverlay(false);
  }

  // =========================================================================
  // ZERO-FRAME LATENCY POINTER & KEYBOARD INPUTS
  // =========================================================================
  let pointerState = { active: false, id: null, sx: 0, sy: 0, swiped: false };

  function toLogicalPos(ev) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((ev.clientX - rect.left) / rect.width) * W,
      y: ((ev.clientY - rect.top) / rect.height) * H,
    };
  }

  canvas.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    unlockAudio();
    const pos = toLogicalPos(ev);

    // Check UI buttons first (instant 0-frame tap!)
    for (let i = state.uiButtons.length - 1; i >= 0; i--) {
      const b = state.uiButtons[i];
      if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
        b.onClick();
        return;
      }
    }

    if (state.screen !== 'fight') return;
    pointerState = { active: true, id: ev.pointerId, sx: pos.x, sy: pos.y, swiped: false };
  }, { passive: false });

  canvas.addEventListener('pointermove', (ev) => {
    if (!pointerState.active || ev.pointerId !== pointerState.id || pointerState.swiped) return;
    ev.preventDefault();
    const pos = toLogicalPos(ev);
    const dx = pos.x - pointerState.sx;
    const dy = pos.y - pointerState.sy;
    const dist = Math.hypot(dx, dy);

    // 0-FRAME DELAY TRIGGER: Fires immediately when finger moves >= 18px!
    if (dist >= 18) {
      pointerState.swiped = true;
      if (Math.abs(dx) >= Math.abs(dy) * 0.85) {
        triggerDodge(dx < 0 ? 'left' : 'right');
      } else if (dy > 0) {
        triggerDodge('duck');
      } else {
        triggerUppercut();
      }
    }
  }, { passive: false });

  function finishPointer(ev) {
    if (!pointerState.active || ev.pointerId !== pointerState.id) return;
    const pos = toLogicalPos(ev);
    if (!pointerState.swiped && state.screen === 'fight') {
      // Crisp tap -> Left or Right Counter Punch!
      triggerPunch(pos.x < W * 0.5 ? 'left' : 'right');
    }
    pointerState.active = false;
  }
  canvas.addEventListener('pointerup', finishPointer);
  canvas.addEventListener('pointercancel', () => { pointerState.active = false; });

  window.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    unlockAudio();
    if (state.screen === 'title' && (ev.code === 'Space' || ev.code === 'Enter')) {
      startFight(state.diffId, Math.min(4, save.cleared[state.diffId].length));
      return;
    }
    if (state.screen !== 'fight') return;
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') triggerDodge('left');
    else if (ev.code === 'ArrowRight' || ev.code === 'KeyD') triggerDodge('right');
    else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') triggerDodge('duck');
    else if (ev.code === 'ArrowUp' || ev.code === 'KeyW' || ev.code === 'Space') triggerUppercut();
    else if (ev.code === 'KeyZ' || ev.code === 'KeyJ') triggerPunch('left');
    else if (ev.code === 'KeyX' || ev.code === 'KeyK') triggerPunch('right');
  });

  // =========================================================================
  // MAIN LOOP & DETERMINISTIC SHORTS STEPPER
  // =========================================================================
  window.__manualStep = false;
  window.__stepFrame = (dtSec = 1 / 60) => {
    update(dtSec);
    render();
  };

  if (SHORTS_MODE) {
    startFight('vhard', 4, true);
  }

  let lastTs = performance.now();
  function rafLoop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (!window.__manualStep) {
      update(dt);
      render();
    }
    requestAnimationFrame(rafLoop);
  }
  requestAnimationFrame(rafLoop);
})();
</script>
</body>
</html>
