  #stage-wrap {
    position: relative;
    width: 100%;
    height: 100%;

    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 30%, #110b20 0%, #03040a 70%, #010104 100%);

  #viewport {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    box-shadow: 0 24px 90px rgba(0, 0, 0, 0.92), 0 0 50px rgba(0, 229, 255, 0.12);
    background: #020308;
    touch-action: none;

    #viewport {
      max-width: 100vw;
      max-height: 100dvh;
      width: 100vw;
      height: calc(100vw * 16 / 9);
      box-shadow: none;
    }
  }
  body.shorts-mode #viewport {
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    box-shadow: none;
  }
  #gl-canvas, #hud-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #hud-canvas {
    z-index: 2;
  }
  .back-link {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    z-index: 50;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(8, 10, 18, 0.86);
    border: 1px solid rgba(0, 229, 255, 0.38);
    color: #f8fafc;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    backdrop-filter: blur(6px);
  }
  body.shorts-mode .back-link {
    display: none;
  }

    rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
    return rngSeed / 4294967296;
  }
  function randRange(a, b) { return a + (b - a) * rand(); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }

    const postPositions = [[-3.1, -3.1], [3.1, -3.1], [-3.1, 3.1], [3.1, 3.1]];
    const postCols = [0xf43f5e, 0x00e5ff, 0x00e5ff, 0xf43f5e];
    postPositions.forEach(([px, pz], idx) => {
      const postMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.8 });
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 2.35, 16), postMat);
      post.position.set(px, 1.15, pz);
      ringGroup.add(post);
      const glowStrip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.155, 0.155, 1.95, 16),
        new THREE.MeshBasicMaterial({ color: postCols[idx] })
      );
      glowStrip.position.set(px, 1.18, pz);
      ringGroup.add(glowStrip);
    });

    const ropeHeights = [0.62, 1.16, 1.70];
    const ropeColors = [0x00e5ff, 0x94a3b8, 0xf43f5e];
    ropeHeights.forEach((ry, idx) => {
      const rMat = new THREE.MeshStandardMaterial({
        color: ropeColors[idx],
        emissive: ropeColors[idx],
        emissiveIntensity: idx === 1 ? 0.25 : 0.95,
        roughness: 0.3,
        metalness: 0.4,
      });
      if (idx !== 1) neonRingMats.push(rMat);
      const backRope = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 6.2, 10), rMat);
      backRope.rotation.z = Math.PI / 2;
      backRope.position.set(0, ry, -3.1);
      ringGroup.add(backRope);
      for (const sx of [-3.1, 3.1]) {
        const sideRope = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 6.2, 10), rMat);
        sideRope.rotation.x = Math.PI / 2;
        sideRope.position.set(sx, ry, 0);
        ringGroup.add(sideRope);
      }
    });

    const coneMat = new THREE.MeshBasicMaterial({
      color: 0x38bdf8, transparent: true, opacity: 0.045,
      side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2.6, 5.6, 32, 1, true), coneMat);
    cone.position.set(0, 3.0, -0.35);
    ringGroup.add(cone);

    const pCount = 80;
    const posArr = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount; i++) {
      posArr[i * 3] = randRange(-4.2, 4.2);
      posArr[i * 3 + 1] = randRange(0.4, 4.4);
      posArr[i * 3 + 2] = randRange(-4.2, 1.4);
    }
    const ptsGeo = new THREE.BufferGeometry();
    ptsGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    ringGroup.add(new THREE.Points(ptsGeo, new THREE.PointsMaterial({
      color: 0x7dd3fc, size: 0.04, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending,
    })));
  })();

  // =========================================================================
  // SCULPTED 3D BOXING GLOVE BUILDER (GLOSSY CLEARCOAT LEATHER + THUMB + NEON CUFF!)
  // =========================================================================
  function createSculptedGlove3D(colorHex, trimHex, isLeft, emissiveHex = 0x000000) {
    const g = new THREE.Group();

    const leatherMat = new THREE.MeshPhysicalMaterial({
      color: colorHex,
      emissive: emissiveHex,
      emissiveIntensity: 0.12,
      roughness: 0.20,
      metalness: 0.20,
      clearcoat: 0.95,
      clearcoatRoughness: 0.16,
    });
    const trimMat = new THREE.MeshStandardMaterial({ color: trimHex, roughness: 0.42, metalness: 0.22 });
    const neonBandMat = new THREE.MeshStandardMaterial({
      color: trimHex, emissive: colorHex, emissiveIntensity: 1.0, roughness: 0.2, metalness: 0.5,
    });

    // Main sculpted knuckle fist dome
    const main = new THREE.Mesh(new THREE.SphereGeometry(0.155, 24, 20), leatherMat);
    main.scale.set(1.04, 0.94, 1.24);
    main.castShadow = true;
    g.add(main);

    // Padded knuckle ridge on impact face
    const ridge = new THREE.Mesh(new THREE.SphereGeometry(0.118, 18, 14), leatherMat);
    ridge.scale.set(1.16, 0.72, 0.80);
    ridge.position.set(0, 0.04, 0.095);
    g.add(ridge);

    // Sculpted thumb bolster tucked along inner side
    const sideSign = isLeft ? 1 : -1;
    const thumb = new THREE.Mesh(new THREE.SphereGeometry(0.078, 16, 14), leatherMat);
    thumb.scale.set(0.82, 1.08, 1.38);
    thumb.position.set(sideSign * 0.122, -0.02, 0.035);
    thumb.rotation.y = sideSign * -0.32;
    g.add(thumb);

    // Taped wrist cuff + glowing neon trim ring
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.096, 0.086, 0.16, 18), trimMat);
    cuff.rotation.x = Math.PI / 2;
    cuff.position.set(0, -0.01, -0.175);
    g.add(cuff);

    const neonRing = new THREE.Mesh(new THREE.TorusGeometry(0.104, 0.015, 12, 24), neonBandMat);
    neonRing.position.set(0, -0.01, -0.115);
    g.add(neonRing);

    g.userData = { leatherMat, neonBandMat };
    return g;
  }

  // =========================================================================
  // SCULPTED 3D ARTICULATED OPPONENT RIG (REAL ANATOMY & NATURAL BOXING GUARD!)
  // =========================================================================
  let oppRig = null;

  function buildOpponentRig(cfg) {
    if (oppRig) {
      scene.remove(oppRig.root);
      scene.remove(oppRig.telegraphRing);
      scene.remove(oppRig.sweepArc);
    }

    const root = new THREE.Group();
    root.position.set(0, 0, -0.35);
    root.scale.setScalar(cfg.height);

    const skinMat = new THREE.MeshStandardMaterial({ color: cfg.skin, roughness: 0.56, metalness: 0.04 });
    const hairMat = new THREE.MeshStandardMaterial({ color: cfg.hair, roughness: 0.55, metalness: 0.15 });
    const trunksMat = new THREE.MeshStandardMaterial({ color: cfg.trunks, roughness: 0.38, metalness: 0.25 });
    const neonMat = new THREE.MeshStandardMaterial({
      color: cfg.neon, emissive: cfg.neon, emissiveIntensity: 1.5, roughness: 0.18, metalness: 0.6,
    });
    const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.28, metalness: 0.85 });

    const b = cfg.bulk;

    // Legs & Trunks
    const pelvis = new THREE.Group();
    pelvis.position.set(0, 0.94, 0);
    root.add(pelvis);

    const trunks = new THREE.Mesh(new THREE.CylinderGeometry(0.22 * b, 0.24 * b, 0.38, 22), trunksMat);
    trunks.position.set(0, -0.06, 0);
    trunks.castShadow = true;
    pelvis.add(trunks);

    const beltMat = cfg.boss
      ? new THREE.MeshStandardMaterial({ color: 0xfde047, emissive: 0xf59e0b, emissiveIntensity: 0.55, roughness: 0.2, metalness: 0.92 })
      : neonMat;
    const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.228 * b, 0.228 * b, 0.072, 24), beltMat);
    belt.position.set(0, 0.12, 0);
    pelvis.add(belt);
    if (cfg.boss) {
      const buckle = new THREE.Mesh(new THREE.OctahedronGeometry(0.062, 1), neonMat);
      buckle.scale.set(1.25, 0.85, 0.45);
      buckle.position.set(0, 0.12, 0.225 * b);
      pelvis.add(buckle);
    }

    for (const sx of [-1, 1]) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.30, 0.07), neonMat);
      stripe.position.set(sx * 0.228 * b, -0.06, 0.02);
      pelvis.add(stripe);

      const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.105 * b, 0.084 * b, 0.54, 16), skinMat);
      thigh.position.set(sx * 0.14 * b, -0.45, sx * 0.03);
      thigh.rotation.z = sx * -0.05;
      pelvis.add(thigh);

      const boot = new THREE.Mesh(new THREE.CylinderGeometry(0.082 * b, 0.092 * b, 0.32, 14), darkMetalMat);
      boot.position.set(sx * 0.165 * b, -0.78, sx * 0.03);
      pelvis.add(boot);
    }

    // ATHLETIC V-TAPER TORSO (Smooth Sculpted Pecs & Subtle Toned Abs)
    const torsoPivot = new THREE.Group();
    torsoPivot.position.set(0, 1.06, 0);
    root.add(torsoPivot);

    const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.29 * b, 0.20 * b, 0.50, 24), skinMat);
    chest.scale.set(1.06, 1.0, 0.68);
    chest.position.set(0, 0.25, 0);
    chest.castShadow = true;
    torsoPivot.add(chest);

    for (const sx of [-1, 1]) {
      const pec = new THREE.Mesh(new THREE.SphereGeometry(0.135 * b, 20, 16), skinMat);
      pec.scale.set(1.12, 0.72, 0.42);
      pec.position.set(sx * 0.125 * b, 0.34, 0.138 * b);
      torsoPivot.add(pec);
    }

    // Subtle anatomical ab definition (flush, realistic!)
    for (let row = 0; row < 3; row++) {
      for (const sx of [-1, 1]) {
        const ab = new THREE.Mesh(new THREE.SphereGeometry(0.048 * b, 14, 12), skinMat);
        ab.scale.set(1.08, 0.72, 0.25);
        ab.position.set(sx * 0.056 * b, 0.205 - row * 0.072, 0.144 * b);
        torsoPivot.add(ab);
      }
    }

    const traps = new THREE.Mesh(new THREE.ConeGeometry(0.22 * b, 0.16, 18), skinMat);
    traps.scale.set(1.2, 1.0, 0.70);
    traps.position.set(0, 0.52, -0.01);
    torsoPivot.add(traps);

    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.084, 0.102, 0.15, 18), skinMat);
    neck.position.set(0, 0.58, 0.01);
    torsoPivot.add(neck);

    if (cfg.neonPads) {
      for (const sx of [-1, 1]) {
        const pad = new THREE.Mesh(new THREE.TorusGeometry(0.13 * b, 0.019, 10, 22), neonMat);
        pad.rotation.y = Math.PI / 2;
        pad.position.set(sx * 0.35 * b, 0.44, 0);
        torsoPivot.add(pad);
      }
    }

    // SCULPTED COHESIVE 3D HEAD (Smooth Tapered Jaw + Fierce Cyber Eyes!)
    const headPivot = new THREE.Group();
    headPivot.position.set(0, 0.73, 0.02);
    torsoPivot.add(headPivot);

    const cranium = new THREE.Mesh(new THREE.SphereGeometry(0.162, 28, 22), skinMat);
    cranium.scale.set(0.90, 1.05, 0.98);
    cranium.castShadow = true;
    headPivot.add(cranium);

    // Smooth tapered jawline & chin (no square box corners!)
    const jaw = new THREE.Mesh(new THREE.CylinderGeometry(0.132, 0.086, 0.14, 24), skinMat);
    jaw.scale.set(0.94, 1.0, 0.92);
    jaw.position.set(0, -0.078, 0.018);
    headPivot.add(jaw);

    const chin = new THREE.Mesh(new THREE.SphereGeometry(0.078, 18, 14), skinMat);
    chin.scale.set(1.0, 0.72, 0.88);
    chin.position.set(0, -0.142, 0.044);
    headPivot.add(chin);

    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.068, 10), skinMat);
    nose.rotation.x = Math.PI * 0.42;
    nose.position.set(0, -0.012, 0.158);
    headPivot.add(nose);

    const brow = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.19, 12), skinMat);
    brow.rotation.z = Math.PI / 2;
    brow.position.set(0, 0.048, 0.138);
    headPivot.add(brow);

    for (const sx of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.SphereGeometry(0.034, 12, 10), skinMat);
      ear.scale.set(0.45, 1.25, 0.75);
      ear.position.set(sx * 0.148, -0.01, -0.005);
      headPivot.add(ear);
    }

    // Intense Glowing Cyber-Fighter Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: cfg.neon });
    for (const sx of [-1, 1]) {
      const socket = new THREE.Mesh(new THREE.BoxGeometry(0.056, 0.020, 0.026), darkMetalMat);
      socket.position.set(sx * 0.054, 0.022, 0.140);
      socket.rotation.z = sx * -0.14;
      headPivot.add(socket);

      const iris = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.013, 0.022), eyeMat);
      iris.position.set(sx * 0.054, 0.022, 0.148);
      iris.rotation.z = sx * -0.14;
      headPivot.add(iris);
    }

    const mouth = new THREE.Mesh(
      new THREE.BoxGeometry(0.076, 0.018, 0.024),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.3 })
    );
    mouth.position.set(0, -0.090, 0.132);
    headPivot.add(mouth);

    // Distinct 3D Hair Styles
    if (cfg.hairStyle === 'mohawk') {
      for (let i = 0; i < 6; i++) {
        const fin = new THREE.Mesh(new THREE.ConeGeometry(0.048, 0.17, 6), hairMat);
        fin.position.set(0, 0.185 - i * 0.014, 0.08 - i * 0.05);
        fin.rotation.x = -0.35 - i * 0.14;
        headPivot.add(fin);
      }
    } else if (cfg.hairStyle === 'spiky') {
      for (let i = 0; i < 11; i++) {
        const ang = (i / 11) * Math.PI * 2;
        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.050, 0.17, 6), hairMat);
        spike.position.set(Math.cos(ang) * 0.10, 0.155, Math.sin(ang) * 0.095);
        spike.rotation.z = -Math.cos(ang) * 0.55;
        spike.rotation.x = Math.sin(ang) * 0.45;
        headPivot.add(spike);
      }
    } else if (cfg.hairStyle === 'buzz' || cfg.hairStyle === 'slick') {
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.168, 22, 16, 0, Math.PI * 2, 0, Math.PI * 0.54), hairMat);
      cap.scale.set(0.91, 1.05, 1.00);
      cap.position.set(0, 0.012, -0.006);
      headPivot.add(cap);
      if (cfg.hairStyle === 'slick') {
        const pomp = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), hairMat);
        pomp.scale.set(1.0, 0.42, 1.35);
        pomp.position.set(0, 0.155, 0.018);
        headPivot.add(pomp);
      }
    }

    // Distinct 3D Accessories
    if (cfg.accessory === 'visor') {
      const visor = new THREE.Mesh(
        new THREE.CylinderGeometry(0.164, 0.164, 0.056, 24, 1, true, -Math.PI * 0.34, Math.PI * 0.68),
        new THREE.MeshStandardMaterial({ color: cfg.neon, emissive: cfg.neon, emissiveIntensity: 1.5, transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      visor.position.set(0, 0.024, 0.008);
      headPivot.add(visor);
    } else if (cfg.accessory === 'crown') {
      const crownMat = new THREE.MeshStandardMaterial({ color: 0xfde047, emissive: 0xf59e0b, emissiveIntensity: 0.65, roughness: 0.18, metalness: 0.92 });
      const baseC = new THREE.Mesh(new THREE.TorusGeometry(0.140, 0.020, 10, 24), crownMat);
      baseC.rotation.x = Math.PI / 2;
      baseC.position.set(0, 0.155, 0);
      headPivot.add(baseC);
      for (let k = 0; k < 5; k++) {
        const a = -0.9 + k * 0.45;
        const prong = new THREE.Mesh(new THREE.ConeGeometry(0.028, 0.115, 5), crownMat);
        prong.position.set(Math.sin(a) * 0.132, 0.215, Math.cos(a) * 0.132);
        headPivot.add(prong);
      }
    } else if (cfg.accessory === 'headband') {
      const band = new THREE.Mesh(new THREE.TorusGeometry(0.154, 0.022, 10, 24), neonMat);
      band.rotation.x = Math.PI / 2;
      band.position.set(0, 0.088, 0);
      headPivot.add(band);
    } else if (cfg.accessory === 'mask') {
      const mask = new THREE.Mesh(new THREE.CylinderGeometry(0.136, 0.114, 0.11, 18, 1, false, -Math.PI * 0.45, Math.PI * 0.9), darkMetalMat);
      mask.position.set(0, -0.088, 0.036);
      headPivot.add(mask);
      const vent = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.022, 0.032), neonMat);
      vent.position.set(0, -0.088, 0.155);
      headPivot.add(vent);
    } else if (cfg.accessory === 'beard') {
      const beard = new THREE.Mesh(new THREE.SphereGeometry(0.130, 18, 14), hairMat);
      beard.scale.set(0.98, 0.80, 0.88);
      beard.position.set(0, -0.105, 0.036);
      headPivot.add(beard);
    } else if (cfg.accessory === 'scar') {
      const scar = new THREE.Mesh(new THREE.BoxGeometry(0.015, 0.095, 0.018), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
      scar.position.set(0.068, -0.005, 0.145);
      scar.rotation.z = -0.35;
      headPivot.add(scar);
    }

    // NATURAL ANATOMICAL 3D ARMS + GLOSSY FORWARD-FACING BOXING GLOVES!
    function buildArm(isScreenLeft) {
      const s = isScreenLeft ? -1 : 1;
      const shoulder = new THREE.Group();
      shoulder.position.set(s * 0.34 * b, 0.44, 0.0);
      torsoPivot.add(shoulder);

      // Rounded Deltoid Shoulder
      const delt = new THREE.Mesh(new THREE.SphereGeometry(0.122 * b, 18, 14), skinMat);
      delt.castShadow = true;
      shoulder.add(delt);

      // Upper Arm hanging DOWN to Elbow
      const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.088 * b, 0.076 * b, 0.34, 16), skinMat);
      upperArm.position.set(0, -0.17, 0);
      shoulder.add(upperArm);

      // Rounded Elbow Joint Pivot
      const elbow = new THREE.Group();
      elbow.position.set(0, -0.34, 0);
      shoulder.add(elbow);

      const elbowCap = new THREE.Mesh(new THREE.SphereGeometry(0.078 * b, 14, 12), skinMat);
      elbow.add(elbowCap);

      // Forearm extending cleanly FORWARD along +Z!
      const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.064 * b, 0.076 * b, 0.32, 16), skinMat);
      forearm.rotation.x = Math.PI / 2;
      forearm.position.set(0, 0, 0.16);
      elbow.add(forearm);

      // Sculpted Glossy 3D Boxing Glove at Wrist!
      const glove = createSculptedGlove3D(cfg.glove, cfg.trim, !isScreenLeft, cfg.neon);
      glove.scale.setScalar(1.16);
      glove.position.set(0, 0, 0.36);
      elbow.add(glove);

      return { shoulder, elbow, glove };
    }

    const leftArm = buildArm(true);   // screen-left arm
    const rightArm = buildArm(false); // screen-right arm

    // Sleek 3D Translucent Neon GUARD SHIELD Arc
    const guardShieldMat = new THREE.MeshBasicMaterial({
      color: 0x00e5ff, transparent: true, opacity: 0, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const guardShield = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.36, 32), guardShieldMat);
    guardShield.position.set(0, 0.56, 0.56);
    torsoPivot.add(guardShield);

    // 3D Attack Telegraph Plasma Ring
    const telegraphMat = new THREE.MeshBasicMaterial({
      color: 0xf43f5e, transparent: true, opacity: 0, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const telegraphRing = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.026, 12, 32), telegraphMat);
    scene.add(telegraphRing);

    // 3D Wide Sweep Horizontal Energy Blade
    const sweepArcMat = new THREE.MeshBasicMaterial({
      color: 0x4ade80, transparent: true, opacity: 0, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const sweepArc = new THREE.Mesh(new THREE.RingGeometry(0.82, 1.04, 36, 1, -Math.PI * 0.35, Math.PI * 0.7), sweepArcMat);
    sweepArc.rotation.x = Math.PI / 2;
    sweepArc.position.set(0, 1.54, 0.55);
    scene.add(sweepArc);

    scene.add(root);

    rimLightL.color.setHex(cfg.neon);
    rimLightR.color.setHex(cfg.boss ? 0xfde047 : 0xf43f5e);
    neonRingMats.forEach((m, i) => {
      if (i === 0) m.color.setHex(cfg.neon);
      else if (m.emissive) m.emissive.setHex(i % 2 === 1 ? cfg.neon : 0xf43f5e);
    });

    oppRig = {
      root, pelvis, torsoPivot, headPivot, leftArm, rightArm,
      skinMat, eyeMat, guardShield, guardShieldMat,
      telegraphRing, telegraphMat, sweepArc, sweepArcMat,
      baseSkinHex: cfg.skin, baseNeonHex: cfg.neon,
    };
  }

  // =========================================================================
  // FIRST-PERSON 3D PLAYER GLOVES RIG (CLEAN FOREGROUND POV!)
  // =========================================================================
  const playerRig = new THREE.Group();
  camera.add(playerRig);
  scene.add(camera);

  const pLeftGlove = createSculptedGlove3D(0x0284c7, 0xe0f2fe, true, 0x00e5ff);
  const pRightGlove = createSculptedGlove3D(0x0284c7, 0xe0f2fe, false, 0x00e5ff);
  pLeftGlove.scale.setScalar(0.92);
  pRightGlove.scale.setScalar(0.92);
  pLeftGlove.rotation.set(0.28, 0.42, -0.22);
  pRightGlove.rotation.set(0.28, -0.42, 0.22);
  pLeftGlove.position.set(-0.30, -0.34, -0.88);
  pRightGlove.position.set(0.30, -0.34, -0.88);
  playerRig.add(pLeftGlove);
  playerRig.add(pRightGlove);

  const pArmMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.45, metalness: 0.35 });
  const pLeftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.098, 0.50, 14), pArmMat);
  pLeftArm.rotation.x = Math.PI / 2;
  pLeftArm.position.set(0, -0.02, -0.38);
  pLeftGlove.add(pLeftArm);
  const pRightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.098, 0.50, 14), pArmMat);
  pRightArm.rotation.x = Math.PI / 2;
  pRightArm.position.set(0, -0.02, -0.38);
  pRightGlove.add(pRightArm);

  // =========================================================================
  // 3D WORLD-SPACE SPARKS & SHOCKWAVE TORUSES
  // =========================================================================
  const vfx3d = [];
  const sparkGeo = new THREE.OctahedronGeometry(0.032, 0);
  const shockGeo = new THREE.TorusGeometry(0.28, 0.028, 10, 32);

  function spawn3DImpact(worldPos, colorHex, count = 18, big = false) {
    impactLight.position.copy(worldPos);
    impactLight.color.setHex(colorHex);
    impactLight.intensity = big ? 12 : 6;

    // Expanding 3D shockwave ring
    const ringMat = new THREE.MeshBasicMaterial({
      color: colorHex, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const ring = new THREE.Mesh(shockGeo, ringMat);
    ring.position.copy(worldPos);
    ring.lookAt(camera.position);
    scene.add(ring);
    vfx3d.push({ mesh: ring, mat: ringMat, type: 'ring', life: big ? 0.38 : 0.24, maxLife: big ? 0.38 : 0.24, maxScale: big ? 5.2 : 2.8 });

    // 3D Sparks flying outward
    for (let i = 0; i < count; i++) {
      const sm = new THREE.MeshBasicMaterial({
        color: i % 3 === 0 ? 0xffffff : colorHex, transparent: true, opacity: 1, blending: THREE.AdditiveBlending,
      });
      const sp = new THREE.Mesh(sparkGeo, sm);
      sp.position.copy(worldPos);
      const spd = randRange(big ? 3.5 : 2.0, big ? 8.5 : 5.2);
      const theta = randRange(0, Math.PI * 2);
      const phi = randRange(-0.8, 1.1);
      scene.add(sp);
      vfx3d.push({
        mesh: sp, mat: sm, type: 'spark',
        vx: Math.cos(theta) * spd,
        vy: Math.sin(phi) * spd + 1.2,
        vz: randRange(-1.5, 2.5),
        life: randRange(0.22, 0.48),
        maxLife: 0.48,
      });
    }
  }

  // =========================================================================
  // WEB AUDIO SYNTH (iOS Safari compatible, muted in SHORTS_MODE)
  // =========================================================================
  let audioCtx = null;
  function unlockAudio() {
    if (SHORTS_MODE || save.muted) return;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }
  function playTone(f0, f1, dur, type = 'sine', gainVal = 0.2, delay = 0) {
    if (SHORTS_MODE || save.muted || !audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, now);
    if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), now + dur);
    g.gain.setValueAtTime(gainVal, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function playNoise(dur, gainVal = 0.2, freq = 1000) {
    if (SHORTS_MODE || save.muted || !audioCtx) return;
    const now = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const flt = audioCtx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.setValueAtTime(freq, now);
    const g = audioCtx.createGain(); g.gain.setValueAtTime(gainVal, now); g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
    src.start(now);
  }
  const SFX = {
    bell() { playTone(880, 860, 0.7, 'triangle', 0.22); playTone(1760, 1740, 0.55, 'sine', 0.14); },
    whoosh() { playNoise(0.10, 0.16, 1000); playTone(310, 130, 0.08, 'sine', 0.08); },
    upperWarn() { playTone(260, 880, 0.22, 'sawtooth', 0.12); playTone(520, 1320, 0.22, 'triangle', 0.10, 0.04); },
    sweepWarn() { playTone(440, 220, 0.22, 'sawtooth', 0.11); },
    justSlip() { playTone(560, 1280, 0.14, 'sine', 0.22); playTone(125, 44, 0.24, 'sine', 0.30); },
    hit(heavy = false, counter = false) {
      playTone(heavy ? 140 : 185, 36, heavy ? 0.22 : 0.12, 'sine', heavy ? 0.40 : 0.24);
      playNoise(heavy ? 0.14 : 0.08, heavy ? 0.30 : 0.18, heavy ? 1100 : 1600);
      if (counter) playTone(740, 1180, 0.10, 'triangle', 0.16);
    },
    guard() { playTone(220, 110, 0.09, 'square', 0.14); playNoise(0.06, 0.15, 700); },
    guardBreak() { playTone(420, 960, 0.18, 'sawtooth', 0.20); playNoise(0.16, 0.28, 1800); },
    hurt(crit = false) { playTone(crit ? 115 : 150, 30, crit ? 0.34 : 0.20, 'sawtooth', crit ? 0.40 : 0.26); playNoise(0.18, crit ? 0.35 : 0.22, 550); },
    ultraKO() { playTone(165, 28, 0.58, 'sine', 0.46); playNoise(0.36, 0.40, 950); playTone(523, 1046, 0.26, 'triangle', 0.22, 0.05); },
  };

  // =========================================================================
  // COMBAT MECHANICS (0-FRAME SWIPE, STRICT TIMING, GUARD BREAK, DUCK HUNT, HIGH SWEEP)
  // =========================================================================
  function isCorrectDodge(attackType, dir) {
    if (attackType === 'left_hook') return dir === 'right' || dir === 'duck';
    if (attackType === 'right_hook') return dir === 'left' || dir === 'duck';
    if (attackType === 'straight') return dir === 'left' || dir === 'right';
    if (attackType === 'duck_upper') return dir === 'left' || dir === 'right'; // DUCK = TRAP!
    if (attackType === 'high_sweep') return dir === 'duck'; // SIDE = CLIPPED! MUST DUCK!
    return false;
  }

  function triggerDodge(dir) {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.14) return;
    if (p.dodgeTimer > 0.08 && p.dodgeDir === dir) return;

    // 0-Frame Dodge Cancel
    p.punchSide = 'none';
    p.punchTimer = 0;
    p.dodgeDir = dir;
    p.dodgeDur = dir === 'duck' ? 0.30 : 0.32;
    p.dodgeTimer = p.dodgeDur;
    p.dodgeQuality = 'none';
    p.dodgeInvuln = 0;

    SFX.whoosh();
    emitEvent('dodge', { dir });

    if (e.state === 'windup' && !e.attackResolved) {
      const rem = e.stateTimer;
      const diff = getDiff();

      if (e.attackType === 'duck_upper' && dir === 'duck') {
        p.dodgeQuality = 'duck_trap';
        addPopup('⚠ ダック狩りだ!!', W / 2, 460, '#f43f5e', 26, 0.52);
        return;
      }
      if (e.attackType === 'high_sweep' && (dir === 'left' || dir === 'right')) {
        p.dodgeQuality = 'wrong';
        addPopup('⚠ 横は刈られる!! 下ダック!', W / 2, 460, '#4ade80', 24, 0.55);
        return;
      }

      if (isCorrectDodge(e.attackType, dir)) {
        if (rem <= diff.justWin) {
          p.dodgeQuality = 'just';
          p.dodgeInvuln = rem + 0.18;
          p.justCount++;
          p.koGauge = clamp(p.koGauge + 26, 0, 100);
          e.attackResolved = true;

          state.slowMoTimer = 0.24;
          state.slowMoScale = 0.25;
          state.speedLines = 0.38;
          state.speedLineColor = '#00e5ff';
          state.flashAlpha = 0.24;
          state.flashColor = '#00e5ff';

          addPopup(`JUST SLIP!! ${Math.max(0.02, rem).toFixed(2)}s`, W / 2, 340, '#00e5ff', 34, 0.78);
          SFX.justSlip();
          emitEvent('just_slip', { dir, rem: +rem.toFixed(3), attack: e.attackType });

          e.state = 'strike';
          e.stateTimer = 0.11;
        } else if (rem <= diff.goodWin) {
          p.dodgeQuality = 'good';
          p.dodgeInvuln = rem + 0.14;
          p.koGauge = clamp(p.koGauge + 10, 0, 100);
          e.attackResolved = true;
          addPopup('NICE SLIP!', W / 2, 360, '#4ade80', 26, 0.56);
          emitEvent('good_slip', { dir });
          e.state = 'strike';
          e.stateTimer = 0.12;
        } else {
          p.dodgeQuality = 'early';
          p.dodgeInvuln = 0;
          addPopup('早すぎ!! EARLY', W / 2, 395, '#fbbf24', 26, 0.55);
          emitEvent('early_dodge', { dir });
        }
      } else {
        p.dodgeQuality = 'wrong';
        p.dodgeInvuln = 0;
        addPopup('逆方向!!', W / 2, 395, '#fb7185', 25, 0.50);
      }
    } else if (e.state === 'feint') {
      p.dodgeQuality = 'early';
      addPopup('フェイントに釣られた!', W / 2, 395, '#fbbf24', 23, 0.52);
    }
  }

  function triggerPunch(side) {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.12 || p.punchTimer > 0.06) return;
    p.punchSide = side;
    p.punchDur = 0.17;
    p.punchTimer = p.punchDur;
    p.punchHitDone = false;
    if (p.dodgeTimer > 0.10) p.dodgeTimer = 0.10;
  }

  function triggerUppercut() {
    if (state.screen !== 'fight') return;
    const p = state.player;
    const e = state.enemy;
    if (e.state === 'ko' || e.state === 'intro') return;
    if (p.hurtTimer > 0.12 || p.punchTimer > 0.07) return;

    const isUltra = p.koGauge >= 100;
    p.punchSide = isUltra ? 'ultra' : 'upper';
    p.punchDur = isUltra ? 0.34 : 0.24;
    p.punchTimer = p.punchDur;
    p.punchHitDone = false;
    if (isUltra) {
      p.koGauge = 0;
      state.slowMoTimer = 0.26;
      state.slowMoScale = 0.35;
      state.speedLines = 0.55;
      state.speedLineColor = '#fde047';
      setBanner('ULTRA COUNTER!!', '一撃必殺ネオンアッパー!!', '#fde047', 0.80);
      emitEvent('ultra_launch');
    }
  }

  function resolvePlayerPunchImpact() {
    const p = state.player;
    const e = state.enemy;
    const isUpper = p.punchSide === 'upper';
    const isUltra = p.punchSide === 'ultra';
    const inCounter = e.counterWindow > 0 || e.state === 'whiff' || e.state === 'stunned';
    const counterHit = inCounter || isUltra;

    // ACTIVE 3D GUARD SYSTEM!
    if (!counterHit && e.state === 'idle' && e.guarding) {
      if (isUpper) {
        // Uppercut CRACKS GUARD OPEN (Guard Break!)
        e.guarding = false;
        e.state = 'stunned';
        e.stateTimer = 0.72;
        e.counterWindow = 0.72;
        e.counterBonus = 1.85;
        p.guardBreaks++;
        e.hp = Math.max(1, e.hp - 18);
        e.hitRecoilY = -0.5;
        e.hitRecoilZ = 0.4;
        state.hitstop = 0.065;
        state.screenShake = 14;
        spawn3DImpact(new THREE.Vector3(0, 1.56, 0.12), 0x00e5ff, 22, true);
        addPopup('GUARD BREAK!!', W / 2, 330, '#00e5ff', 32, 0.72);
        SFX.guardBreak();
        emitEvent('guard_break');
        return;
      } else {
        // Blocked by enemy's raised 3D gloves!
        e.hp = Math.max(1, e.hp - 3);
        e.hitRecoilZ = 0.14;
        e.guardPunishCount++;
        state.screenShake = 6;
        spawn3DImpact(new THREE.Vector3(p.punchSide === 'left' ? -0.18 : 0.18, 1.56, 0.18), 0x38bdf8, 10, false);
        addPopup('GUARDED! ▲アッパーで崩せ', W / 2, 345, '#93c5fd', 22, 0.52);
        SFX.guard();
        emitEvent('blocked');
        // Mashing into guard triggers fast counter-swing!
        if (!SHORTS_MODE && e.guardPunishCount >= 2) {
          e.guardPunishCount = 0;
          startEnemyAttack(pickNextAttack(), 0);
        }
        return;
      }
    }

    e.guardPunishCount = 0;
    let baseDmg = isUltra ? 145 : (isUpper ? 34 : 19);
    if (counterHit && !isUltra) {
      baseDmg = Math.round(baseDmg * (e.counterBonus || 2.2));
    }
    p.combo++;
    if (p.combo > p.maxCombo) p.maxCombo = p.combo;
    const finalDmg = Math.round(baseDmg * (1 + Math.min(p.combo - 1, 6) * 0.08));

    e.hp = Math.max(0, e.hp - finalDmg);
    if (!isUltra) p.koGauge = clamp(p.koGauge + (counterHit ? 14 : 6), 0, 100);

    e.hitFlash = isUltra ? 0.28 : (counterHit ? 0.18 : 0.11);
    e.hitRecoilZ = isUltra ? 1.0 : (isUpper ? 0.58 : 0.36);
    e.hitRecoilX = p.punchSide === 'left' ? 0.65 : (p.punchSide === 'right' ? -0.65 : (rand() - 0.5) * 0.25);
    e.hitRecoilY = (isUpper || isUltra) ? -0.95 : -0.22;

    if (isUltra && e.hp > 0) {
      e.state = 'stunned';
      e.stateTimer = 0.95;
      e.counterWindow = 0.95;
      e.counterBonus = 2.4;
      e.guarding = false;
    } else if (counterHit && e.state === 'whiff') {
      e.state = 'stunned';
      e.stateTimer = Math.max(e.stateTimer, 0.48);
    }

    const hitPos = new THREE.Vector3(
      p.punchSide === 'left' ? -0.14 : (p.punchSide === 'right' ? 0.14 : 0),
      (isUpper || isUltra) ? 1.54 : 1.62,
      0.06
    );

    if (isUltra || e.hp <= 0) {
      state.hitstop = isUltra ? 0.16 : 0.14;
      state.screenShake = 26;
      state.flashAlpha = 0.58;
      state.flashColor = isUltra ? '#fde047' : '#ffffff';
      state.speedLines = 0.68;
      state.speedLineColor = '#fde047';
      spawn3DImpact(hitPos, 0xfde047, 36, true);
      SFX.ultraKO();
      emitEvent(e.hp <= 0 ? 'ko_hit' : 'ultra_hit', { dmg: finalDmg, combo: p.combo });
    } else if (counterHit) {
      state.hitstop = isUpper ? 0.08 : 0.055;
      state.screenShake = isUpper ? 17 : 12;
      state.flashAlpha = 0.22;
      state.flashColor = '#fde047';
      state.speedLines = 0.28;
      state.speedLineColor = '#fde047';
      spawn3DImpact(hitPos, 0xfde047, 20, isUpper);
      SFX.hit(isUpper, true);
      emitEvent('counter_hit', { side: p.punchSide, dmg: finalDmg, combo: p.combo });
    } else {
      state.hitstop = 0.025;
      state.screenShake = 6;
      spawn3DImpact(hitPos, 0x00e5ff, 10, false);
      SFX.hit(isUpper, false);
      emitEvent('punch_hit', { side: p.punchSide, dmg: finalDmg });
    }

    const lbl = isUltra ? `ULTRA KO!! -${finalDmg}` : (counterHit ? `COUNTER!! -${finalDmg}` : `-${finalDmg}`);
    addPopup(lbl, W / 2 + randRange(-26, 26), 310, (isUltra || counterHit) ? '#fde047' : '#ffffff', isUltra ? 36 : (counterHit ? 30 : 23), 0.72);

    if (e.hp <= 0) triggerEnemyKO();
  }

  function triggerEnemyKO() {
    const e = state.enemy;
    e.state = 'ko';
    e.koProgress = 0;
    e.stateTimer = 2.0;
    state.slowMoTimer = 0.85;
    state.slowMoScale = 0.30;
    state.speedLines = 0.85;
    state.speedLineColor = '#fde047';
    setBanner('K.O.!!', `${e.cfg.jpName} を完全粉砕!!`, '#fde047', 1.6);
    SFX.bell();
    emitEvent('ko_finish', { fighter: e.cfg.name });

    if (!SHORTS_MODE) {
      save.totalKOs++;
      if (state.player.maxCombo > save.bestCombo) save.bestCombo = state.player.maxCombo;
      const arr = save.cleared[state.diffId];
      if (!arr.includes(state.stageIdx)) arr.push(state.stageIdx);
      persistSave();
    }
  }

  function pickNextAttack() {
    const cfg = state.enemy.cfg;
    const r = rand();
    if (r < cfg.upperRate) return 'duck_upper';
    if (r < cfg.upperRate + cfg.sweepRate) return 'high_sweep';
    if (r < cfg.upperRate + cfg.sweepRate + 0.22) return 'straight';
    return rand() < 0.5 ? 'left_hook' : 'right_hook';
  }

  function startEnemyAttack(attackType, comboRemaining) {
    const e = state.enemy;
    const cfg = e.cfg;
    e.attackType = attackType;
    e.comboLeft = comboRemaining;
    e.attackResolved = false;
    e.guarding = false;
    const mult = attackType === 'duck_upper' ? 1.08 : (attackType === 'high_sweep' ? 1.12 : (attackType === 'straight' ? 0.94 : 1.0));
    e.windupDur = cfg.windup * mult;
    e.state = 'windup';
    e.stateTimer = e.windupDur;

    if (attackType === 'duck_upper') { SFX.upperWarn(); emitEvent('upper_warn'); }
    else if (attackType === 'high_sweep') { SFX.sweepWarn(); emitEvent('sweep_warn'); }
  }

  function resolveEnemyStrike() {
    const e = state.enemy;
    const p = state.player;
    const diff = getDiff();

    if (e.attackResolved && p.dodgeInvuln > 0) {
      if (e.comboLeft > 0) {
        startEnemyAttack(pickNextAttack(), e.comboLeft - 1);
        e.windupDur *= 0.88;
        e.stateTimer = e.windupDur;
      } else {
        e.state = 'whiff';
        e.stateTimer = diff.counterWindow;
        e.counterWindow = diff.counterWindow;
        e.counterBonus = p.dodgeQuality === 'just' ? 2.4 : 1.65;
        if ((e.attackType === 'duck_upper' || e.attackType === 'high_sweep') && p.dodgeQuality === 'just') {
          e.counterBonus = 2.8;
        }
        addPopup('COUNTER CHANCE!!', W / 2, 275, '#fde047', 27, 0.70);
      }
      return;
    }

    const isDuckCaught = e.attackType === 'duck_upper' && p.dodgeDir === 'duck' && p.dodgeTimer > 0;
    let dmg = Math.round(e.cfg.dmg * diff.dmgMult);
    if (isDuckCaught) dmg = Math.round(dmg * 1.9);
    else if (p.dodgeQuality === 'early') dmg = Math.round(dmg * diff.earlyMult);

    p.hp = Math.max(0, p.hp - dmg);
    p.combo = 0;
    p.hurtTimer = isDuckCaught ? 0.42 : 0.28;
    state.screenShake = isDuckCaught ? 28 : 18;
    state.vignetteRed = isDuckCaught ? 0.95 : 0.65;
    state.flashAlpha = isDuckCaught ? 0.52 : 0.28;
    state.flashColor = '#ef4444';
    state.hitstop = isDuckCaught ? 0.10 : 0.05;

    if (isDuckCaught) {
      setBanner('DUCK CAUGHT!!', 'アッパーで顎をカチ上げられた!!', '#f43f5e', 0.85);
      addPopup(`CRITICAL!! -${dmg}`, W / 2, 465, '#f43f5e', 36, 0.85);
      SFX.hurt(true);
      emitEvent('duck_caught', { dmg });
    } else {
      addPopup(`HIT! -${dmg}`, W / 2, 480, '#fb7185', 30, 0.68);
      SFX.hurt(false);
      emitEvent('player_hit', { dmg });
    }

    if (p.hp <= 0) {
      state.screen = 'defeat';
      setBanner('DOWN... K.O.', 'リベンジして見切れ!!', '#f43f5e', 1.4);
      SFX.bell();
      return;
    }

    e.state = 'idle';
    e.stateTimer = e.cfg.cooldown * 0.9;
    e.guarding = rand() < e.cfg.guardRate;
    e.comboLeft = 0;
  }

  // =========================================================================
  // SHORTS CHOREOGRAPHY (14.5s — REAL THREE.JS 3D FOOTAGE!)
  // =========================================================================
  let shortsDone = new Set();
  function runShortsChoreography(t) {
    const once = (k, fn) => { if (!shortsDone.has(k)) { shortsDone.add(k); fn(); } };

    // ACT 1 (0.00 - 1.15s): NUCLEAR 1-SECOND COLD OPEN — ZEUS OMEGA 3D COUNTER KO!
    if (t >= 0.0) once('a1_s', () => {
      startFight('vhard', 4, true);
      state.player.koGauge = 100;
      state.enemy.hp = 120;
      state.enemy.guarding = false;
      state.enemy.attackType = 'duck_upper';
      state.enemy.windupDur = 0.42;
      state.enemy.state = 'windup';
      state.enemy.stateTimer = 0.24;
      state.swipeCue = { dir: 'right', timer: 0.22 };
      emitEvent('cold_open_start');
    });
    if (t >= 0.14) once('a1_sl', () => { state.enemy.stateTimer = 0.05; triggerDodge('right'); });
    if (t >= 0.30) once('a1_ko', () => {
      state.enemy.counterWindow = 1.0; state.enemy.state = 'whiff';
      state.player.koGauge = 100; triggerUppercut();
      state.slowMoTimer = 0; state.slowMoScale = 1.0;
    });

    // ACT 2 (1.15 - 4.10s): GUARD BREAK & 0-FRAME SWIPE COMBAT — VIPER NEON (NORMAL BOSS)
    if (t >= 1.15) once('a2_s', () => {
      startFight('normal', 4, true);
      state.enemy.state = 'idle';
      state.enemy.guarding = true;
      state.enemy.stateTimer = 4.0;
      state.flashAlpha = 0.42; state.flashColor = '#00e5ff';
      emitEvent('cut_act2');
    });
    if (t >= 1.48) once('a2_blk', () => triggerPunch('left')); // Blocked by 3D Guard!
    if (t >= 1.88) once('a2_brk', () => { state.swipeCue = { dir: 'up', timer: 0.35 }; triggerUppercut(); }); // GUARD BREAK!!
    if (t >= 2.30) once('a2_c1', () => triggerPunch('right'));
    if (t >= 2.54) once('a2_c2', () => triggerPunch('left'));
    if (t >= 2.86) once('a2_atk', () => {
      state.enemy.state = 'windup'; state.enemy.attackType = 'high_sweep';
      state.enemy.windupDur = 0.56; state.enemy.stateTimer = 0.48; state.enemy.attackResolved = false;
      state.swipeCue = { dir: 'duck', timer: 0.48 };
      emitEvent('sweep_warn');
    });
    if (t >= 3.28) once('a2_dck', () => { state.enemy.stateTimer = 0.06; triggerDodge('duck'); });
    if (t >= 3.58) once('a2_c3', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('right'); });
    if (t >= 3.80) once('a2_c4', () => triggerPunch('left'));

    // ACT 3 (4.10 - 7.40s): DUCK-HUNTING UPPERCUT TRAP! — VIKTOR KRANE (HARD 4)
    if (t >= 4.10) once('a3_s', () => {
      startFight('hard', 3, true);
      state.flashAlpha = 0.40; state.flashColor = '#f43f5e';
      state.enemy.state = 'windup'; state.enemy.attackType = 'left_hook';
      state.enemy.windupDur = 0.50; state.enemy.stateTimer = 0.42;
      state.swipeCue = { dir: 'duck', timer: 0.42 };
      emitEvent('cut_act3');
    });
    if (t >= 4.46) once('a3_d1', () => { state.enemy.stateTimer = 0.07; triggerDodge('duck'); });
    if (t >= 4.74) once('a3_p1', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('left'); });
    if (t >= 5.10) once('a3_up', () => {
      state.enemy.state = 'windup'; state.enemy.attackType = 'duck_upper';
      state.enemy.windupDur = 0.62; state.enemy.stateTimer = 0.56; state.enemy.attackResolved = false;
      state.swipeCue = { dir: 'right', timer: 0.56 };
      emitEvent('upper_warn');
    });
    if (t >= 5.60) once('a3_sl', () => { state.enemy.stateTimer = 0.05; triggerDodge('right'); });
    if (t >= 5.92) once('a3_c1', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('left'); });
    if (t >= 6.14) once('a3_c2', () => triggerPunch('right'));
    if (t >= 6.36) once('a3_c3', () => triggerPunch('left'));
    if (t >= 6.60) once('a3_c4', () => triggerUppercut());

    // ACT 4 (7.40 - 9.45s): 4 DIFFICULTIES x 5 MATCHES MONTAGE (TITAN REX & AZRAEL)
    if (t >= 7.40) once('a4_t', () => {
      startFight('hard', 4, true); // TITAN REX (Gold Crown!)
      state.flashAlpha = 0.45; state.flashColor = '#fde047';
      state.enemy.state = 'windup'; state.enemy.attackType = 'straight';
      state.enemy.windupDur = 0.44; state.enemy.stateTimer = 0.34;
      state.swipeCue = { dir: 'left', timer: 0.34 };
      emitEvent('cut_montage', { fighter: 'TITAN REX' });
    });
    if (t >= 7.68) once('a4_ts', () => { state.enemy.stateTimer = 0.06; triggerDodge('left'); });
    if (t >= 7.95) once('a4_th', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerUppercut(); });

    if (t >= 8.40) once('a4_a', () => {
      startFight('vhard', 3, true); // AZRAEL MOON
      state.flashAlpha = 0.45; state.flashColor = '#f43f5e';
      state.enemy.state = 'windup'; state.enemy.attackType = 'right_hook';
      state.enemy.windupDur = 0.42; state.enemy.stateTimer = 0.32;
      state.swipeCue = { dir: 'left', timer: 0.32 };
      emitEvent('cut_montage', { fighter: 'AZRAEL' });
    });
    if (t >= 8.66) once('a4_as', () => { state.enemy.stateTimer = 0.05; triggerDodge('left'); });
    if (t >= 8.94) once('a4_ah1', () => { state.slowMoTimer = 0; state.slowMoScale = 1; triggerPunch('right'); });
    if (t >= 9.12) once('a4_ah2', () => triggerPunch('left'));

    // ACT 5 (9.45 - 14.50s): ZEUS OMEGA 3-DIRECTION DODGE (RIGHT -> DUCK -> LEFT) -> ULTRA KO!
    if (t >= 9.45) once('a5_s', () => {
      startFight('vhard', 4, true);
      state.enemy.hp = 160; state.player.koGauge = 60;
      state.flashAlpha = 0.50; state.flashColor = '#00e5ff';
      state.enemy.state = 'windup'; state.enemy.attackType = 'left_hook'; state.enemy.comboLeft = 0;
      state.enemy.windupDur = 0.44; state.enemy.stateTimer = 0.42;
      state.swipeCue = { dir: 'right', timer: 0.42 };
      emitEvent('cut_finale');
    });
    if (t >= 9.81) once('a5_s1', () => { state.enemy.stateTimer = 0.05; triggerDodge('right'); });
    if (t >= 10.15) once('a5_a2', () => {
      state.slowMoTimer = 0; state.slowMoScale = 1;
      state.enemy.state = 'windup'; state.enemy.attackType = 'high_sweep'; state.enemy.comboLeft = 0;
      state.enemy.windupDur = 0.42; state.enemy.stateTimer = 0.38; state.enemy.attackResolved = false;
      state.swipeCue = { dir: 'duck', timer: 0.38 };
      emitEvent('sweep_warn');
    });
    if (t >= 10.48) once('a5_s2', () => { state.enemy.stateTimer = 0.05; triggerDodge('duck'); });
    if (t >= 10.82) once('a5_a3', () => {
      state.slowMoTimer = 0; state.slowMoScale = 1;
      state.enemy.state = 'windup'; state.enemy.attackType = 'duck_upper'; state.enemy.comboLeft = 0;
      state.enemy.windupDur = 0.52; state.enemy.stateTimer = 0.48; state.enemy.attackResolved = false;
      state.swipeCue = { dir: 'left', timer: 0.48 };
      emitEvent('upper_warn');
    });
    if (t >= 11.24) once('a5_s3', () => { state.enemy.stateTimer = 0.04; triggerDodge('left'); });
    if (t >= 11.62) once('a5_ko', () => {
      state.slowMoTimer = 0; state.slowMoScale = 1;
      state.player.koGauge = 100; state.enemy.hp = 120;
      state.enemy.state = 'whiff'; state.enemy.counterWindow = 1.0;
      triggerUppercut();
    });
  }

  // =========================================================================
  // 3D ANIMATION POSE UPDATER
  // =========================================================================
  function update3DScene(dtClamped) {
    if (!oppRig) return;
    const e = state.enemy;
    const p = state.player;
    const diff = getDiff();

    // Update 3D VFX sparks & shockwaves
    impactLight.intensity = lerp(impactLight.intensity, 0, Math.min(1, dtClamped * 14));
    for (let i = vfx3d.length - 1; i >= 0; i--) {
      const fx = vfx3d[i];
      fx.life -= dtClamped;
      if (fx.life <= 0) {
        scene.remove(fx.mesh);
        fx.mat.dispose();
        vfx3d.splice(i, 1);
        continue;
      }
      const prog = 1 - fx.life / fx.maxLife;
      if (fx.type === 'ring') {
        const sc = 0.5 + easeOutCubic(prog) * fx.maxScale;
        fx.mesh.scale.setScalar(sc);
        fx.mat.opacity = (1 - prog) * 0.95;
      } else {
        fx.vy -= 11.5 * dtClamped;
        fx.mesh.position.x += fx.vx * dtClamped;
        fx.mesh.position.y += fx.vy * dtClamped;
        fx.mesh.position.z += fx.vz * dtClamped;
        fx.mesh.rotation.x += 12 * dtClamped;
        fx.mat.opacity = 1 - prog;
      }
    }

    // Opponent 3D Skeleton Animation!
    const bobX = Math.sin(e.bobPhase) * 0.08;
    const bobY = Math.abs(Math.cos(e.bobPhase)) * 0.055;

    let rootX = bobX;
    let rootY = bobY;
    let rootZ = -0.35 - e.hitRecoilZ * 0.35;
    let rootRotX = 0;
    let torsoRotY = Math.sin(e.bobPhase * 0.5) * 0.10;
    let torsoRotX = 0.06;
    let torsoRotZ = e.hitRecoilX * 0.25;

    // Default orthodox boxing guard stance (gloves held up cleanly in front of chin!)
    let lShX = -0.35, lShY = 0.22, lShZ = -0.14, lElX = -0.72;
    let rShX = -0.35, rShY = -0.22, rShZ = 0.14, rElX = -0.72;

    if (e.guarding && e.state === 'idle') {
      // TIGHT 3D HIGH GUARD! Gloves tucked tightly in front of face/temples!
      lShX = -0.58; lShY = 0.48; lShZ = 0.12; lElX = -1.05;
      rShX = -0.58; rShY = -0.48; rShZ = -0.12; rElX = -1.05;
      oppRig.guardShieldMat.opacity = 0.28 + 0.14 * Math.sin(state.elapsed * 8);
      oppRig.guardShield.rotation.z = state.elapsed * 1.8;
    } else {
      oppRig.guardShieldMat.opacity = lerp(oppRig.guardShieldMat.opacity, 0, Math.min(1, dtClamped * 14));
    }

    // Attack Telegraph 3D Pose
    oppRig.telegraphMat.opacity = 0;
    oppRig.sweepArcMat.opacity = 0;
    oppRig.leftArm.glove.userData.leatherMat.emissiveIntensity = 0.12;
    oppRig.rightArm.glove.userData.leatherMat.emissiveIntensity = 0.12;

    if (e.state === 'feint') {
      const f = Math.sin((e.stateTimer / 0.22) * Math.PI);
      torsoRotY += (e.feintDir === 'left_hook' ? -0.45 : 0.45) * f;
    } else if (e.state === 'windup') {
      const w = easeOutCubic(clamp(1 - e.stateTimer / e.windupDur, 0, 1));
      const isJust = e.stateTimer <= diff.justWin;
      const gTarget = new THREE.Vector3();

      if (e.attackType === 'left_hook') {
        torsoRotY = -0.68 * w;
        lShX = lerp(-0.35, -0.55, w);
        lShZ = lerp(-0.14, -1.08, w);
        lElX = -0.42;
        oppRig.leftArm.glove.userData.leatherMat.emissiveIntensity = isJust ? 1.8 : 0.9;
        oppRig.leftArm.glove.getWorldPosition(gTarget);
        oppRig.telegraphMat.color.setHex(isJust ? 0xfde047 : 0xf97316);
      } else if (e.attackType === 'right_hook') {
        torsoRotY = 0.68 * w;
        rShX = lerp(-0.35, -0.55, w);
        rShZ = lerp(0.14, 1.08, w);
        rElX = -0.42;
        oppRig.rightArm.glove.userData.leatherMat.emissiveIntensity = isJust ? 1.8 : 0.9;
        oppRig.rightArm.glove.getWorldPosition(gTarget);
        oppRig.telegraphMat.color.setHex(isJust ? 0xfde047 : 0xf97316);
      } else if (e.attackType === 'straight') {
        torsoRotY = 0.45 * w;
        rootZ -= 0.14 * w;
        rShX = -0.25; rShY = -0.10; rElX = -0.85;
        oppRig.rightArm.glove.userData.leatherMat.emissiveIntensity = isJust ? 1.8 : 0.9;
        oppRig.rightArm.glove.getWorldPosition(gTarget);
        oppRig.telegraphMat.color.setHex(isJust ? 0xfde047 : 0x00e5ff);
      } else if (e.attackType === 'duck_upper') {
        // MENACING DEEP 3D CROUCH + BLAZING CRIMSON LOWER GLOVE!
        rootY -= 0.30 * w;
        torsoRotX = 0.30 * w;
        torsoRotY = 0.52 * w;
        rShX = lerp(-0.35, 0.38, w);
        rShZ = 0.25 * w;
        rElX = -0.25;
        oppRig.rightArm.glove.userData.leatherMat.emissive.setHex(0xf43f5e);
        oppRig.rightArm.glove.userData.leatherMat.emissiveIntensity = isJust ? 2.4 : 1.5;
        oppRig.rightArm.glove.getWorldPosition(gTarget);
        oppRig.telegraphMat.color.setHex(isJust ? 0xfde047 : 0xf43f5e);
      } else if (e.attackType === 'high_sweep') {
        torsoRotY = -0.72 * w;
        lShX = -0.85; lShZ = -1.18 * w; lElX = -0.25;
        oppRig.leftArm.glove.getWorldPosition(gTarget);
        oppRig.telegraphMat.color.setHex(isJust ? 0xfde047 : 0x4ade80);
        oppRig.sweepArcMat.color.setHex(isJust ? 0xfde047 : 0x4ade80);
        oppRig.sweepArcMat.opacity = 0.38 + w * 0.55;
        oppRig.sweepArc.rotation.z = -w * 0.7;
      }

      if (!e.attackResolved) {
        oppRig.telegraphRing.position.copy(gTarget);
        oppRig.telegraphRing.lookAt(camera.position);
        const shrink = 0.65 + (e.stateTimer / e.windupDur) * 1.45;
        oppRig.telegraphRing.scale.setScalar(shrink);
        oppRig.telegraphMat.opacity = isJust ? 1.0 : 0.80;
      }
    } else if (e.state === 'strike') {
      rootZ += 0.65;
      if (e.attackType === 'left_hook' || e.attackType === 'high_sweep') {
        torsoRotY = 0.72; lShX = -0.95; lShY = 0.65; lElX = -0.15;
        if (e.attackType === 'high_sweep') { oppRig.sweepArcMat.opacity = 0.9; oppRig.sweepArc.rotation.z = 0.6; }
      } else if (e.attackType === 'right_hook') {
        torsoRotY = -0.72; rShX = -0.95; rShY = -0.65; rElX = -0.15;
      } else if (e.attackType === 'straight') {
        torsoRotY = -0.35; rShX = -1.25; rShY = 0.12; rElX = 0.0;
      } else if (e.attackType === 'duck_upper') {
        rootY += 0.14; torsoRotX = -0.20; rShX = -1.45; rElX = -0.85;
      }
    } else if (e.state === 'whiff' || e.state === 'stunned') {
      // Arms flung wide open -> JAW EXPOSED!
      lShX = 0.10; lShZ = -0.88; lElX = -0.25;
      rShX = 0.10; rShZ = 0.88; rElX = -0.25;
      torsoRotX = -0.12;
      if (e.state === 'stunned') torsoRotZ += Math.sin(state.elapsed * 22) * 0.18;
    } else if (e.state === 'ko') {
      const k = easeOutCubic(e.koProgress);
      rootRotX = -k * 1.52;
      rootZ -= k * 1.35;
      rootY -= k * 0.38;
      lShX = -0.2; lShZ = -1.2; rShX = -0.2; rShZ = 1.2;
    }

    oppRig.root.position.set(rootX, rootY, rootZ);
    oppRig.root.rotation.x = rootRotX;
    oppRig.torsoPivot.rotation.set(torsoRotX + e.hitRecoilY * 0.35, torsoRotY, torsoRotZ);
    oppRig.headPivot.rotation.set(e.hitRecoilY * 0.65, e.hitRecoilX * 0.72, e.hitRecoilX * 0.32);

    const armLerp = Math.min(1, dtClamped * 24);
    oppRig.leftArm.shoulder.rotation.x = lerp(oppRig.leftArm.shoulder.rotation.x, lShX, armLerp);
    oppRig.leftArm.shoulder.rotation.y = lerp(oppRig.leftArm.shoulder.rotation.y, lShY, armLerp);
    oppRig.leftArm.shoulder.rotation.z = lerp(oppRig.leftArm.shoulder.rotation.z, lShZ, armLerp);
    oppRig.leftArm.elbow.rotation.x = lerp(oppRig.leftArm.elbow.rotation.x, lElX, armLerp);

    oppRig.rightArm.shoulder.rotation.x = lerp(oppRig.rightArm.shoulder.rotation.x, rShX, armLerp);
    oppRig.rightArm.shoulder.rotation.y = lerp(oppRig.rightArm.shoulder.rotation.y, rShY, armLerp);
    oppRig.rightArm.shoulder.rotation.z = lerp(oppRig.rightArm.shoulder.rotation.z, rShZ, armLerp);
    oppRig.rightArm.elbow.rotation.x = lerp(oppRig.rightArm.elbow.rotation.x, rElX, armLerp);

    oppRig.skinMat.emissive.setHex(e.hitFlash > 0.02 ? 0xffffff : 0x000000);
    oppRig.skinMat.emissiveIntensity = e.hitFlash > 0.02 ? 0.55 : 0;
    oppRig.eyeMat.color.setHex(e.attackType === 'duck_upper' && e.state === 'windup' ? 0xf43f5e : oppRig.baseNeonHex);

    // FIRST-PERSON 3D CAMERA & PLAYER GLOVES!
    let tCamX = Math.sin(state.elapsed * 2.2) * 0.03;
    let tCamY = Math.cos(state.elapsed * 4.4) * 0.02;
    let tCamZ = 0;
    let tRoll = 0;

    if (p.dodgeTimer > 0) {
      const env = Math.sin((p.dodgeTimer / p.dodgeDur) * Math.PI);
      if (p.dodgeDir === 'left') { tCamX = -0.58 * env; tCamY = -0.10 * env; tRoll = 0.16 * env; }
      else if (p.dodgeDir === 'right') { tCamX = 0.58 * env; tCamY = -0.10 * env; tRoll = -0.16 * env; }
      else if (p.dodgeDir === 'duck') { tCamY = -0.48 * env; tCamZ = 0.08 * env; }
    }
    if (p.hurtTimer > 0) {
      tCamY += 0.14 * (p.hurtTimer / 0.35);
      tRoll += Math.sin(state.elapsed * 48) * 0.14;
    }

    const ce = Math.min(1, dtClamped * 20);
    state.camOffX = lerp(state.camOffX, tCamX, ce);
    state.camOffY = lerp(state.camOffY, tCamY, ce);
    state.camOffZ = lerp(state.camOffZ, tCamZ, ce);
    state.camRoll = lerp(state.camRoll, tRoll, ce);

    const sx = (rand() - 0.5) * 0.011 * state.screenShake;
    const sy = (rand() - 0.5) * 0.011 * state.screenShake;
    camera.position.set(state.camOffX + sx, 1.60 + state.camOffY + sy, 2.88 + state.camOffZ);
    camera.lookAt(state.camOffX * 0.25, 1.38 + state.camOffY * 0.35, -0.35);
    camera.rotation.z += state.camRoll;

    // Foreground 3D Player Gloves Pose & Punch Lunges!
    const gBob = Math.sin(state.elapsed * 3.8) * 0.022;
    let lx = -0.30, ly = -0.34 + gBob, lz = -0.88;
    let rx = 0.30, ry = -0.34 - gBob, rz = -0.88;
    const ultraReady = p.koGauge >= 100;

    pLeftGlove.userData.leatherMat.color.setHex(ultraReady ? 0xf59e0b : 0x0284c7);
    pRightGlove.userData.leatherMat.color.setHex(ultraReady ? 0xf59e0b : 0x0284c7);
    pLeftGlove.userData.leatherMat.emissive.setHex(ultraReady ? 0xfde047 : 0x00e5ff);
    pRightGlove.userData.leatherMat.emissive.setHex(ultraReady ? 0xfde047 : 0x00e5ff);
    pLeftGlove.userData.leatherMat.emissiveIntensity = ultraReady ? 0.52 : (e.counterWindow > 0 ? 0.32 : 0.14);
    pRightGlove.userData.leatherMat.emissiveIntensity = ultraReady ? 0.52 : (e.counterWindow > 0 ? 0.32 : 0.14);

    if (p.punchTimer > 0) {
      const prog = 1 - p.punchTimer / p.punchDur;
      const thrust = Math.sin(prog * Math.PI);
      if (p.punchSide === 'left') {
        lx = lerp(-0.30, -0.05, thrust);
        ly = lerp(-0.34, 0.04, thrust);
        lz = lerp(-0.88, -2.45, thrust);
      } else if (p.punchSide === 'right') {
        rx = lerp(0.30, 0.05, thrust);
        ry = lerp(-0.34, 0.04, thrust);
        rz = lerp(-0.88, -2.45, thrust);
      } else if (p.punchSide === 'upper' || p.punchSide === 'ultra') {
        const up = easeOutCubic(thrust);
        rx = lerp(0.24, 0.0, up);
        ry = lerp(-0.56, 0.14, up);
        rz = lerp(-0.88, p.punchSide === 'ultra' ? -2.60 : -2.38, up);
      }
    }

    pLeftGlove.position.set(lx, ly, lz);
    pRightGlove.position.set(rx, ry, rz);
  }

  // =========================================================================
  // MAIN SIMULATION STEP
  // =========================================================================
  function update(rawDt) {
    const dtClamped = Math.max(0, Math.min(Number.isFinite(rawDt) ? rawDt : 1 / 60, 0.05));
    state.elapsed += dtClamped;
    if (SHORTS_MODE) {
      shortsElapsed += dtClamped;
      runShortsChoreography(shortsElapsed);
    }

    if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - dtClamped * 2.6);
    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dtClamped * 58);
    if (state.speedLines > 0) state.speedLines = Math.max(0, state.speedLines - dtClamped * 1.4);
    if (state.vignetteRed > 0) state.vignetteRed = Math.max(0, state.vignetteRed - dtClamped * 2.2);
    if (state.banner.timer > 0) {
      state.banner.timer = Math.max(0, state.banner.timer - dtClamped);
      state.banner.scale = lerp(state.banner.scale, 1.0, Math.min(1, dtClamped * 14));
    }
    if (state.swipeCue.timer > 0) state.swipeCue.timer = Math.max(0, state.swipeCue.timer - dtClamped);

    for (let i = state.popups.length - 1; i >= 0; i--) {
      const pp = state.popups[i];
      pp.timer -= dtClamped;
      pp.y += pp.vy * dtClamped;
      pp.vy *= 0.92;
      if (pp.timer <= 0) state.popups.splice(i, 1);
    }

    if (state.screen === 'title' || state.screen === 'select') {
      state.enemy.bobPhase += dtClamped * 2.5;
      update3DScene(dtClamped);
      return;
    }

    if (state.hitstop > 0) {
      state.hitstop = Math.max(0, state.hitstop - dtClamped);
      update3DScene(dtClamped * 0.08);
      return;
    }

    let timeScale = 1.0;
    if (state.slowMoTimer > 0) {
      state.slowMoTimer = Math.max(0, state.slowMoTimer - dtClamped);
      timeScale = state.slowMoScale;
    }
    const dt = dtClamped * timeScale;

    if (state.screen !== 'fight') {
      update3DScene(dtClamped);
      return;
    }

    state.fightTime += dt;
    const p = state.player;
    const e = state.enemy;

    if (p.dodgeTimer > 0) {
      p.dodgeTimer = Math.max(0, p.dodgeTimer - dt);
      if (p.dodgeTimer === 0) p.dodgeDir = 'none';
    }
    if (p.dodgeInvuln > 0) p.dodgeInvuln = Math.max(0, p.dodgeInvuln - dt);
    if (p.hurtTimer > 0) p.hurtTimer = Math.max(0, p.hurtTimer - dt);

    if (p.punchTimer > 0) {
      p.punchTimer = Math.max(0, p.punchTimer - dt);
      const prog = 1 - p.punchTimer / p.punchDur;
      if (!p.punchHitDone && prog >= 0.36) {
        p.punchHitDone = true;
        resolvePlayerPunchImpact();
      }
      if (p.punchTimer === 0) p.punchSide = 'none';
    }

    e.hitRecoilX = lerp(e.hitRecoilX, 0, Math.min(1, dtClamped * 11));
    e.hitRecoilY = lerp(e.hitRecoilY, 0, Math.min(1, dtClamped * 11));
    e.hitRecoilZ = lerp(e.hitRecoilZ, 0, Math.min(1, dtClamped * 10));
    if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dtClamped);
    if (e.counterWindow > 0) e.counterWindow = Math.max(0, e.counterWindow - dt);
    e.bobPhase += dt * (e.state === 'stunned' ? 9.5 : 3.8);

    if (e.state === 'ko') {
      e.koProgress = Math.min(1, e.koProgress + dt * 1.15);
      e.stateTimer -= dtClamped;
      if (e.stateTimer <= 0 && !SHORTS_MODE) state.screen = 'victory';
      update3DScene(dtClamped);
      return;
    }

    e.stateTimer -= dt;

    if (e.state === 'intro') {
      if (e.stateTimer <= 0) { e.state = 'idle'; e.stateTimer = 0.45; }
    } else if (e.state === 'idle') {
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        const nextAtk = pickNextAttack();
        const comboCnt = rand() < 0.48 ? randInt(0, e.cfg.comboMax - 1) : 0;
        if (rand() < e.cfg.feintRate) {
          e.state = 'feint';
          e.feintDir = nextAtk === 'left_hook' ? 'right_hook' : 'left_hook';
          e.attackType = nextAtk;
          e.comboLeft = comboCnt;
          e.guarding = false;
          e.stateTimer = 0.22;
        } else {
          startEnemyAttack(nextAtk, comboCnt);
        }
      }
    } else if (e.state === 'feint') {
      if (e.stateTimer <= 0 && !SHORTS_MODE) startEnemyAttack(e.attackType, e.comboLeft);
    } else if (e.state === 'windup') {
      if (e.stateTimer <= 0) {
        e.state = 'strike';
        e.stateTimer = 0.10;
        resolveEnemyStrike();
      }
    } else if (e.state === 'strike') {
      if (e.stateTimer <= 0) {
        if (e.attackResolved) resolveEnemyStrike();
        else { e.state = 'idle'; e.stateTimer = e.cfg.cooldown; e.guarding = rand() < e.cfg.guardRate; }
      }
    } else if (e.state === 'whiff' || e.state === 'stunned') {
      if (e.stateTimer <= 0 && !SHORTS_MODE) {
        e.state = 'idle';
        e.stateTimer = e.cfg.cooldown * 0.72;
        e.guarding = rand() < e.cfg.guardRate;
        e.counterWindow = 0;
      }
    }

    update3DScene(dtClamped);
  }

    ctx.font = '800 13px "Noto Sans JP", sans-serif';
    ctx.fillStyle = '#cbd5e1';
    ctx.fillText('勝つたびに強敵が解放！全5試合を勝ち抜け！', W / 2, 102);

    // 4 Difficulty Tabs
    const ids = ['easy', 'normal', 'hard', 'vhard'];
    for (let i = 0; i < 4; i++) {
      const id = ids[i];
      const d = DIFFICULTIES[id];
      const tx = 18 + i * 128;
      const active = state.diffId === id;
      ctx.fillStyle = active ? d.color : 'rgba(20,28,46,0.9)';
      ctx.beginPath(); ctx.roundRect(tx, 120, 120, 36, 9); ctx.fill();
      ctx.font = '900 12px "Chakra Petch", sans-serif';
      ctx.fillStyle = active ? '#020308' : '#cbd5e1';
      ctx.fillText(d.label, tx + 60, 143);
      registerBtn(tx, 120, 120, 36, () => {
        state.diffId = id;
        buildOpponentRig(ROSTER[id][Math.min(4, save.cleared[id].length)]);
      });
    }

    // 5 Escalating Match Cards
    let y = 176;
    for (let i = 0; i < 5; i++) {
      const f = list[i];
      const isClr = cleared.includes(i);
      const isNext = i === maxUnlocked && !isClr;
      const locked = i > maxUnlocked;

      ctx.fillStyle = f.boss ? 'rgba(36,14,26,0.90)' : 'rgba(12,18,32,0.88)';
      ctx.beginPath(); ctx.roundRect(22, y, W - 44, 120, 15); ctx.fill();
      ctx.strokeStyle = isClr ? '#22c55e' : (isNext ? diff.color : (locked ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.22)'));
      ctx.lineWidth = (isNext || f.boss) ? 2.5 : 1.5; ctx.stroke();

      ctx.globalAlpha = locked ? 0.45 : 1.0;

      // Match badge circle
      ctx.fillStyle = '#' + f.glove.toString(16).padStart(6, '0');
      ctx.beginPath(); ctx.arc(64, y + 60, 26, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#' + f.neon.toString(16).padStart(6, '0'); ctx.lineWidth = 3; ctx.stroke();
      ctx.font = 'italic 900 19px "Chakra Petch", sans-serif';
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
      ctx.fillText(`M${f.stage}`, 64, y + 67);

      ctx.textAlign = 'left';
      ctx.font = '900 19px "Noto Sans JP", sans-serif';
      ctx.fillStyle = f.boss ? '#fde047' : '#ffffff';
      ctx.fillText(f.jpName + (f.boss ? ' ★BOSS' : ''), 104, y + 38);

      ctx.font = '700 12.5px "Noto Sans JP", sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`${f.title} ｜ HP ${f.hp} ｜ 最大${f.comboMax}連撃`, 104, y + 64);

      ctx.font = '700 11.5px "Noto Sans JP", sans-serif';
      ctx.fillStyle = '#7dd3fc';
      ctx.fillText(`ガード率 ${Math.round(f.guardRate * 100)}%   ダック狩り ${Math.round(f.upperRate * 100)}%   薙ぎ払い ${Math.round(f.sweepRate * 100)}%`, 104, y + 92);

      // Action Pill
      ctx.fillStyle = locked ? '#334155' : (isClr ? '#16a34a' : diff.color);
      ctx.beginPath(); ctx.roundRect(W - 116, y + 38, 82, 42, 10); ctx.fill();
      ctx.textAlign = 'center';
      ctx.font = '900 13px "Noto Sans JP", sans-serif';
      ctx.fillStyle = locked ? '#94a3b8' : (isClr ? '#ffffff' : '#020308');
      ctx.fillText(locked ? '🔒未開放' : (isClr ? '済・再戦' : '対戦!'), W - 75, y + 64);

      ctx.globalAlpha = 1.0;
      if (!locked) {
        registerBtn(22, y, W - 44, 120, () => startFight(state.diffId, i));
      }
      y += 132;
    }

    drawSmallBtn(W / 2 - 95, 862, 190, 44, '← 難易度選択へ戻る', () => { state.screen = 'title'; });
    ctx.restore();
  }

  function drawResultOverlay(won) {
    const e = state.enemy;
    const p = state.player;
    const diff = getDiff();

    ctx.save();
    ctx.fillStyle = 'rgba(2,3,8,0.74)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(10,14,26,0.96)';
    ctx.beginPath(); ctx.roundRect(32, 195, W - 64, 545, 22); ctx.fill();
    ctx.strokeStyle = won ? '#fde047' : '#f43f5e'; ctx.lineWidth = 3; ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = 'italic 900 58px "Chakra Petch", sans-serif';
    ctx.fillStyle = won ? '#fde047' : '#f43f5e';
    ctx.fillText(won ? 'K.O. WIN!!' : 'KNOCKED OUT', W / 2, 276);

    ctx.font = '900 19px "Noto Sans JP", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`${diff.label} MATCH ${e.cfg.stage}/5：${e.cfg.jpName}`, W / 2, 318);

    ctx.fillStyle = 'rgba(20,28,48,0.85)';
    ctx.beginPath(); ctx.roundRect(58, 344, W - 116, 178, 14); ctx.fill();

    const rows = [
      ['撃破タイム', `${state.fightTime.toFixed(1)} 秒`],
      ['JUST 見切り回数', `${p.justCount} 回`],
      ['ガードブレイク', `${p.guardBreaks} 回`],
      ['最大カウンター連撃', `${p.maxCombo} HIT`],
      ['全20強敵 制覇数', `${countTotalCleared()} / 20`],
    ];
    for (let i = 0; i < rows.length; i++) {
      const ry = 376 + i * 32;
      ctx.textAlign = 'left'; ctx.font = '700 14.5px "Noto Sans JP", sans-serif'; ctx.fillStyle = '#94a3b8';
      ctx.fillText(rows[i][0], 80, ry);
      ctx.textAlign = 'right'; ctx.font = '900 15.5px "Chakra Petch", "Noto Sans JP", sans-serif'; ctx.fillStyle = '#fde047';
      ctx.fillText(rows[i][1], W - 80, ry);
    }

    const hasNext = won && state.stageIdx < 4;
    const primaryLbl = hasNext
      ? `🔥 次の強敵へ（MATCH ${state.stageIdx + 2}/5） ▶`
      : (won ? '🏆 次の難易度へ挑戦する ▶' : '🔥 もう一回リベンジ！');

    ctx.fillStyle = won ? '#fde047' : '#f43f5e';
    ctx.beginPath(); ctx.roundRect(58, 548, W - 116, 64, 14); ctx.fill();
    ctx.textAlign = 'center'; ctx.font = '900 19px "Noto Sans JP", sans-serif';
    ctx.fillStyle = won ? '#020308' : '#ffffff';
    ctx.fillText(primaryLbl, W / 2, 587);
    registerBtn(58, 548, W - 116, 64, () => {
      if (hasNext) startFight(state.diffId, state.stageIdx + 1);
      else if (won) state.screen = 'title';
      else startFight(state.diffId, state.stageIdx);
    });

    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.roundRect(58, 630, W - 116, 54, 14); ctx.fill();
    ctx.font = '800 15.5px "Noto Sans JP", sans-serif'; ctx.fillStyle = '#e2e8f0';
    ctx.fillText('5試合セレクトへ戻る', W / 2, 663);
    registerBtn(58, 630, W - 116, 54, () => { state.screen = 'select'; });
    ctx.restore();
  }

  function render() {
    renderer.render(scene, camera);

    ctx.clearRect(0, 0, W, H);
    state.uiButtons = [];

    if (state.screen === 'title') { drawTitleScreen(); return; }
    if (state.screen === 'select') { drawStageSelectScreen(); return; }
    drawFightHUD();
    if (state.screen === 'victory') drawResultOverlay(true);
    else if (state.screen === 'defeat') drawResultOverlay(false);
  }

  // =========================================================================
  // 0-FRAME LATENCY POINTER & KEYBOARD INPUTS
  // =========================================================================
  let ptr = { active: false, id: null, sx: 0, sy: 0, swiped: false };
  function toPos(ev) {
    const r = hudCanvas.getBoundingClientRect();
    return { x: ((ev.clientX - r.left) / r.width) * W, y: ((ev.clientY - r.top) / r.height) * H };
  }

  hudCanvas.addEventListener('pointerdown', (ev) => {
    ev.preventDefault();
    unlockAudio();
    const pos = toPos(ev);
    for (let i = state.uiButtons.length - 1; i >= 0; i--) {
      const b = state.uiButtons[i];
      if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
        b.onClick();
        return;
      }
    }
    if (state.screen !== 'fight') return;
    ptr = { active: true, id: ev.pointerId, sx: pos.x, sy: pos.y, swiped: false };
  }, { passive: false });

  hudCanvas.addEventListener('pointermove', (ev) => {
    if (!ptr.active || ev.pointerId !== ptr.id || ptr.swiped) return;
    ev.preventDefault();
    const pos = toPos(ev);
    const dx = pos.x - ptr.sx;
    const dy = pos.y - ptr.sy;
    if (Math.hypot(dx, dy) >= 18) {
      ptr.swiped = true;
      if (Math.abs(dx) >= Math.abs(dy) * 0.85) triggerDodge(dx < 0 ? 'left' : 'right');
      else if (dy > 0) triggerDodge('duck');
      else triggerUppercut();
    }
  }, { passive: false });

  function endPtr(ev) {
    if (!ptr.active || ev.pointerId !== ptr.id) return;
    const pos = toPos(ev);
    if (!ptr.swiped && state.screen === 'fight') triggerPunch(pos.x < W * 0.5 ? 'left' : 'right');
    ptr.active = false;
  }
  hudCanvas.addEventListener('pointerup', endPtr);
  hudCanvas.addEventListener('pointercancel', () => { ptr.active = false; });

  window.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    unlockAudio();
    if (state.screen === 'title' && (ev.code === 'Space' || ev.code === 'Enter')) {
      startFight(state.diffId, Math.min(4, save.cleared[state.diffId].length));
      return;
    }
    if (state.screen !== 'fight') return;
    if (ev.code === 'ArrowLeft' || ev.code === 'KeyA') triggerDodge('left');
    else if (ev.code === 'ArrowRight' || ev.code === 'KeyD') triggerDodge('right');
    else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') triggerDodge('duck');
    else if (ev.code === 'ArrowUp' || ev.code === 'KeyW' || ev.code === 'Space') triggerUppercut();
    else if (ev.code === 'KeyZ' || ev.code === 'KeyJ') triggerPunch('left');
    else if (ev.code === 'KeyX' || ev.code === 'KeyK') triggerPunch('right');
  });

  // =========================================================================
  // INITIALIZE & MAIN LOOP
  // =========================================================================
  window.__manualStep = SHORTS_MODE;
  window.__stepFrame = (dtSec = 1 / 60) => { update(dtSec); render(); };

  // Build Zeus Omega 3D showcase on Title screen immediately!
  buildOpponentRig(ROSTER.vhard[4]);
  if (SHORTS_MODE) {
    startFight('vhard', 4, true);
    render();
  }

  let lastTs = performance.now();
  function raf(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (!window.__manualStep) { update(dt); render(); }
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);
})();
</script>
</body>
</html>
