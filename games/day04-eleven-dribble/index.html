<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ELEVEN DRIBBLE｜一人称3D・11人抜きドリブルサッカー</title>
<style>
  :root {
    --lime: #a3e635;
    --cyan: #22d3ee;
    --gold: #facc15;
    --coral: #fb7185;
    --dark: #07110c;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040b08;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 50% 30%, #0d261a 0%, #040b08 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    aspect-ratio: 9 / 16;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
  }
  body.shorts-mode canvas {
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    box-shadow: none;
  }
  .back-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 50;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(8, 22, 16, 0.78);
    border: 1px solid rgba(163, 230, 53, 0.45);
    color: #ecfccb;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    backdrop-filter: blur(6px);
  }
  body.shorts-mode .back-link {
    display: none;
  }
</style>
</head>
<body>
<a class="back-link" href="../../index.html">← ゲーム一覧</a>
<div id="game-wrap">
  <canvas id="game" width="540" height="960"></canvas>
</div>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(window.location.search);
  const SHORTS_MODE = params.get('shorts') === '1';
  if (SHORTS_MODE) {
    document.body.classList.add('shorts-mode');
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 540;
  const H = 960;

  // Event queue for Shorts audio generator
  window.__gameEvents = [];
  function emitEvent(type, extra = {}) {
    window.__gameEvents.push({ type, t: state.elapsed, ...extra });
  }

  // Deterministic PRNG for shorts mode, random for normal play
  let rngSeed = SHORTS_MODE ? 19860622 : (Date.now() & 0xffffffff);
  function rand() {
    rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
    return rngSeed / 4294967296;
  }
  function randRange(a, b) {
    return a + (b - a) * rand();
  }

  // Web Audio Synthesizer (Stadium & Football SFX)
  let audioCtx = null;
  function ensureAudio() {
    if (SHORTS_MODE) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playSfx(type) {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;

    if (type === 'kick') {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(135, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.09);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    } else if (type === 'pass') {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      const f = 520 + Math.min(state.passedCount, 11) * 45;
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 1.35, now + 0.14);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    } else if (type === 'ankle_breaker') {
      [587.33, 880, 1174.66].forEach((freq, idx) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + idx * 0.04);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.15, now + idx * 0.04 + 0.16);
        gain.gain.setValueAtTime(0.16, now + idx * 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.17);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + idx * 0.04);
        osc.stop(now + idx * 0.04 + 0.18);
      });
    } else if (type === 'whistle') {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2850, now);
      osc.frequency.setValueAtTime(2980, now + 0.06);
      osc.frequency.setValueAtTime(2820, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.29);
    } else if (type === 'shoot') {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.22);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.24);
    } else if (type === 'goal') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.07);
        gain.gain.setValueAtTime(0.24, now + i * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.45);
        osc.connect(gain).connect(ac.destination);
        osc.start(now + i * 0.07);
        osc.stop(now + i * 0.07 + 0.46);
      });
    } else if (type === 'tackle') {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.25);
      gain.gain.setValueAtTime(0.24, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.connect(gain).connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.27);
    }
  }

  // Pitch constants
  const PITCH_HALF_W = 13.5;
  const PLAYER_MAX_X = 11.4;
  const GOAL_Z = 335;
  const SHOOT_ZONE_Z = 302;
  const GOAL_HALF_W = 6.2;
  const GOAL_H = 4.2;

  // Game State
  const state = {
    phase: SHORTS_MODE ? 'dribble' : 'title', // 'title' | 'dribble' | 'shoot_zone' | 'shot_flight' | 'goal' | 'gameover'
    elapsed: 0,
    stage: 1,
    score: 0,
    bestScore: 0,
    combo: 0,
    ankleBreakers: 0,
    passedCount: 0, // 0..11
    shields: 2,     // Physical balance shields so 1 bump doesn't insta-kill
    invulnTimer: 0,
    slowMoTimer: 0,
    shakeTimer: 0,
    netRipple: 0,
    bannerText: '',
    bannerSub: '',
    bannerColor: '#a3e635',
    bannerTimer: 0,

    // Player First-Person state
    player: {
      x: 0,
      z: 0,
      vx: 0,
      speedZ: 20.5,
      targetX: 0,
      camRoll: 0,
      bobPhase: 0,
      stepSide: 1, // +1 right foot, -1 left foot
      footKickTimer: 0,
      feintTimer: 0,
      feintDir: 0,
      boostTimer: 0,
    },

    // Ball state in front of player's feet (or flying toward goal)
    ball: {
      x: 0,
      y: 0.44,
      z: 2.3,
      vx: 0,
      vy: 0,
      vz: 0,
      spin: 0,
      curveX: 0,
      trail: [],
    },

    // Shoot zone aiming (-1 left corner .. +1 right corner)
    shootAimX: 0.76,
    shootAimY: 0.68,
    shootTimer: 0,

    // 10 Field Defenders + 1 Goalkeeper (#11)
    defenders: [],
    gk: null,

    // Particles & Confetti
    particles: [],
    speedLines: [],
    stadiumLights: [],
  };

  try {
    const saved = localStorage.getItem('day04_eleven_dribble_best');
    if (saved) state.bestScore = parseInt(saved, 10) || 0;
  } catch (_) {}

  // Pre-build stadium crowd lights
  for (let i = 0; i < 70; i++) {
    state.stadiumLights.push({
      ang: (i / 70) * Math.PI - Math.PI * 0.5,
      row: rand(),
      twinkle: rand() * Math.PI * 2,
      col: rand() > 0.3 ? '#fef08a' : '#38bdf8',
    });
  }

  const DEFENDER_NAMES = [
    'FW #1 チェイサー',
    'FW #2 スプリンター',
    'MF #3 テクニシャン',
    'MF #4 ボランチ',
    'MF #5 インターセプター',
    'MF #6 ハードマーカー',
    'DF #7 サイドバック',
    'DF #8 スライディング鬼',
    'DF #9 フィジカルCB',
    'DF #10 キャプテンCB',
    'GK #11 守護神'
  ];

  const JERSEY_PALETTES = [
    { shirt: '#ef4444', stripe: '#991b1b', shorts: '#111827' }, // Stage 1 Crimson Rivals
    { shirt: '#f59e0b', stripe: '#b45309', shorts: '#1e1b4b' }, // Stage 2 Gold Brazil
    { shirt: '#8b5cf6', stripe: '#5b21b6', shorts: '#0f172a' }, // Stage 3 Royal Champions
  ];

  function buildDefenders(stage) {
    const defs = [];
    const speedMul = 1 + (stage - 1) * 0.16;

    // Deterministic showcase layout for ?shorts=1 so every dribble & ankle breaker looks cinematic across 15.5s
    if (SHORTS_MODE) {
      const shortsConfigs = [
        { num: 1,  z: 28,  baseX: 0.6,  ampX: 3.4, freq: 2.2, style: 'WEAVE' },
        { num: 2,  z: 56,  baseX: -2.2, ampX: 3.8, freq: 2.5, style: 'PRESS' },
        { num: 3,  z: 84,  baseX: 2.3,  ampX: 4.1, freq: 2.7, style: 'SLIDE' },
        { num: 4,  z: 112, baseX: -1.9, ampX: 4.5, freq: 2.4, style: 'WEAVE' },
        { num: 5,  z: 140, baseX: 1.8,  ampX: 4.2, freq: 2.9, style: 'PRESS' },
        { num: 6,  z: 168, baseX: -2.4, ampX: 4.6, freq: 3.1, style: 'SLIDE' },
        { num: 7,  z: 196, baseX: 2.1,  ampX: 4.8, freq: 2.8, style: 'WEAVE' },
        { num: 8,  z: 224, baseX: -1.6, ampX: 5.0, freq: 3.2, style: 'SLIDE' },
        { num: 9,  z: 252, baseX: 2.4,  ampX: 4.5, freq: 3.0, style: 'PRESS' },
        { num: 10, z: 280, baseX: -1.4, ampX: 4.8, freq: 3.4, style: 'SLIDE' },
      ];
      shortsConfigs.forEach((c, idx) => {
        defs.push({
          num: c.num,
          name: DEFENDER_NAMES[idx],
          z: c.z,
          x: c.baseX,
          vx: 0,
          baseX: c.baseX,
          ampX: c.ampX,
          freq: c.freq,
          phase: idx * 1.1,
          phase2: idx * 2.3,
          style: c.style,
          sliding: false,
          slideDir: idx % 2 === 0 ? -1 : 1,
          slideTimer: 0,
          passed: false,
          tackledPlayer: false,
          stridePhase: idx * 0.8,
        });
      });
    } else {
      // Randomized 10 Field Defenders!
      const styles = ['WEAVE', 'PRESS', 'SLIDE', 'FEINT'];
      for (let i = 0; i < 10; i++) {
        const num = i + 1;
        const z = 28 + i * 28;
        const style = i === 0 ? 'WEAVE' : styles[Math.floor(rand() * styles.length)];
        const baseX = randRange(-4.5, 4.5);
        const ampX = randRange(3.4, 6.5) * Math.min(1.25, 0.85 + i * 0.05);
        const freq = randRange(1.7, 3.1) * speedMul;
        defs.push({
          num,
          name: DEFENDER_NAMES[i],
          z,
          x: baseX,
          vx: 0,
          baseX,
          ampX,
          freq,
          phase: randRange(0, Math.PI * 2),
          phase2: randRange(0, Math.PI * 2),
          style,
          sliding: false,
          slideDir: rand() > 0.5 ? 1 : -1,
          slideTimer: 0,
          passed: false,
          tackledPlayer: false,
          stridePhase: randRange(0, Math.PI * 2),
        });
      }
    }

    state.defenders = defs;

    // #11 Goalkeeper
    state.gk = {
      num: 11,
      name: DEFENDER_NAMES[10],
      z: GOAL_Z - 1.5,
      x: 0,
      vx: 0,
      diveDir: 0,
      diveProgress: 0,
      freq: 2.3 * speedMul,
      phase: randRange(0, Math.PI * 2),
      stridePhase: 0,
    };
  }

  function showBanner(text, sub = '', color = '#a3e635', duration = 1.15) {
    state.bannerText = text;
    state.bannerSub = sub;
    state.bannerColor = color;
    state.bannerTimer = duration;
  }

  function spawnTurfParticles(wx, wy, wz, color, count = 14) {
    for (let i = 0; i < count; i++) {
      state.particles.push({
        x: wx + randRange(-0.4, 0.4),
        y: wy + randRange(0, 0.3),
        z: wz + randRange(-0.4, 0.4),
        vx: randRange(-4.5, 4.5),
        vy: randRange(2.0, 6.8),
        vz: randRange(-3, 5),
        size: randRange(3, 7),
        color,
        life: randRange(0.35, 0.75),
        maxLife: 0.75,
      });
    }
  }

  function startMatch(stage = 1) {
    state.stage = stage;
    if (stage === 1) {
      state.score = 0;
    }
    state.phase = 'dribble';
    state.passedCount = 0;
    state.combo = 0;
    state.ankleBreakers = 0;
    state.shields = 2;
    state.invulnTimer = 0;
    state.slowMoTimer = 0;
    state.shakeTimer = 0;
    state.netRipple = 0;

    state.player.x = 0;
    state.player.z = 0;
    state.player.vx = 0;
    state.player.targetX = 0;
    state.player.speedZ = 20.5 + (stage - 1) * 1.8;
    state.player.camRoll = 0;
    state.player.bobPhase = 0;
    state.player.footKickTimer = 0;
    state.player.feintTimer = 0;
    state.player.boostTimer = 0;

    state.ball.x = 0;
    state.ball.y = 0.44;
    state.ball.z = 2.25;
    state.ball.trail = [];

    state.shootAimX = 0.76;
    state.shootAimY = 0.68;
    state.shootTimer = 0;
    state.particles = [];

    buildDefenders(stage);
    showBanner('KICK OFF!', '左右ドラッグで11人抜いてゴールを決めろ！', '#a3e635', 1.5);
    playSfx('whistle');
    emitEvent('kickoff', { stage });
  }

  if (SHORTS_MODE) {
    startMatch(1);
  } else {
    buildDefenders(1);
  }

  // Touch & Pointer Input (100% Intuitive Left/Right Drag)
  const pointer = {
    down: false,
    id: null,
    lastX: 0,
    lastY: 0,
    normX: 0, // -1 .. +1 screen position
  };

  function getCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * W,
      y: ((e.clientY - rect.top) / rect.height) * H,
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (SHORTS_MODE) return;
    ensureAudio();
    const pt = getCanvasPoint(e);

    if (state.phase === 'title') {
      startMatch(1);
      pointer.down = true;
      pointer.id = e.pointerId;
      pointer.lastX = pt.x;
      pointer.lastY = pt.y;
      pointer.normX = (pt.x / W - 0.5) * 2;
      return;
    }

    if (state.phase === 'gameover') {
      startMatch(1);
      return;
    }

    if (state.phase === 'goal') {
      // Tap anywhere to advance to next stage or replay
      startMatch(state.stage + 1);
      return;
    }

    pointer.down = true;
    pointer.id = e.pointerId;
    pointer.lastX = pt.x;
    pointer.lastY = pt.y;
    pointer.normX = (pt.x / W - 0.5) * 2;

    if (state.phase === 'shoot_zone') {
      // Update aim towards touched horizontal side immediately
      state.shootAimX = Math.max(-0.92, Math.min(0.92, (pt.x / W - 0.5) * 2.2));
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (SHORTS_MODE || !pointer.down) return;
    const pt = getCanvasPoint(e);
    const dx = pt.x - pointer.lastX;
    pointer.lastX = pt.x;
    pointer.lastY = pt.y;
    pointer.normX = (pt.x / W - 0.5) * 2;

    if (state.phase === 'dribble') {
      // Direct 1:1 responsive horizontal control: drag left -> move left, drag right -> move right
      const worldDeltaX = (dx / W) * (PLAYER_MAX_X * 2.5);
      const prevVx = state.player.vx;
      state.player.x = Math.max(-PLAYER_MAX_X, Math.min(PLAYER_MAX_X, state.player.x + worldDeltaX));
      state.player.vx = worldDeltaX * 32;

      // Detect rapid direction change (Step-over / Cut-in Feint!)
      if (Math.abs(worldDeltaX) > 0.38 && prevVx * state.player.vx < -8 && state.player.feintTimer <= 0) {
        state.player.feintTimer = 0.32;
        state.player.feintDir = Math.sign(worldDeltaX);
        state.player.footKickTimer = 0.2;
        playSfx('kick');
      }
    } else if (state.phase === 'shoot_zone') {
      state.shootAimX = Math.max(-0.92, Math.min(0.92, state.shootAimX + (dx / W) * 2.4));
    }
  });

  function handlePointerUp() {
    if (SHORTS_MODE) return;
    if (pointer.down && state.phase === 'shoot_zone') {
      fireGoalShot();
    }
    pointer.down = false;
    pointer.id = null;
  }

  window.addEventListener('pointerup', handlePointerUp);
  window.addEventListener('pointercancel', handlePointerUp);

  // Keyboard support for PC testing
  const keys = { left: false, right: false };
  window.addEventListener('keydown', (e) => {
    if (SHORTS_MODE) return;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === ' ' || e.key === 'Enter') {
      if (state.phase === 'title' || state.phase === 'gameover') startMatch(1);
      else if (state.phase === 'goal') startMatch(state.stage + 1);
      else if (state.phase === 'shoot_zone') fireGoalShot();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  function fireGoalShot() {
    if (state.phase !== 'shoot_zone') return;
    state.phase = 'shot_flight';
    state.slowMoTimer = 0;

    // Target corner inside the 3D goal
    const targetX = state.shootAimX * (GOAL_HALF_W * 0.82);
    const targetY = 1.65 + Math.abs(state.shootAimX) * 1.45;
    const distZ = Math.max(10, GOAL_Z - state.ball.z);
    const flightTime = 0.52;

    state.ball.vz = distZ / flightTime;
    state.ball.vx = (targetX - state.ball.x) / flightTime;
    state.ball.vy = (targetY - state.ball.y) / flightTime + 4.5;
    state.ball.curveX = -state.shootAimX * 6.5;

    // Goalkeeper dive reaction
    if (state.gk) {
      state.gk.diveDir = Math.sign(targetX - state.gk.x) || 1;
      state.gk.diveProgress = 0.01;
    }

    playSfx('shoot');
    emitEvent('shoot', { aimX: state.shootAimX });
    spawnTurfParticles(state.ball.x, 0.2, state.ball.z, '#22d3ee', 22);
    showBanner('POWER SHOT!!', 'アウトサイド・カーブシュート！', '#22d3ee', 0.9);
  }

  // 3D First-Person Camera Projection
  function project3D(wx, wy, wz) {
    const camX = state.player.x;
    const camY = 2.15 + Math.sin(state.player.bobPhase * 2) * 0.06;
    const camZ = state.player.z;

    const dx = wx - camX;
    const dy = wy - camY;
    const dz = wz - camZ;

    // Balanced pitch so oncoming defenders stand large in midfield AND the ball sits at your feet
    const pitch = -0.145;
    const cosP = Math.cos(pitch);
    const sinP = Math.sin(pitch);

    const yCam = dy * cosP - dz * sinP;
    const zCam = dy * sinP + dz * cosP;

    if (zCam <= 0.25) return null;

    // Apply subtle first-person camera roll when cutting left/right
    const roll = state.player.camRoll;
    const cosR = Math.cos(roll);
    const sinR = Math.sin(roll);
    const rx = dx * cosR - yCam * sinR;
    const ry = dx * sinR + yCam * cosR;

    const fov = 520;
    const scale = fov / zCam;
    return {
      x: W * 0.5 + rx * scale,
      y: H * 0.38 - ry * scale,
      scale,
      zCam,
    };
  }

  // Update Loop
  function update(rawDt) {
    const dt = Math.min(0.033, rawDt);
    state.elapsed += dt;

    if (state.bannerTimer > 0) state.bannerTimer = Math.max(0, state.bannerTimer - dt);
    if (state.invulnTimer > 0) state.invulnTimer = Math.max(0, state.invulnTimer - dt);
    if (state.shakeTimer > 0) state.shakeTimer = Math.max(0, state.shakeTimer - dt);
    if (state.netRipple > 0) state.netRipple = Math.max(0, state.netRipple - dt * 1.4);
    if (state.player.feintTimer > 0) state.player.feintTimer = Math.max(0, state.player.feintTimer - dt);
    if (state.player.boostTimer > 0) state.player.boostTimer = Math.max(0, state.player.boostTimer - dt);
    if (state.player.footKickTimer > 0) state.player.footKickTimer = Math.max(0, state.player.footKickTimer - dt);

    const timeScale = state.slowMoTimer > 0 ? 0.42 : 1.0;
    if (state.slowMoTimer > 0) state.slowMoTimer = Math.max(0, state.slowMoTimer - dt);
    const effDt = dt * timeScale;

    // Update particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx * effDt;
      p.y += p.vy * effDt;
      p.z += p.vz * effDt;
      p.vy -= 14 * effDt;
      if (p.y < 0) {
        p.y = 0;
        p.vy *= -0.35;
      }
      p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }

    if (state.phase === 'title') {
      state.player.bobPhase += dt * 3;
      return;
    }

    // Update CPU Defenders (Random organic movements + active forward pressure)
    state.defenders.forEach((d) => {
      d.stridePhase += effDt * 11.5;
      const distZ = d.z - state.player.z;

      // Active defenders step slightly toward the ball carrier when within 36m
      if (!d.passed && distZ > 4 && distZ < 36 && state.phase === 'dribble') {
        d.z -= 1.8 * effDt;
      }

      if (d.style === 'WEAVE' || d.style === 'FEINT') {
        const wave1 = Math.sin(state.elapsed * d.freq + d.phase);
        const wave2 = 0.38 * Math.cos(state.elapsed * d.freq * 1.65 + d.phase2);
        const targetX = Math.max(-PLAYER_MAX_X + 1, Math.min(PLAYER_MAX_X - 1, d.baseX + (wave1 + wave2) * d.ampX));
        d.vx = (targetX - d.x) * 8;
        d.x += d.vx * effDt;
      } else if (d.style === 'PRESS') {
        if (distZ > 4 && distZ < 38) {
          const pressTarget = state.player.x * 0.72 + Math.sin(state.elapsed * d.freq + d.phase) * 2.4;
          const diff = pressTarget - d.x;
          d.vx = Math.max(-8.5, Math.min(8.5, diff * 2.6));
          d.x += d.vx * effDt;
        } else {
          const targetX = d.baseX + Math.sin(state.elapsed * d.freq + d.phase) * d.ampX;
          d.vx = (targetX - d.x) * 5;
          d.x += d.vx * effDt;
        }
      } else if (d.style === 'SLIDE') {
        if (!d.sliding && distZ > 9 && distZ < 22) {
          d.sliding = true;
          d.slideTimer = 0.65;
          d.slideDir = state.player.x >= d.x ? 1 : -1;
          if (SHORTS_MODE) {
            d.slideDir = d.baseX > 0 ? -1 : 1;
          }
        }
        if (d.sliding) {
          d.x += d.slideDir * 9.2 * effDt;
          d.x = Math.max(-PLAYER_MAX_X, Math.min(PLAYER_MAX_X, d.x));
          d.vx = d.slideDir * 9.2;
        } else {
          const targetX = d.baseX + Math.sin(state.elapsed * d.freq + d.phase) * (d.ampX * 0.65);
          d.vx = (targetX - d.x) * 5;
          d.x += d.vx * effDt;
        }
      }
    });

    // Update Goalkeeper (#11)
    if (state.gk) {
      state.gk.stridePhase += effDt * 8;
      if (state.phase === 'shot_flight' || state.phase === 'goal') {
        state.gk.diveProgress = Math.min(1, state.gk.diveProgress + dt * 2.4);
        if (state.phase === 'shot_flight') {
          state.gk.x += state.gk.diveDir * 5.8 * dt;
          state.gk.x = Math.max(-GOAL_HALF_W * 0.65, Math.min(GOAL_HALF_W * 0.65, state.gk.x));
        }
      } else {
        const gkWave = Math.sin(state.elapsed * state.gk.freq + state.gk.phase) * 3.1;
        state.gk.vx = (gkWave - state.gk.x) * 6;
        state.gk.x += state.gk.vx * effDt;
      }
    }

    if (state.phase === 'dribble') {
      // SHORTS_MODE Automated Masterpiece 11-Man Dribble Choreography
      if (SHORTS_MODE) {
        let nextDef = null;
        for (let i = 0; i < state.defenders.length; i++) {
          if (!state.defenders[i].passed) {
            nextDef = state.defenders[i];
            break;
          }
        }
        if (nextDef) {
          const distZ = nextDef.z - state.player.z;
          const predDefX = nextDef.x + nextDef.vx * Math.max(0, distZ / 24) * 0.35;
          let desiredX = 0;
          if (distZ > 12) {
            desiredX = predDefX * 0.4;
          } else {
            const dodgeSide = predDefX >= 0 ? -1 : 1;
            desiredX = predDefX + dodgeSide * 3.5;
            desiredX = Math.max(-8.5, Math.min(8.5, desiredX));
          }
          const delta = (desiredX - state.player.x) * 10.5 * effDt;
          const prevVx = state.player.vx;
          state.player.x += delta;
          state.player.vx = delta / Math.max(0.001, effDt);
          if (distZ < 10.0 && distZ > 6.5 && prevVx * state.player.vx <= 0 && state.player.feintTimer <= 0) {
            state.player.feintTimer = 0.28;
            state.player.feintDir = Math.sign(state.player.vx) || 1;
          }
        }
      } else {
        let steer = 0;
        if (keys.left) steer -= 1;
        if (keys.right) steer += 1;
        if (steer !== 0) {
          state.player.vx = steer * 15.5;
          state.player.x = Math.max(-PLAYER_MAX_X, Math.min(PLAYER_MAX_X, state.player.x + state.player.vx * effDt));
        } else if (pointer.down) {
          const targetHoldX = pointer.normX * PLAYER_MAX_X;
          const diff = targetHoldX - state.player.x;
          if (Math.abs(diff) > 0.6) {
            state.player.x = Math.max(-PLAYER_MAX_X, Math.min(PLAYER_MAX_X, state.player.x + diff * 4.2 * effDt));
          }
          state.player.vx *= 0.86;
        } else {
          state.player.vx *= 0.85;
        }
      }

      // Forward sprint speed
      const boostMul = state.player.boostTimer > 0 ? 1.24 : 1.0;
      const forwardSpeed = (SHORTS_MODE ? 19.8 : state.player.speedZ) * boostMul;
      state.player.z += forwardSpeed * effDt;
      state.player.bobPhase += effDt * (9.5 * boostMul);

      // Smooth camera roll based on lateral velocity
      const targetRoll = Math.max(-0.085, Math.min(0.085, -state.player.vx * 0.0045));
      state.player.camRoll += (targetRoll - state.player.camRoll) * 12 * dt;

      // Dribble ball stays just ahead of player's feet with natural touch rhythm
      const prevSin = Math.sin((state.player.bobPhase - effDt * 9.5) * 1.0);
      const currSin = Math.sin(state.player.bobPhase * 1.0);
      if (prevSin <= 0 && currSin > 0) {
        state.player.stepSide = 1;
        state.player.footKickTimer = 0.16;
      } else if (prevSin >= 0 && currSin < 0) {
        state.player.stepSide = -1;
        state.player.footKickTimer = 0.16;
      }

      const touchForwardOffset = 2.05 + Math.abs(Math.sin(state.player.bobPhase)) * 0.42 + (state.player.boostTimer > 0 ? 0.3 : 0);
      const targetBallX = state.player.x + state.player.vx * 0.045;
      state.ball.x += (targetBallX - state.ball.x) * 18 * dt;
      state.ball.z = state.player.z + touchForwardOffset;
      state.ball.y = 0.44 + Math.abs(Math.sin(state.player.bobPhase * 2)) * 0.08;
      state.ball.spin += forwardSpeed * effDt * 1.8;

      state.ball.trail.push({ x: state.ball.x, y: state.ball.y, z: state.ball.z, alpha: 1 });
      if (state.ball.trail.length > 14) state.ball.trail.shift();

      // Check Defender Collisions & Passes
      for (let i = 0; i < state.defenders.length; i++) {
        const d = state.defenders[i];
        if (d.passed) continue;

        const dz = d.z - state.player.z;
        const dx = Math.abs(d.x - state.player.x);

        if (dz < 1.65 && dz > -0.85) {
          const hitRadius = d.sliding ? 1.25 : 1.05;
          if (!SHORTS_MODE && dx < hitRadius && state.invulnTimer <= 0) {
            if (state.shields > 1) {
              state.shields--;
              state.invulnTimer = 1.1;
              state.shakeTimer = 0.35;
              d.passed = true;
              state.passedCount++;
              state.combo = 0;
              playSfx('tackle');
              showBanner('フィジカル接触！', '体勢を立て直した！（残りシールド 1）', '#fbbf24', 1.0);
              spawnTurfParticles(state.ball.x, 0.4, state.ball.z, '#fbbf24', 18);
            } else {
              state.shields = 0;
              state.phase = 'gameover';
              state.shakeTimer = 0.45;
              playSfx('tackle');
              showBanner(`${state.passedCount}人抜きでストップ！`, `${d.name} にボールを奪われた！`, '#fb7185', 2.5);
              return;
            }
          } else if (dz <= 0.35) {
            d.passed = true;
            state.passedCount++;
            state.combo++;

            const isAnkleBreaker = dx < 3.1 || state.player.feintTimer > 0 || d.sliding;
            if (isAnkleBreaker) {
              state.ankleBreakers++;
              state.player.boostTimer = 0.65;
              state.score += 250 * state.combo;
              playSfx('ankle_breaker');
              emitEvent('ankle_breaker', { num: d.num, count: state.passedCount });
              const moveLabel = d.sliding ? 'JUMP & CUT! スライディング回避！' : 'ANKLE BREAKER! キレキレ突破！';
              showBanner(`${state.passedCount}人抜き！！`, `${moveLabel} +${250 * state.combo}`, '#22d3ee', 0.95);
              spawnTurfParticles(state.ball.x, 0.3, state.ball.z, '#22d3ee', 16);
            } else {
              state.score += 150 * state.combo;
              playSfx('pass');
              emitEvent('pass', { num: d.num, count: state.passedCount });
              showBanner(`${state.passedCount}人抜き！`, `${d.name} を突破！ +${150 * state.combo}`, '#a3e635', 0.85);
              spawnTurfParticles(state.ball.x, 0.3, state.ball.z, '#a3e635', 10);
            }
          }
        }
      }

      // Enter Shoot Zone after beating all 10 field players!
      if (state.player.z >= SHOOT_ZONE_Z) {
        state.phase = 'shoot_zone';
        state.shootTimer = 0;
        state.shootAimX = (state.gk && state.gk.x > 0) ? -0.78 : 0.78;
        showBanner('10人突破！GKと1対1！', '左右でコースを狙って指を離してシュート！', '#facc15', 1.4);
        playSfx('whistle');
        emitEvent('shoot_zone');
      }
    } else if (state.phase === 'shoot_zone') {
      state.shootTimer += dt;
      state.player.z += 7.2 * dt;
      state.ball.z = state.player.z + 2.25;
      state.ball.x = state.player.x;

      if (SHORTS_MODE) {
        const targetCorner = state.gk && state.gk.x > 0 ? -0.82 : 0.84;
        state.shootAimX += (targetCorner - state.shootAimX) * 6 * dt;
        if (state.shootTimer >= 0.85) {
          fireGoalShot();
        }
      } else {
        if (keys.left) state.shootAimX = Math.max(-0.92, state.shootAimX - 1.8 * dt);
        if (keys.right) state.shootAimX = Math.min(0.92, state.shootAimX + 1.8 * dt);
        if (state.player.z >= GOAL_Z - 13 || state.shootTimer >= 2.2) {
          fireGoalShot();
        }
      }
    } else if (state.phase === 'shot_flight') {
      state.ball.x += state.ball.vx * dt;
      state.ball.vx += state.ball.curveX * dt;
      state.ball.y += state.ball.vy * dt;
      state.ball.vy -= 9.8 * dt;
      if (state.ball.y < 0.44) state.ball.y = 0.44;
      state.ball.z += state.ball.vz * dt;
      state.ball.spin += 25 * dt;

      state.ball.trail.push({ x: state.ball.x, y: state.ball.y, z: state.ball.z, alpha: 1 });
      if (state.ball.trail.length > 20) state.ball.trail.shift();

      state.player.z += 8.5 * dt;

      if (state.ball.z >= GOAL_Z + 1.2) {
        const gkDist = state.gk ? Math.abs(state.ball.x - state.gk.x) : 99;
        if (!SHORTS_MODE && gkDist < 1.05 && state.ball.y < 2.2) {
          state.phase = 'gameover';
          state.shakeTimer = 0.4;
          playSfx('tackle');
          showBanner('GK スーパーセーブ！', 'あと1人…！次は隅のコースを狙おう！', '#fb7185', 3.0);
        } else {
          // 11-MAN DRIBBLE GOAL!!
          state.passedCount = 11;
          state.phase = 'goal';
          state.netRipple = 1.0;
          state.ball.z = GOAL_Z + 2.1;
          state.ball.vx = 0;
          state.ball.vy = -2.5;
          state.ball.vz = 0;

          const goalBonus = 3000 + state.ankleBreakers * 300 + state.shields * 500;
          state.score += goalBonus;
          if (state.score > state.bestScore) {
            state.bestScore = state.score;
            try {
              localStorage.setItem('day04_eleven_dribble_best', String(state.bestScore));
            } catch (_) {}
          }
          playSfx('goal');
          emitEvent('goal', { score: state.score });
          showBanner('11人抜き GOAL!!', `全員突破達成！ +${goalBonus} PTS`, '#facc15', 4.0);

          for (let i = 0; i < 75; i++) {
            const cols = ['#facc15', '#a3e635', '#22d3ee', '#fb7185', '#ffffff'];
            spawnTurfParticles(
              state.ball.x + randRange(-5, 5),
              randRange(0.5, 3.8),
              GOAL_Z - 0.5,
              cols[i % cols.length],
              1
            );
          }
        }
      }
    } else if (state.phase === 'goal') {
      // Ball bounces gently inside the goal net!
      state.ball.y += state.ball.vy * dt;
      state.ball.vy -= 12 * dt;
      if (state.ball.y < 0.44) {
        state.ball.y = 0.44;
        state.ball.vy = Math.abs(state.ball.vy) * 0.52;
      }
      state.ball.spin *= 0.95;
    }
  }

  // Rendering Helpers
  function drawPolygon3D(pts3D, fillStyle, strokeStyle = null, lineWidth = 1.5) {
    const screenPts = [];
    for (let i = 0; i < pts3D.length; i++) {
      const p = project3D(pts3D[i][0], pts3D[i][1], pts3D[i][2]);
      if (!p) return false;
      screenPts.push(p);
    }
    ctx.beginPath();
    ctx.moveTo(screenPts[0].x, screenPts[0].y);
    for (let i = 1; i < screenPts.length; i++) {
      ctx.lineTo(screenPts[i].x, screenPts[i].y);
    }
    ctx.closePath();
    if (fillStyle) {
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }
    if (strokeStyle) {
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }
    return true;
  }

  function drawLine3D(x1, y1, z1, x2, y2, z2, color, width = 2) {
    const p1 = project3D(x1, y1, z1);
    const p2 = project3D(x2, y2, z2);
    if (!p1 || !p2) return;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
  }

  // Draw a Heroic 3D CPU Defender or Goalkeeper
  function drawDefender3D(d, isGK = false) {
    const base = project3D(d.x, 0, d.z);
    if (!base || base.zCam > 155 || base.zCam < 0.8) return;

    // Heroic arcade character scale so oncoming defenders stand bold and readable in 3D POV
    const s = base.scale * 1.55;
    const x = base.x;
    const y = base.y;
    const palette = JERSEY_PALETTES[(state.stage - 1) % JERSEY_PALETTES.length];
    const shirtColor = isGK ? '#facc15' : palette.shirt;
    const shortsColor = isGK ? '#0f172a' : palette.shorts;

    ctx.save();

    // Ground threat ring & movement direction vector on the grass
    const ringW = Math.max(8, 1.15 * s);
    const ringH = Math.max(3, 0.36 * s);
    ctx.beginPath();
    ctx.ellipse(x, y, ringW, ringH, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.fill();
    ctx.lineWidth = Math.max(1.5, 0.07 * s);
    ctx.strokeStyle = d.sliding ? '#fb7185' : (isGK ? '#facc15' : 'rgba(251, 113, 133, 0.85)');
    ctx.stroke();

    // Draw movement direction arrow on the turf so player can read CPU movement
    if (Math.abs(d.vx) > 0.6 && base.zCam < 65) {
      const dir = Math.sign(d.vx);
      const arrowX = x + dir * ringW * 1.3;
      ctx.beginPath();
      ctx.moveTo(x + dir * ringW * 0.7, y);
      ctx.lineTo(arrowX, y);
      ctx.lineTo(arrowX - dir * 8, y - 5);
      ctx.moveTo(arrowX, y);
      ctx.lineTo(arrowX - dir * 8, y + 5);
      ctx.strokeStyle = d.sliding ? '#fb7185' : '#fde047';
      ctx.lineWidth = Math.max(2, 0.08 * s);
      ctx.stroke();
    }

    // Sliding posture vs Running/Diving posture
    if (d.sliding) {
      const dir = d.slideDir || 1;
      ctx.translate(x, y - 0.55 * s);
      ctx.rotate(dir * 0.65);

      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(-0.3 * s, 0.1 * s, 1.15 * s * dir, 0.28 * s);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0.75 * s * dir, 0.08 * s, 0.32 * s * dir, 0.32 * s);

      ctx.fillStyle = shirtColor;
      ctx.beginPath();
      ctx.roundRect(-0.48 * s, -0.58 * s, 0.96 * s, 0.75 * s, Math.max(2, 0.14 * s));
      ctx.fill();

      ctx.fillStyle = '#fcd34d';
      ctx.beginPath();
      ctx.arc(0, -0.85 * s, Math.max(3, 0.28 * s), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (base.zCam < 48) {
        ctx.save();
        ctx.font = `900 ${Math.max(12, Math.min(22, Math.round(0.36 * s)))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fb7185';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3.5;
        ctx.strokeText('! SLIDE !', x, y - 1.95 * s);
        ctx.fillText('! SLIDE !', x, y - 1.95 * s);
        ctx.restore();
      }
      return;
    }

    // GK Dive posture
    if (isGK && d.diveProgress > 0) {
      ctx.translate(x, y - 0.9 * s);
      ctx.rotate(d.diveDir * d.diveProgress * 1.15);
    } else {
      ctx.translate(x, y);
    }

    const stride = Math.sin(d.stridePhase) * 0.22 * s;
    const bodyH = 1.95 * s;
    const bodyW = 0.88 * s;

    // Left & Right Legs
    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(-0.32 * s, -0.55 * s + stride, 0.22 * s, 0.52 * s);
    ctx.fillRect(0.10 * s, -0.55 * s - stride, 0.22 * s, 0.52 * s);

    // Shorts
    ctx.fillStyle = shortsColor;
    ctx.fillRect(-0.40 * s, -0.92 * s, 0.80 * s, 0.44 * s);

    // Jersey Torso
    ctx.fillStyle = shirtColor;
    ctx.beginPath();
    ctx.roundRect(-bodyW * 0.5, -1.64 * s, bodyW, 0.78 * s, Math.max(2, 0.14 * s));
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = Math.max(1, 0.04 * s);
    ctx.stroke();

    // Arms
    ctx.fillStyle = shirtColor;
    if (isGK) {
      ctx.fillRect(-0.88 * s, -1.55 * s, 0.42 * s, 0.22 * s);
      ctx.fillRect(0.46 * s, -1.55 * s, 0.42 * s, 0.22 * s);
      ctx.fillStyle = '#a3e635';
      ctx.beginPath();
      ctx.arc(-0.92 * s, -1.44 * s, Math.max(2, 0.16 * s), 0, Math.PI * 2);
      ctx.arc(0.92 * s, -1.44 * s, Math.max(2, 0.16 * s), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-0.64 * s, -1.55 * s - stride * 0.5, 0.2 * s, 0.52 * s);
      ctx.fillRect(0.44 * s, -1.55 * s + stride * 0.5, 0.2 * s, 0.52 * s);
    }

    // Jersey Number on chest
    if (s > 10) {
      ctx.fillStyle = isGK ? '#0f172a' : '#ffffff';
      ctx.font = `900 ${Math.max(10, Math.round(0.38 * s))}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(d.num), 0, -1.25 * s);
    }

    // Head & Hair
    ctx.fillStyle = '#fed7aa';
    ctx.beginPath();
    ctx.arc(0, -1.90 * s, Math.max(3, 0.27 * s), 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(0, -1.96 * s, Math.max(3, 0.26 * s), Math.PI, Math.PI * 2);
    ctx.fill();

    // Overhead Number Marker Badge (`#1`..`#11`) for closest defenders
    if (base.zCam < 70 && !d.passed) {
      const badgeY = -bodyH - 0.45 * s;
      const fontSize = Math.max(11, Math.min(20, Math.round(0.32 * s)));
      ctx.font = `900 ${fontSize}px sans-serif`;
      const label = isGK ? 'GK #11' : `DF #${d.num}`;
      const tw = ctx.measureText(label).width + 14;
      ctx.fillStyle = isGK ? '#facc15' : 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = isGK ? '#000' : '#fb7185';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-tw * 0.5, badgeY - fontSize * 0.7, tw, fontSize * 1.3, 999);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = isGK ? '#0f172a' : '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, badgeY - fontSize * 0.05);
    }

    ctx.restore();
  }

  // Draw 3D Goalpost & Net at GOAL_Z
  function drawGoal3D() {
    const zFront = GOAL_Z;
    const rippleOffset = state.netRipple > 0 ? Math.sin(state.elapsed * 32) * state.netRipple * 0.65 : 0;
    const zBack = GOAL_Z + 3.4 + rippleOffset;
    const hw = GOAL_HALF_W;
    const h = GOAL_H;

    // Back net & Side nets
    const netColor = state.netRipple > 0 ? 'rgba(250, 204, 21, 0.48)' : 'rgba(255, 255, 255, 0.26)';
    const stepsX = 12;
    const stepsY = 6;
    for (let i = 0; i <= stepsX; i++) {
      const gx = -hw + (hw * 2 * i) / stepsX;
      drawLine3D(gx, 0, zBack, gx, h, zBack, netColor, 1.2);
      drawLine3D(gx, h, zFront, gx, h, zBack, netColor, 1.2);
    }
    for (let j = 0; j <= stepsY; j++) {
      const gy = (h * j) / stepsY;
      drawLine3D(-hw, gy, zBack, hw, gy, zBack, netColor, 1.2);
      drawLine3D(-hw, gy, zFront, -hw, gy, zBack, netColor, 1.2);
      drawLine3D(hw, gy, zFront, hw, gy, zBack, netColor, 1.2);
    }

    // Thick Glowing White Goal Frame
    drawLine3D(-hw, 0, zFront, -hw, h, zFront, '#ffffff', 6.5);
    drawLine3D(hw, 0, zFront, hw, h, zFront, '#ffffff', 6.5);
    drawLine3D(-hw, h, zFront, hw, h, zFront, '#ffffff', 6.5);
    drawLine3D(-hw, 0, zBack, -hw, h, zBack, 'rgba(255,255,255,0.55)', 2.5);
    drawLine3D(hw, 0, zBack, hw, h, zBack, 'rgba(255,255,255,0.55)', 2.5);
  }

  // Draw First-Person Soccer Ball & Player's Own Cleats/Boots at Bottom of Screen
  function drawFirstPersonBallAndFeet() {
    // Ball trail
    for (let i = 0; i < state.ball.trail.length; i++) {
      const t = state.ball.trail[i];
      const pt = project3D(t.x, t.y, t.z);
      if (!pt) continue;
      const frac = (i + 1) / state.ball.trail.length;
      const r = Math.max(2, 0.32 * pt.scale * frac);
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      ctx.fillStyle = state.player.boostTimer > 0 || state.phase === 'shot_flight'
        ? `rgba(34, 211, 238, ${frac * 0.45})`
        : `rgba(163, 230, 53, ${frac * 0.28})`;
      ctx.fill();
    }

    // Ball shadow on turf
    const shadowPt = project3D(state.ball.x, 0.02, state.ball.z);
    const ballPt = project3D(state.ball.x, state.ball.y, state.ball.z);
    if (shadowPt) {
      const sr = Math.max(4, 0.45 * shadowPt.scale);
      ctx.beginPath();
      ctx.ellipse(shadowPt.x, shadowPt.y, sr * 1.15, sr * 0.42, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fill();
    }

    // 3D Soccer Ball
    if (ballPt) {
      const r = Math.max(6, 0.43 * ballPt.scale);
      ctx.save();
      ctx.translate(ballPt.x, ballPt.y);

      // Outer glow if boosted or shot
      if (state.player.boostTimer > 0 || state.phase === 'shot_flight') {
        ctx.shadowColor = '#22d3ee';
        ctx.shadowBlur = 18;
      }

      // Base sphere gradient
      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.72, '#e2e8f0');
      grad.addColorStop(1, '#94a3b8');
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, r * 0.06);
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      // Rotating Pentagon Panels on the Soccer Ball
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.96, 0, Math.PI * 2);
      ctx.clip();

      const spin = state.ball.spin;
      ctx.fillStyle = '#0f172a';
      for (let k = 0; k < 5; k++) {
        const ang = (k / 5) * Math.PI * 2 + spin * 0.35;
        const px = Math.cos(ang) * r * 0.52;
        const py = Math.sin(ang + spin * 0.5) * r * 0.52;
        ctx.beginPath();
        ctx.arc(px, py, r * 0.26, 0, Math.PI * 2);
        ctx.fill();
      }
      // Center pentagon
      const cy = ((spin * 18) % (r * 1.4)) - r * 0.7;
      ctx.beginPath();
      ctx.arc(0, cy, r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.restore();
    }

    // First-Person Striker Boots (Left & Right Cleats visible at bottom of POV!)
    if (state.phase === 'dribble' || state.phase === 'shoot_zone') {
      const bob = state.player.bobPhase;
      const leftStride = Math.sin(bob);
      const rightStride = Math.sin(bob + Math.PI);

      drawPOVBoot(-1, leftStride, ballPt);
      drawPOVBoot(1, rightStride, ballPt);
    }
  }

  function drawPOVBoot(side, stride, ballPt) {
    // Only visible when swinging forward in the lower POV frame
    const forwardAmt = Math.max(-0.2, stride);
    const baseX = W * 0.5 + side * 88 + (ballPt ? (ballPt.x - W * 0.5) * 0.35 : 0);
    const baseY = H + 28 - forwardAmt * 88;

    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.rotate(side * -0.18 + (state.player.vx * 0.008));

    // Shin / Sock
    ctx.fillStyle = '#0ea5e9';
    ctx.fillRect(-20, 15, 40, 80);

    // Neon Cyan/Lime Striker Cleat (Boot)
    const bootGrad = ctx.createLinearGradient(0, -52, 0, 25);
    bootGrad.addColorStop(0, '#a3e635');
    bootGrad.addColorStop(0.6, '#22d3ee');
    bootGrad.addColorStop(1, '#0284c7');
    ctx.fillStyle = bootGrad;
    ctx.beginPath();
    ctx.roundRect(-24, -52, 48, 78, [24, 24, 10, 10]);
    ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    // Boot stripes
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(-14, -26, 28, 6);
    ctx.fillRect(-12, -14, 24, 5);
    ctx.restore();
  }

  // Main Render Function
  function render() {
    ctx.save();

    // Camera Shake on physical contact
    if (state.shakeTimer > 0) {
      const mag = state.shakeTimer * 18;
      ctx.translate(randRange(-mag, mag), randRange(-mag, mag));
    }

    // 1. Night Stadium Sky & Floodlights
    const horizonP = project3D(state.player.x, 0, state.player.z + 220);
    const horizonY = horizonP ? horizonP.y : H * 0.32;

    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 20);
    skyGrad.addColorStop(0, '#020617');
    skyGrad.addColorStop(0.6, '#0f172a');
    skyGrad.addColorStop(1, '#064e3b');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, horizonY + 30);

    // Stadium Grandstand Silhouette & Floodlight Beams
    ctx.fillStyle = '#091526';
    ctx.fillRect(0, horizonY - 58, W, 62);

    // Stadium Floodlight Towers
    [W * 0.14, W * 0.38, W * 0.62, W * 0.86].forEach((lx) => {
      const glow = ctx.createRadialGradient(lx, horizonY - 52, 2, lx, horizonY - 52, 72);
      glow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      glow.addColorStop(0.3, 'rgba(186, 230, 253, 0.35)');
      glow.addColorStop(1, 'rgba(186, 230, 253, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(lx, horizonY - 52, 72, 0, Math.PI * 2);
      ctx.fill();
    });

    // Twinkling crowd camera flashes in the stands
    state.stadiumLights.forEach((sl) => {
      const sx = W * 0.5 + sl.ang * W * 1.1;
      const sy = horizonY - 10 - sl.row * 42;
      const alpha = 0.25 + 0.75 * Math.max(0, Math.sin(state.elapsed * 7 + sl.twinkle));
      ctx.fillStyle = sl.col;
      ctx.globalAlpha = alpha;
      ctx.fillRect(sx, sy, 2.5, 2.5);
    });
    ctx.globalAlpha = 1;

    // 2. 3D Pitch Base Turf
    ctx.fillStyle = '#065f46';
    ctx.fillRect(0, horizonY, W, H - horizonY);

    // Draw Alternating Mowed Turf Stripes in 3D Perspective
    const stripeLen = 6;
    const firstStripe = Math.floor(state.player.z / stripeLen);
    for (let i = 36; i >= 0; i--) {
      const idx = firstStripe + i;
      const z1 = Math.max(state.player.z + 0.4, idx * stripeLen);
      const z2 = (idx + 1) * stripeLen;
      if (z2 <= state.player.z + 0.4 || z1 > GOAL_Z + 18) continue;

      const isLight = idx % 2 === 0;
      const turfColor = z1 > GOAL_Z
        ? '#042f2e'
        : (isLight ? '#15803d' : '#166534');

      drawPolygon3D(
        [
          [-PITCH_HALF_W, 0, z1],
          [PITCH_HALF_W, 0, z1],
          [PITCH_HALF_W, 0, z2],
          [-PITCH_HALF_W, 0, z2],
        ],
        turfColor
      );

      // Sideline LED Advertising Boards
      if (z1 < GOAL_Z) {
        const boardCol = idx % 3 === 0 ? '#0284c7' : (idx % 3 === 1 ? '#e11d48' : '#ca8a04');
        drawPolygon3D(
          [
            [-PITCH_HALF_W - 0.8, 0, z1],
            [-PITCH_HALF_W - 0.8, 0.95, z1],
            [-PITCH_HALF_W - 0.8, 0.95, z2],
            [-PITCH_HALF_W - 0.8, 0, z2],
          ],
          boardCol,
          'rgba(255,255,255,0.35)',
          1
        );
        drawPolygon3D(
          [
            [PITCH_HALF_W + 0.8, 0, z1],
            [PITCH_HALF_W + 0.8, 0.95, z1],
            [PITCH_HALF_W + 0.8, 0.95, z2],
            [PITCH_HALF_W + 0.8, 0, z2],
          ],
          boardCol,
          'rgba(255,255,255,0.35)',
          1
        );
      }
    }

    // Crisp White Pitch Markings (Touchlines, Penalty Box, Goal Line)
    const zNear = Math.max(0, state.player.z + 0.5);
    const zFar = GOAL_Z;
    if (zNear < zFar) {
      drawLine3D(-PITCH_HALF_W, 0.02, zNear, -PITCH_HALF_W, 0.02, zFar, 'rgba(255,255,255,0.85)', 3);
      drawLine3D(PITCH_HALF_W, 0.02, zNear, PITCH_HALF_W, 0.02, zFar, 'rgba(255,255,255,0.85)', 3);
    }
    // Penalty Box lines
    const boxZ = SHOOT_ZONE_Z - 4;
    if (boxZ > state.player.z + 0.5) {
      drawLine3D(-9.5, 0.03, boxZ, 9.5, 0.03, boxZ, 'rgba(255,255,255,0.9)', 3);
    }
    if (GOAL_Z > state.player.z + 0.5) {
      drawLine3D(-9.5, 0.03, Math.max(zNear, boxZ), -9.5, 0.03, GOAL_Z, 'rgba(255,255,255,0.9)', 3);
      drawLine3D(9.5, 0.03, Math.max(zNear, boxZ), 9.5, 0.03, GOAL_Z, 'rgba(255,255,255,0.9)', 3);
      drawLine3D(-PITCH_HALF_W, 0.03, GOAL_Z, PITCH_HALF_W, 0.03, GOAL_Z, '#ffffff', 4);
    }

    // 3. Draw 3D Goalpost & Net
    drawGoal3D();

    // 4. Shoot Zone Beaded Curve Trajectory & Aim Reticle!
    if (state.phase === 'shoot_zone') {
      const targetX = state.shootAimX * (GOAL_HALF_W * 0.84);
      const targetY = 1.55 + Math.abs(state.shootAimX) * 1.35;

      // Draw glowing curved shot trajectory beads from ball to target corner
      const steps = 14;
      for (let i = 1; i <= steps; i++) {
        const f = i / steps;
        const bx = state.ball.x + (targetX - state.ball.x) * f + Math.sin(f * Math.PI) * state.shootAimX * 1.4;
        const by = state.ball.y + (targetY - state.ball.y) * f + Math.sin(f * Math.PI) * 1.35;
        const bz = state.ball.z + (GOAL_Z - state.ball.z) * f;
        const bp = project3D(bx, by, bz);
        if (bp) {
          ctx.beginPath();
          ctx.arc(bp.x, bp.y, Math.max(3, (1 - f * 0.45) * 7), 0, Math.PI * 2);
          ctx.fillStyle = i === steps ? '#facc15' : '#22d3ee';
          ctx.fill();
        }
      }

      // Target Reticle in the Goal Corner
      const retP = project3D(targetX, targetY, GOAL_Z);
      if (retP) {
        const rr = 22 + Math.sin(state.elapsed * 14) * 4;
        ctx.save();
        ctx.translate(retP.x, retP.y);
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(0, 0, rr, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-rr - 7, 0);
        ctx.lineTo(rr + 7, 0);
        ctx.moveTo(0, -rr - 7);
        ctx.lineTo(0, rr + 7);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 5. Sort & Draw Goalkeeper + 10 Field Defenders Back-to-Front
    if (state.gk) {
      drawDefender3D(state.gk, true);
    }
    const sortedDefs = [...state.defenders].sort((a, b) => b.z - a.z);
    sortedDefs.forEach((d) => drawDefender3D(d, false));

    // 6. Draw 3D Particles
    state.particles.forEach((p) => {
      const pt = project3D(p.x, p.y, p.z);
      if (!pt) return;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, Math.max(2, (p.size * pt.scale) / 35), 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 7. Draw First-Person Ball & Striker Boots
    drawFirstPersonBallAndFeet();

    // 8. Speed Lines & Ankle-Breaker Vignette when Boosting
    if (state.player.boostTimer > 0 || state.phase === 'shot_flight') {
      ctx.save();
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.35)';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 16; i++) {
        const ang = (i / 16) * Math.PI * 2 + state.elapsed * 3;
        const r1 = 210 + ((i * 37) % 60);
        const r2 = 460;
        ctx.beginPath();
        ctx.moveTo(W * 0.5 + Math.cos(ang) * r1, H * 0.45 + Math.sin(ang) * r1);
        ctx.lineTo(W * 0.5 + Math.cos(ang) * r2, H * 0.45 + Math.sin(ang) * r2);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 9. Top Broadcast HUD (11-Man Progress Bar & Score)
    drawHUD();

    ctx.restore();
  }

  function drawHUD() {
    const topY = SHORTS_MODE ? 132 : 20;

    // Broadcast Scoreboard Card
    ctx.save();
    ctx.fillStyle = 'rgba(6, 18, 14, 0.84)';
    ctx.strokeStyle = 'rgba(163, 230, 53, 0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(18, topY, W - 36, 94, 18);
    ctx.fill();
    ctx.stroke();

    // Left: "11人抜きカウンター"
    ctx.fillStyle = '#a3e635';
    ctx.font = '900 13px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`STAGE ${state.stage}｜11人抜きチャレンジ`, 34, topY + 24);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 32px sans-serif';
    ctx.fillText(`${state.passedCount}`, 34, topY + 58);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '900 18px sans-serif';
    ctx.fillText(`/ 11人突破`, 78, topY + 57);

    // Right: Score & Physical Shields
    ctx.textAlign = 'right';
    ctx.fillStyle = '#facc15';
    ctx.font = '900 22px sans-serif';
    ctx.fillText(`${state.score.toLocaleString()} PTS`, W - 34, topY + 34);

    const shieldStr = '⚡'.repeat(state.shields) + '・'.repeat(Math.max(0, 2 - state.shields));
    ctx.fillStyle = '#38bdf8';
    ctx.font = '800 13px sans-serif';
    ctx.fillText(`フィジカル耐性 ${shieldStr}`, W - 34, topY + 56);

    // 11-Player Progress Dots (1..10 Field Players + #11 GK)
    const barX = 34;
    const barW = W - 68;
    const dotY = topY + 77;
    for (let i = 0; i < 11; i++) {
      const dx = barX + (barW * i) / 10;
      const passed = i < state.passedCount;
      const current = i === state.passedCount;
      ctx.beginPath();
      ctx.arc(dx, dotY, current ? 8.5 : 6.5, 0, Math.PI * 2);
      if (passed) {
        ctx.fillStyle = i === 10 ? '#facc15' : '#a3e635';
      } else if (current) {
        ctx.fillStyle = '#22d3ee';
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
      }
      ctx.fill();
    }
    ctx.restore();

    // Dynamic Action Banner (Ankle Breaker / 11-Man Goal / Kick Off)
    if (state.bannerTimer > 0 && state.bannerText) {
      const bannerY = state.phase === 'goal' ? (SHORTS_MODE ? 500 : 185) : 525;
      const alpha = Math.min(1, state.bannerTimer * 3.5);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';

      ctx.font = '900 36px sans-serif';
      ctx.strokeStyle = '#020617';
      ctx.lineWidth = 8;
      ctx.strokeText(state.bannerText, W * 0.5, bannerY);
      ctx.fillStyle = state.bannerColor;
      ctx.fillText(state.bannerText, W * 0.5, bannerY);

      if (state.bannerSub) {
        ctx.font = '800 17px sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeText(state.bannerSub, W * 0.5, bannerY + 30);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(state.bannerSub, W * 0.5, bannerY + 30);
      }
      ctx.restore();
    }

    // Bottom Thumb Control Guide Bar (Clean & Intuitive)
    if (!SHORTS_MODE && (state.phase === 'dribble' || state.phase === 'shoot_zone')) {
      const guideY = H - 54;
      ctx.save();
      ctx.fillStyle = 'rgba(6, 18, 14, 0.72)';
      ctx.strokeStyle = 'rgba(34, 211, 238, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(70, guideY - 18, W - 140, 36, 999);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '800 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const label = state.phase === 'shoot_zone'
        ? '◀ 左右でコースを狙って指を離してシュート！ ▶'
        : '◀ 左右に指をスライドしてドリブル突破 ▶';
      ctx.fillText(label, W * 0.5, guideY);
      ctx.restore();
    }

    // Title Overlay
    if (!SHORTS_MODE && state.phase === 'title') {
      drawModalCard(
        'ELEVEN DRIBBLE',
        '一人称3D・11人抜きドリブルサッカー',
        [
          '⚽ 前進は自動！指を【左右にスライド】するだけ！',
          '🔥 ランダムに動くCPU 10人をかわしてゴール前へ！',
          '⚡ ギリギリで切り返すと【ANKLE BREAKER】加速！',
          '🥅 最後は11人目の守護神GKと1対1！コースを狙ってシュート！'
        ],
        'タップしてキックオフ！',
        '#a3e635'
      );
    }

    // Goal Celebration Overlay
    if (!SHORTS_MODE && state.phase === 'goal') {
      drawModalCard(
        '11人抜き GOAL!!',
        `STAGE ${state.stage} クリア！全員突破達成！`,
        [
          `🏆 スコア: ${state.score.toLocaleString()} PTS (自己ベスト: ${state.bestScore.toLocaleString()})`,
          `⚡ アンクルブレイカー突破: ${state.ankleBreakers}回`,
          `🛡️ 残りフィジカル耐性: ${state.shields} / 2`,
          `🔥 次は STAGE ${state.stage + 1}（CPUのフェイント速度UP！）`
        ],
        `タップで STAGE ${state.stage + 1} へ進む！`,
        '#facc15'
      );
    }

    // Game Over Overlay
    if (!SHORTS_MODE && state.phase === 'gameover') {
      drawModalCard(
        `${state.passedCount} / 11人抜き！`,
        state.passedCount >= 10 ? '惜しい！あとGK1人で11人抜き達成！' : '相手の動きを逆手に取って切り返そう！',
        [
          `⚽ 今回の記録: ${state.passedCount}人抜き`,
          `🏆 スコア: ${state.score.toLocaleString()} PTS (ベスト: ${state.bestScore.toLocaleString()})`,
          `💡 コツ: 相手の足元の矢印と逆方向へスッと切り返す！`
        ],
        'タップですぐリトライ！',
        '#fb7185'
      );
    }
  }

  function drawModalCard(title, subtitle, bullets, btnText, accentColor) {
    ctx.save();
    ctx.fillStyle = 'rgba(2, 8, 6, 0.72)';
    ctx.fillRect(0, 0, W, H);

    const cardW = W - 56;
    const cardH = 430;
    const cardX = 28;
    const cardY = (H - cardH) * 0.5;

    ctx.fillStyle = 'rgba(10, 25, 19, 0.96)';
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 24);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = accentColor;
    ctx.font = '900 38px sans-serif';
    ctx.fillText(title, W * 0.5, cardY + 62);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 16px sans-serif';
    ctx.fillText(subtitle, W * 0.5, cardY + 95);

    ctx.textAlign = 'left';
    ctx.font = '700 15px sans-serif';
    ctx.fillStyle = '#e2e8f0';
    bullets.forEach((b, idx) => {
      ctx.fillText(b, cardX + 28, cardY + 150 + idx * 42);
    });

    // CTA Button
    const btnW = cardW - 56;
    const btnH = 62;
    const btnX = cardX + 28;
    const btnY = cardY + cardH - 88;

    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 999);
    ctx.fill();

    ctx.fillStyle = '#020617';
    ctx.font = '900 21px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(btnText, W * 0.5, btnY + btnH * 0.5);
    ctx.restore();
  }

  // Deterministic step clock for headless Shorts recorder + smooth RAF for interactive play
  let lastTime = performance.now();
  function loop(now) {
    if (!window.__manualStep && !window.__SHORTS_MANUAL__) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(dt);
      render();
    }
    requestAnimationFrame(loop);
  }

  window.__stepFrame = function (dt = 1 / 60) {
    window.__manualStep = true;
    update(dt);
    render();
  };

  window.__SHORTS_STEP__ = function (dtMs = 16.6667) {
    window.__SHORTS_MANUAL__ = true;
    const evStart = window.__gameEvents.length;
    update(dtMs / 1000);
    render();
    const newEvents = window.__gameEvents.slice(evStart);
    return {
      events: newEvents,
      phase: state.phase,
      passedCount: state.passedCount,
      score: state.score,
    };
  };

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
