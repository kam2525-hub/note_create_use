    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #071410;
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', system-ui, -apple-system, sans-serif;

    position: relative;
    width: 100%;
    height: 100%;

    justify-content: center;

    background: radial-gradient(circle at 50% 25%, #123328 0%, #071410 70%, #030907 100%);

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 540px;
    max-height: 960px;
    aspect-ratio: 9 / 16;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(250, 204, 21, 0.22);
    cursor: pointer;
  }
  body.shorts-mode canvas {
    max-width: 100vw;
    max-height: 100vh;
    width: 100vw;
    height: 100vh;
    box-shadow: none;
  }
  .back-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 50;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(8, 24, 18, 0.86);
    border: 1px solid rgba(250, 204, 21, 0.42);
    color: #fef3c7;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    backdrop-filter: blur(6px);
  }
  body.shorts-mode .back-link {
    display: none;
  }
</style>
</head>

<script>
(() => {
  'use strict';

  const params = new URLSearchParams(window.location.search);
  const SHORTS_MODE = params.get('shorts') === '1';
  if (SHORTS_MODE) document.body.classList.add('shorts-mode');

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 540;
  const H = 960;
  const DPR = SHORTS_MODE ? 2 : Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  window.__gameEvents = [];
  function emitEvent(type, extra = {}) {
    window.__gameEvents.push({ type, t: +state.elapsed.toFixed(3), ...extra });
  }

  let rngSeed = SHORTS_MODE ? 20260505 : ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0);
  function rand() {
    rngSeed = (rngSeed * 1664525 + 1013904223) >>> 0;
    return rngSeed / 4294967296;
  }
  function randRange(a, b) { return a + (b - a) * rand(); }
  function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function easeOutCubic(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1, x = clamp(t, 0, 1);
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  const SAVE_KEY = 'dice_overdrive_v1';
  function loadSave() {
    try {
      const r = localStorage.getItem(SAVE_KEY);
      if (r) return JSON.parse(r);
    } catch (_) {}
    return { bestScore: 0, bestHand: 0, bestStage: 0, wins: 0 };
  }
  function writeSave(d) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (_) {}
  }
  const saveData = loadSave();

  function fmtNum(n) {
    const v = Math.round(n);
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e7) return (v / 1e6).toFixed(1) + 'M';
    return v.toLocaleString();
  }

  // =========================================================================
  // WEB AUDIO DOPAMINE SYNTHESIZER (Balatro-style escalating chime cascades!)
  // =========================================================================
  let audioCtx = null;
  let muted = false;
  function ensureAudio() {
    if (SHORTS_MODE || muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }

  function playTone(freq, dur, type = 'triangle', vol = 0.14, slideTo = null, delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(25, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  function playNoise(dur, vol = 0.1, freq = 1400, type = 'bandpass', delay = 0) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource();
    src.buffer = buf;
    const f = ac.createBiquadFilter();
    f.type = type; f.frequency.setValueAtTime(freq, t0);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  const PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51, 1567.98, 1760.0, 2093.0];

  const SFX = {
    roll() {
      for (let i = 0; i < 5; i++) {
        const d = i * 0.045;
        playNoise(0.04, 0.11, 1800 + i * 240, 'bandpass', d);
        playTone(220 + i * 55, 0.055, 'triangle', 0.09, 130, d);
      }
    },
    lock(locked) {
      playNoise(0.025, 0.08, 2800, 'bandpass');
      playTone(locked ? 680 : 420, 0.07, 'triangle', 0.11, locked ? 920 : 310);
    },
    chipPop(step) {
      const f = PENTATONIC[Math.min(step, PENTATONIC.length - 1)];
      playTone(f, 0.15, 'triangle', 0.14, f * 1.03);
      playTone(f * 2, 0.08, 'sine', 0.05);
    },
    multPop(step) {
      const f = PENTATONIC[Math.min(step + 2, PENTATONIC.length - 1)];
      playTone(f * 0.5, 0.18, 'sawtooth', 0.09, f * 0.75);
      playTone(f, 0.22, 'triangle', 0.16, f * 1.12);
      playNoise(0.05, 0.08, 2200, 'highpass');
    },
    retrigger() {
      playTone(880, 0.09, 'sine', 0.13, 1760);
      playTone(1320, 0.14, 'triangle', 0.11, 2200, 0.05);
    },
    slamTotal(big) {
      playTone(130, 0.26, 'sine', 0.26, 48);
      playNoise(0.11, 0.18, 900, 'lowpass');
      if (big) {
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((n, i) => {
          playTone(n, 0.34, 'triangle', 0.13, null, 0.04 + i * 0.055);
        });
      }
    },
    stageClear() {
      [523.25, 659.25, 783.99, 1046.5, 1567.98].forEach((n, i) => {
        playTone(n, 0.38, 'triangle', 0.15, null, i * 0.07);
      });
    },
    forge() {
      playTone(180, 0.22, 'sawtooth', 0.14, 90);
      playTone(1420, 0.45, 'sine', 0.14, 1380, 0.03);
      playTone(2130, 0.3, 'sine', 0.08, 2090, 0.05);
      playNoise(0.07, 0.16, 2600, 'bandpass');
    },
    buy() {
      playTone(880, 0.1, 'triangle', 0.13, 1318);
      playTone(1318, 0.18, 'sine', 0.12, 1760, 0.06);
    },
    fail() {
      playTone(230, 0.3, 'sawtooth', 0.13, 150);
      playTone(150, 0.45, 'sawtooth', 0.14, 92, 0.18);
    },
  };

  // =========================================================================

    { id: 'sstr',   name: 'スモールストレート', en: 'SMALL STRAIGHT', chips: 60,  mult: 5,  desc: '4連番' },
    { id: 'three',  name: 'スリーカード',     en: 'THREE OF A KIND',chips: 48,  mult: 4,  desc: '同じ目が3つ' },
    { id: 'twop',   name: 'ツーペア',         en: 'TWO PAIR',       chips: 36,  mult: 3,  desc: 'ペアが2組' },
    { id: 'pair',   name: 'ワンペア',         en: 'ONE PAIR',       chips: 22,  mult: 2,  desc: '同じ目が2つ' },
    { id: 'high',   name: 'ハイダイス',       en: 'HIGH DICE',      chips: 12,  mult: 1,  desc: '役なし（出目合計）' },

  const RELIC_DEFS = [

    { id: 'kind_fan', icon: '🔥', name: 'ゾロ目狂信',     cost: 5, color: '#fb7185', desc: 'スリーカード以上で倍率 ×2.2' },

    { id: 'alchem',   icon: '🧪', name: '特殊面錬金',     cost: 6, color: '#c084fc', desc: '改造面が発動するたび倍率 +5' },

    { id: 'last_stn', icon: '💀', name: '背水の陣',       cost: 5, color: '#f43f5e', desc: '残り1ハンド目の最終スコア ×3.0' },
    { id: 'even_mst', icon: '🎯', name: '偶数マスター',   cost: 4, color: '#60a5fa', desc: '偶数(2,4,6)が発動するたび +40点 & 倍率+2' },
    { id: 'odd_brsk', icon: '⚔️', name: '奇数バーサーカー', cost: 4, color: '#fb923c', desc: '奇数(1,3,5)が発動するたび +45点 & 倍率+2.5' },
    { id: 'clover',   icon: '🍀', name: '幸運の四葉',     cost: 7, color: '#4ade80', desc: 'フルハウス/ファイブで最終倍率 ×3.2' },
    { id: 'vault',    icon: '💰', name: '強欲の金庫',     cost: 5, color: '#fde047', desc: '所持コイン1Gにつきチップ +15' },
    { id: 'inf_loop', icon: '🔁', name: '無限ループ',     cost: 7, color: '#a78bfa', desc: 'リトリガー発生時、さらに倍率 ×1.7' },
  ];

  const STAGE_CONFIGS = [
    { stage: 1, target: 420,     reward: 5,  boss: null },
    { stage: 2, target: 1150,    reward: 6,  boss: null },
    { stage: 3, target: 3000,    reward: 8,  boss: { name: '🪨 封印の番人', desc: 'リロール回数 -1', type: 'less_reroll' } },
    { stage: 4, target: 8200,    reward: 8,  boss: null },
    { stage: 5, target: 23000,   reward: 9,  boss: null },
    { stage: 6, target: 65000,   reward: 11, boss: { name: '🧊 氷結の魔女', desc: '1投目の右端ダイスが強制固定', type: 'freeze_right' } },
    { stage: 7, target: 185000,  reward: 12, boss: null },

  ];

  function getStageInfo(stageNum) {
    if (stageNum <= STAGE_CONFIGS.length) return STAGE_CONFIGS[stageNum - 1];
    // Endless Overdrive scaling!
    const extra = stageNum - STAGE_CONFIGS.length;
    const target = Math.round(500000 * Math.pow(3.1, extra) / 10000) * 10000;
    return {
      stage: stageNum,
      target,
      reward: 14 + extra * 2,
      boss: extra % 2 === 0 ? { name: `♾️ 虚無の支配者 Lv.${extra}`, desc: 'エンドレス限界突破！', type: 'final' } : null,
    };
  }

  // =========================================================================
  // POKER DICE HAND EVALUATOR (Handles Wild & Mirror faces intelligently!)
  // =========================================================================
  function resolveEffectiveValues(diceList) {
    // First pass: resolve Mirror (copies left neighbor, or die 1 if index 0)
    const vals = diceList.map(d => d.currentFace.val);
    const mods = diceList.map(d => d.currentFace.mod);
    for (let i = 0; i < 5; i++) {
      if (mods[i] === 'mirror') {
        const srcIdx = i > 0 ? i - 1 : 1;
        vals[i] = vals[srcIdx];
      }
    }
    // Second pass: resolve Wild(s) by brute-forcing 1..6 for max hand rank + pip sum!
    const wildIndices = [];
    for (let i = 0; i < 5; i++) if (mods[i] === 'wild') wildIndices.push(i);
    if (wildIndices.length === 0) {
      const ev = evalRawHand(vals);
      return { effectiveVals: vals, hand: ev.hand, scoringMask: ev.scoringMask };
    }

    let bestScoreKey = -1;
    let bestVals = vals.slice();
    let bestEval = null;

    function searchWild(k, arr) {
      if (k === wildIndices.length) {
        const ev = evalRawHand(arr);
        const rankIdx = HANDS.findIndex(h => h.id === ev.hand.id);
        const sum = arr.reduce((a, b) => a + b, 0);
        const key = (10 - rankIdx) * 1000 + sum;
        if (key > bestScoreKey) {
          bestScoreKey = key;
          bestVals = arr.slice();
          bestEval = ev;
        }
        return;
      }
      const idx = wildIndices[k];
      for (let v = 6; v >= 1; v--) {
        arr[idx] = v;
        searchWild(k + 1, arr);
      }
    }
    searchWild(0, vals.slice());
    return { effectiveVals: bestVals, hand: bestEval.hand, scoringMask: bestEval.scoringMask };
  }

  function evalRawHand(vals) {
    const counts = {};
    vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
    const entries = Object.entries(counts).map(([v, c]) => ({ v: +v, c })).sort((a, b) => b.c - a.c || b.v - a.v);
    const uniq = Array.from(new Set(vals)).sort((a, b) => a - b);

    const isLargeStr = uniq.length === 5 && (uniq[4] - uniq[0] === 4);
    let smallStrVals = null;
    if (!isLargeStr) {
      for (const seq of [[1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6]]) {
        if (seq.every(x => uniq.includes(x))) smallStrVals = seq;
      }
    }

    const maskBySet = (pred) => vals.map((v, i) => pred(v, i));

    if (entries[0].c === 5) return { hand: HANDS[0], scoringMask: [true, true, true, true, true] };
    if (isLargeStr) return { hand: HANDS[1], scoringMask: [true, true, true, true, true] };
    if (entries[0].c === 4) return { hand: HANDS[2], scoringMask: maskBySet(v => v === entries[0].v) };
    if (entries[0].c === 3 && entries[1] && entries[1].c === 2) return { hand: HANDS[3], scoringMask: [true, true, true, true, true] };
    if (smallStrVals) {
      const used = new Set();
      const mask = vals.map(v => {
        if (smallStrVals.includes(v) && !used.has(v)) { used.add(v); return true; }
        return false;
      });
      return { hand: HANDS[4], scoringMask: mask };
    }
    if (entries[0].c === 3) return { hand: HANDS[5], scoringMask: maskBySet(v => v === entries[0].v) };
    if (entries[0].c === 2 && entries[1] && entries[1].c === 2) {
      return { hand: HANDS[6], scoringMask: maskBySet(v => v === entries[0].v || v === entries[1].v) };
    }
    if (entries[0].c === 2) return { hand: HANDS[7], scoringMask: maskBySet(v => v === entries[0].v) };
    // High dice: highest single die scores (plus any modded die always scores!)
    const maxV = Math.max(...vals);
    let picked = false;
    const mask = vals.map(v => { if (!picked && v === maxV) { picked = true; return true; } return false; });
    return { hand: HANDS[8], scoringMask: mask };
  }

  // =========================================================================
  // GAME STATE
  // =========================================================================
  function makeStandardDie(idx) {
    const faces = [1, 2, 3, 4, 5, 6].map(v => ({ val: v, mod: 'normal' }));
    return {
      idx,
      faces,
      currentFace: faces[0],
      locked: false,
      frozen: false,
      rollTimer: 0,
      spinAngle: 0,
      jumpY: 0,
      scalePop: 1,
      glowColor: null,
      glowAlpha: 0,
      effectiveVal: 1,
    };
  }

  const state = {
    screen: 'title', // 'title' | 'play' | 'shop' | 'victory' | 'gameover'
    elapsed: 0,
    speedMult: 1, // 1 or 2

    // Run progress
    stage: 1,

    // Live scoring / cascade state

    shopRelics: [], // 2 relic items { def, cost, sold }
    pendingMod: null, // when user buys a face mod & taps a die to forge it!

  function hasRelic(id) { return state.relics.some(r => r.id === id); }
  function relicIndex(id) { return state.relics.findIndex(r => r.id === id); }

  function spawnParticles(x, y, count, colors, speed = 280, gravity = 440) {
    for (let i = 0; i < count; i++) {
      const a = randRange(0, Math.PI * 2);
      const sp = randRange(speed * 0.35, speed);
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - randRange(50, 160),
        size: randRange(3.5, 8.5),
        color: colors[Math.floor(rand() * colors.length)],
        rot: randRange(0, Math.PI * 2),
        vrot: randRange(-10, 10),
        life: randRange(0.45, 1.15),
        maxLife: 1.15,
        gravity,
        shape: rand() > 0.35 ? 'rect' : 'circle',
      });
    }
  }

  function addFloat(x, y, text, color = '#fde047', size = 22) {
    state.floatingTexts.push({ x, y, text, color, size, life: 1.05, maxLife: 1.05 });
  }

  // =========================================================================
  // RUN FLOW & ROLLING
  // =========================================================================
  function startNewRun() {
    ensureAudio();
    state.screen = 'play';
    state.stage = 1;
    state.gold = 4;
    state.totalRunScore = 0;
    state.bestHandThisRun = 0;
    state.dice = [0, 1, 2, 3, 4].map(makeStandardDie);
    // Give the player 1 starter Gold Face (×3 on die #1's 6!) right from Stage 1 so the core fun hits IMMEDIATELY!
    state.dice[0].faces[5].mod = 'gold';
    state.relics = [];
    state.relicBounce = [0, 0, 0, 0, 0];
    state.particles = [];
    state.floatingTexts = [];
    state.showHandsModal = false;
    state.pendingMod = null;
    beginStage(1);
  }

  function beginStage(stageNum) {
    const info = getStageInfo(stageNum);
    state.screen = 'play';
    state.stage = stageNum;
    state.stageTarget = info.target;
    state.boss = info.boss;
    state.stageScore = 0;
    state.displayStageScore = 0;
    state.maxHands = 3;
    state.handsLeft = state.maxHands;
    state.maxRerolls = 2 + (hasRelic('magnet') ? 2 : 0) - (info.boss && info.boss.type === 'less_reroll' ? 1 : 0);
    state.maxRerolls = Math.max(1, state.maxRerolls);
    state.rerollsLeft = state.maxRerolls;
    state.curChips = 0;
    state.curMult = 1;
    state.curTotal = 0;
    state.phase = 'roll';
    state.dice.forEach(d => { d.locked = false; d.frozen = false; });
    triggerRoll(true);
  }

  function triggerRoll(isInitial = false) {
    if (!isInitial && (state.phase !== 'roll' || state.rerollsLeft <= 0)) return;
    if (!isInitial) state.rerollsLeft--;
    state.phase = 'rolling';
    SFX.roll();
    emitEvent('roll', { isInitial });

    state.dice.forEach((d, idx) => {
      if (d.locked && !isInitial) return;
      d.rollTimer = 0.28 + idx * 0.055;
      d.spinAngle = randRange(-0.8, 0.8);
      d.currentFace = d.faces[randInt(0, 5)];
    });

    // Boss Stage 6 rule: freeze rightmost die on initial roll
    if (isInitial && state.boss && state.boss.type === 'freeze_right') {
      state.dice[4].locked = true;
      state.dice[4].frozen = true;
    }
  }

  function refreshLiveEval() {
    const ev = resolveEffectiveValues(state.dice);
    state.liveEval = ev;
    state.dice.forEach((d, i) => { d.effectiveVal = ev.effectiveVals[i]; });
    state.curChips = ev.hand.chips;
    state.curMult = ev.hand.mult;
    state.curTotal = 0;
  }

  // =========================================================================
  // DOMINO SCORE CASCADE BUILDER (The Pure Dopamine Core!)
  // =========================================================================
  function startScoreCascade() {
    if (state.phase !== 'roll') return;
    ensureAudio();
    state.phase = 'cascading';
    state.handsLeft--;
    const ev = resolveEffectiveValues(state.dice);
    state.liveEval = ev;
    state.dice.forEach((d, i) => { d.effectiveVal = ev.effectiveVals[i]; });

    state.curChips = ev.hand.chips;
    state.curMult = ev.hand.mult;
    state.curTotal = 0;
    state.cascadeStepCount = 0;
    state.cascadeQueue = [];

    emitEvent('score_start', { hand: ev.hand.id, name: ev.hand.name });

    // Step 0: Announce Hand Base
    state.cascadeQueue.push({
      delay: 0.24,
      run() {
        SFX.chipPop(0);
        state.shake = 5;
        addFloat(W / 2, 345, `${ev.hand.name}!!`, '#fde047', 26);
      }
    });

    // Vault Relic (Gold -> Chips)
    if (hasRelic('vault') && state.gold > 0) {
      const rIdx = relicIndex('vault');
      const bonus = state.gold * 15;
      state.cascadeQueue.push({
        delay: 0.22,
        run() {
          state.curChips += bonus;
          state.relicBounce[rIdx] = 1;
          SFX.chipPop(state.cascadeStepCount++);
          addFloat(getRelicPos(rIdx).x, 224, `+${bonus}`, '#60a5fa', 20);
        }
      });
    }

    // Straight King Relic
    if (hasRelic('str_king') && (ev.hand.id === 'lstr' || ev.hand.id === 'sstr')) {
      const rIdx = relicIndex('str_king');
      state.cascadeQueue.push({
        delay: 0.24,
        run() {
          state.curChips += 180;
          state.curMult = +(state.curMult * 2.5).toFixed(1);
          state.relicBounce[rIdx] = 1;
          state.shake = 7;
          SFX.multPop(state.cascadeStepCount++);
          addFloat(getRelicPos(rIdx).x, 224, '+180 & ×2.5!', '#22d3ee', 21);
        }
      });
    }

    // Kind Fanatic Relic
    if (hasRelic('kind_fan') && ['three', 'full', 'four', 'five'].includes(ev.hand.id)) {
      const rIdx = relicIndex('kind_fan');
      state.cascadeQueue.push({
        delay: 0.24,
        run() {
          state.curMult = +(state.curMult * 2.2).toFixed(1);
          state.relicBounce[rIdx] = 1;
          state.shake = 7;
          SFX.multPop(state.cascadeStepCount++);
          addFloat(getRelicPos(rIdx).x, 224, '×2.2!!', '#fb7185', 22);
        }
      });
    }

    // Queue each die left-to-right (scoring dice OR any modded die always triggers!)
    for (let i = 0; i < 5; i++) {
      const die = state.dice[i];
      const isScoring = ev.scoringMask[i] || die.currentFace.mod !== 'normal';
      if (!isScoring) continue;

      let triggers = 1;
      if (die.currentFace.mod === 'echo') triggers++;
      if (i === 0 && hasRelic('first2')) triggers++;

      for (let t = 0; t < triggers; t++) {
        const isRetrigger = t > 0;
        const val = ev.effectiveVals[i];
        const mod = die.currentFace.mod;

        state.cascadeQueue.push({
          delay: 0.25,
          run() {
            const pos = getDiePos(i);
            die.jumpY = -24;
            die.scalePop = 1.24;
            die.glowAlpha = 1;
            die.glowColor = FACE_MODS[mod].color;

            if (isRetrigger) {
              SFX.retrigger();
              addFloat(pos.x, pos.y - 68, '⚡リトリガー!!', '#38bdf8', 18);
              if (i === 0 && hasRelic('first2')) state.relicBounce[relicIndex('first2')] = 1;
              if (hasRelic('inf_loop')) {
                const ri = relicIndex('inf_loop');
                state.curMult = +(state.curMult * 1.7).toFixed(1);
                state.relicBounce[ri] = 1;
                addFloat(getRelicPos(ri).x, 224, '×1.7!!', '#c084fc', 21);
              }
            }

            // Base die chips
            const baseAdd = val * 12;
            state.curChips += baseAdd;
            SFX.chipPop(state.cascadeStepCount++);
            addFloat(pos.x, pos.y - 44, `+${baseAdd}`, '#60a5fa', 21);
            spawnParticles(pos.x, pos.y, 8, ['#60a5fa', '#ffffff', FACE_MODS[mod].color], 150, 260);

            // Face Mod Effect!
            if (mod === 'gold') {
              state.curMult = +(state.curMult * 3).toFixed(1);
              state.shake = Math.max(state.shake, 9);
              SFX.multPop(state.cascadeStepCount);
              addFloat(pos.x, pos.y - 76, '✨ ×3.0!!', '#fde047', 25);
              spawnParticles(pos.x, pos.y, 18, ['#fde047', '#f59e0b', '#ffffff'], 240, 280);
              emitEvent('mult_hit', { mult: state.curMult });
            } else if (mod === 'gem') {
              state.curChips += 90;
              addFloat(pos.x, pos.y - 74, '💎 +90!!', '#34d399', 23);
            } else if (mod === 'boom') {
              state.curChips += 50;
              state.curMult = +(state.curMult + 4).toFixed(1);
              state.shake = Math.max(state.shake, 8);
              SFX.multPop(state.cascadeStepCount);
              addFloat(pos.x, pos.y - 74, '💥 +50 & +4倍!', '#fb923c', 21);
              spawnParticles(pos.x, pos.y, 16, ['#fb923c', '#fde047', '#ef4444'], 230, 300);
            } else if (mod === 'mirror') {
              state.curMult = +(state.curMult * 2).toFixed(1);
              state.shake = Math.max(state.shake, 7);
              SFX.multPop(state.cascadeStepCount);
              addFloat(pos.x, pos.y - 74, '🪞 ×2.0!!', '#e2e8f0', 24);
            } else if (mod === 'wild') {
              state.curMult = +(state.curMult + 3).toFixed(1);
              addFloat(pos.x, pos.y - 74, '🃏 +3倍!', '#c084fc', 22);
            }

            // Relic Per-Die Triggers
            if (mod !== 'normal' && hasRelic('alchem')) {
              const ri = relicIndex('alchem');
              state.curMult = +(state.curMult + 5).toFixed(1);
              state.relicBounce[ri] = 1;
              addFloat(getRelicPos(ri).x, 224, '+5倍!', '#c084fc', 19);
            }
            if (val === 6 && hasRelic('king6')) {
              const ri = relicIndex('king6');
              state.curMult = +(state.curMult * 1.8).toFixed(1);
              state.relicBounce[ri] = 1;
              state.shake = Math.max(state.shake, 8);
              SFX.multPop(state.cascadeStepCount);
              addFloat(getRelicPos(ri).x, 224, '👑 ×1.8!!', '#fde047', 22);
            }
            if (val % 2 === 0 && hasRelic('even_mst')) {
              const ri = relicIndex('even_mst');
              state.curChips += 40;
              state.curMult = +(state.curMult + 2).toFixed(1);
              state.relicBounce[ri] = 1;
              addFloat(getRelicPos(ri).x, 224, '+40 / +2倍', '#60a5fa', 17);
            }
            if (val % 2 === 1 && hasRelic('odd_brsk')) {
              const ri = relicIndex('odd_brsk');
              state.curChips += 45;
              state.curMult = +(state.curMult + 2.5).toFixed(1);
              state.relicBounce[ri] = 1;
              addFloat(getRelicPos(ri).x, 224, '+45 / +2.5倍', '#fb923c', 17);
            }
          }
        });
      }
    }

    // End-of-Hand Multiplicative Relics
    if (hasRelic('clover') && (ev.hand.id === 'full' || ev.hand.id === 'five')) {
      const ri = relicIndex('clover');
      state.cascadeQueue.push({
        delay: 0.28,
        run() {
          state.curMult = +(state.curMult * 3.2).toFixed(1);
          state.relicBounce[ri] = 1;
          state.shake = 12;
          SFX.multPop(10);
          addFloat(getRelicPos(ri).x, 224, '🍀 ×3.2!!', '#4ade80', 25);
        }
      });
    }
    if (hasRelic('last_stn') && state.handsLeft === 0) {
      const ri = relicIndex('last_stn');
      state.cascadeQueue.push({
        delay: 0.28,
        run() {
          state.curMult = +(state.curMult * 3.0).toFixed(1);
          state.relicBounce[ri] = 1;
          state.shake = 13;
          SFX.multPop(10);
          addFloat(getRelicPos(ri).x, 224, '💀 背水 ×3.0!!', '#f43f5e', 25);
        }
      });
    }

    // Final Slam: CHIPS × MULT -> STAGE SCORE!!
    state.cascadeQueue.push({
      delay: 0.34,
      run() {
        const total = Math.round(state.curChips * state.curMult);
        state.curTotal = total;
        state.stageScore += total;
        state.totalRunScore += total;
        state.bestHandThisRun = Math.max(state.bestHandThisRun, total);
        if (total > saveData.bestHand) { saveData.bestHand = total; writeSave(saveData); }
        if (state.totalRunScore > saveData.bestScore) { saveData.bestScore = state.totalRunScore; writeSave(saveData); }

        const big = total >= state.stageTarget * 0.6;
        SFX.slamTotal(big);
        state.shake = big ? 18 : 10;
        state.flashColor = big ? '#fde047' : '#38bdf8';
        state.flashAlpha = big ? 0.28 : 0.14;
        spawnParticles(W / 2, 415, big ? 56 : 24, ['#fde047', '#f59e0b', '#fb7185', '#38bdf8', '#ffffff'], 340, 380);
        addFloat(W / 2, 365, `+${fmtNum(total)}!!`, '#fde047', big ? 36 : 28);
        emitEvent('score_slam', { total, cleared: state.stageScore >= state.stageTarget });
      }
    });

    // Post-slam resolution
    state.cascadeQueue.push({
      delay: 0.85,
      run() {
        if (state.stageScore >= state.stageTarget) {
          // STAGE CLEARED!!
          state.phase = 'stage_clear';
          state.stageClearTimer = 0;
          if (state.stage > saveData.bestStage) { saveData.bestStage = state.stage; writeSave(saveData); }
          const info = getStageInfo(state.stage);
          const bonusGold = state.handsLeft * 3;
          state.gold += info.reward + bonusGold;
          SFX.stageClear();
          state.shake = 14;
          state.flashColor = '#4ade80';
          state.flashAlpha = 0.25;
          spawnParticles(W / 2, 145, 70, ['#fde047', '#4ade80', '#38bdf8', '#ffffff'], 360, 360);
          emitEvent('stage_clear', { stage: state.stage, reward: info.reward + bonusGold });
        } else if (state.handsLeft <= 0) {
          // GAME OVER
          SFX.fail();
          state.screen = 'gameover';
          emitEvent('gameover');
        } else {
          // Next Hand!
          state.rerollsLeft = state.maxRerolls;
          state.dice.forEach(d => { d.locked = false; d.frozen = false; });
          triggerRoll(true);
        }
      }
    });

    state.cascadeTimer = 0.08;
  }

  // =========================================================================
  // FORGE SHOP GENERATOR & ACTIONS
  // =========================================================================
  function openShop() {
    if (state.stage === 8 && !state.endlessStarted) {
      saveData.wins++;
      writeSave(saveData);
      state.screen = 'victory';
      return;
    }
    state.screen = 'shop';
    state.pendingMod = null;
    state.shopRerollCost = 2;
    rollShopInventory();
  }

  function rollShopInventory() {
    // 3 Face Mod Upgrades (with high pip values 4, 5, 6 so upgrades feel AWESOME!)
    const pool = SHOP_MOD_POOL.slice();
    state.shopMods = [];
    for (let i = 0; i < 3; i++) {
      const idx = Math.floor(rand() * pool.length);
      const modId = pool.splice(idx, 1)[0];
      const def = FACE_MODS[modId];
      const val = modId === 'wild' ? 6 : randInt(4, 6);
      state.shopMods.push({ modId, val, cost: def.cost, sold: false });
    }

    // 2 Unowned Relics
    const unowned = RELIC_DEFS.filter(r => !hasRelic(r.id));
    state.shopRelics = [];
    for (let i = 0; i < 2 && unowned.length > 0; i++) {
      const idx = Math.floor(rand() * unowned.length);
      const def = unowned.splice(idx, 1)[0];
      state.shopRelics.push({ def, cost: def.cost, sold: false });
    }
  }

  function buyShopMod(item) {
    if (item.sold || state.gold < item.cost) return;
    state.pendingMod = item;
    SFX.lock(true);
  }

  function applyPendingModToDie(dieIdx) {
    if (!state.pendingMod) return;
    const item = state.pendingMod;
    const die = state.dice[dieIdx];
    // Prefer replacing a normal face (starting from lowest value 1,2,3...) so player strictly upgrades!
    let targetFace = die.faces.find(f => f.mod === 'normal');
    if (!targetFace) targetFace = die.faces[0];
    targetFace.mod = item.modId;
    targetFace.val = item.val;
    die.currentFace = targetFace;
    die.scalePop = 1.32;
    die.glowColor = FACE_MODS[item.modId].color;
    die.glowAlpha = 1;

    state.gold -= item.cost;
    item.sold = true;
    state.pendingMod = null;
    SFX.forge();
    state.shake = 10;
    const pos = getShopDiePos(dieIdx);
    spawnParticles(pos.x, pos.y, 28, [FACE_MODS[item.modId].color, '#fde047', '#ffffff'], 240, 280);
    addFloat(pos.x, pos.y - 42, `${FACE_MODS[item.modId].icon} 改造完了!!`, '#fde047', 21);
  }

  function buyShopRelic(item) {
    if (item.sold || state.gold < item.cost || state.relics.length >= 5) return;
    state.gold -= item.cost;
    item.sold = true;
    state.relics.push(item.def);
    state.relicBounce[state.relics.length - 1] = 1;
    SFX.buy();
    spawnParticles(W / 2, 200, 24, [item.def.color, '#fde047', '#ffffff'], 220, 240);
    addFloat(W / 2, 230, `${item.def.icon} ${item.def.name} 装備！`, item.def.color, 21);
  }

  // =========================================================================
  // SHORTS AUTO-CHOREOGRAPHY (18.0s Insane Multiplier Explosion!)
  // =========================================================================
  let shortsStage = 0;
  function updateShortsChoreography(dt) {
    const t = state.elapsed;
    if (shortsStage === 0) {
      shortsStage = 1;
      state.screen = 'play';
      state.stage = 8;
      state.stageTarget = 500000;
      state.stageScore = 42000;
      state.displayStageScore = 42000;
      state.boss = STAGE_CONFIGS[7].boss;
      state.handsLeft = 1; // Triggers Back-Against-the-Wall ×3!
      state.maxHands = 3;
      state.rerollsLeft = 2;
      state.gold = 18;
      state.dice = [0, 1, 2, 3, 4].map(makeStandardDie);
      // Overpowered forged build!
      state.dice[0].faces[5] = { val: 6, mod: 'gold' };
      state.dice[1].faces[5] = { val: 6, mod: 'echo' };
      state.dice[2].faces[5] = { val: 6, mod: 'mirror' };
      state.dice[3].faces[5] = { val: 6, mod: 'gold' };
      state.dice[4].faces[5] = { val: 6, mod: 'wild' };
      state.relics = [
        RELIC_DEFS.find(r => r.id === 'king6'),
        RELIC_DEFS.find(r => r.id === 'first2'),
        RELIC_DEFS.find(r => r.id === 'clover'),
        RELIC_DEFS.find(r => r.id === 'inf_loop'),
        RELIC_DEFS.find(r => r.id === 'last_stn'),
      ];
      // Start with 4 sixes locked & 1 die waiting to reroll into Wild!
      state.dice[0].currentFace = state.dice[0].faces[5]; state.dice[0].locked = true;
      state.dice[1].currentFace = state.dice[1].faces[5]; state.dice[1].locked = true;
      state.dice[2].currentFace = state.dice[2].faces[5]; state.dice[2].locked = true;
      state.dice[3].currentFace = state.dice[3].faces[5]; state.dice[3].locked = true;
      state.dice[4].currentFace = state.dice[4].faces[2]; state.dice[4].locked = false;
      state.phase = 'roll';
      refreshLiveEval();
    }
    // 1.1s: Roll last die -> lands WILD ★ -> FIVE OF A KIND!!
    if (t >= 1.1 && shortsStage === 1) {
      shortsStage = 2;
      state.rerollsLeft--;
      state.phase = 'rolling';
      state.dice[4].rollTimer = 0.45;
      state.dice[4].currentFace = state.dice[4].faces[5];
      emitEvent('shorts_roll');
    }
    // 2.3s: Smash SCORE button -> MASSIVE CASCADE!
    if (t >= 2.3 && shortsStage === 2 && state.phase === 'roll') {
      shortsStage = 3;
      state.speedMult = 0.72; // Slightly savor every ×3 & ×1.8 hit for viewers!
      startScoreCascade();
    }
  }

  // =========================================================================
  // UPDATE LOOP
  // =========================================================================
  function update(dt) {
    state.elapsed += dt;
    if (SHORTS_MODE) updateShortsChoreography(dt);

    state.titleTime += dt;
    state.displayStageScore += (state.stageScore - state.displayStageScore) * Math.min(1, dt * 8);
    state.shake = Math.max(0, state.shake - dt * 44);
    state.flashAlpha = Math.max(0, state.flashAlpha - dt * 1.9);
    if (state.tooltipTimer > 0) {
      state.tooltipTimer -= dt;
      if (state.tooltipTimer <= 0) state.tooltipRelic = null;
    }

    for (let i = 0; i < 5; i++) {
      state.relicBounce[i] = Math.max(0, state.relicBounce[i] - dt * 3.8);
      const d = state.dice[i];
      d.jumpY += (0 - d.jumpY) * Math.min(1, dt * 14);
      d.scalePop += (1 - d.scalePop) * Math.min(1, dt * 12);
      d.glowAlpha = Math.max(0, d.glowAlpha - dt * 2.2);
    }

    // Particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      if (p.life <= 0) { state.particles.splice(i, 1); continue; }
      p.vy += p.gravity * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
    }
    // Floats
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
      const f = state.floatingTexts[i];
      f.life -= dt;
      if (f.life <= 0) { state.floatingTexts.splice(i, 1); continue; }
      f.y -= 42 * dt;
    }

    if (state.screen !== 'play') return;

    if (state.phase === 'rolling') {
      let anyRolling = false;
      state.dice.forEach(d => {
        if (d.rollTimer > 0) {
          anyRolling = true;
          d.rollTimer = Math.max(0, d.rollTimer - dt);
          d.spinAngle = Math.sin(d.rollTimer * 36) * 0.45;
          if (d.rollTimer === 0) {
            d.spinAngle = 0;
            d.scalePop = 1.18;
          }
        }
      });
      if (!anyRolling) {
        state.phase = 'roll';
        refreshLiveEval();
      }
    } else if (state.phase === 'cascading') {
      if (state.cascadeQueue.length > 0) {
        state.cascadeTimer -= dt * state.speedMult;
        if (state.cascadeTimer <= 0) {
          const step = state.cascadeQueue.shift();
          step.run();
          state.cascadeTimer = state.cascadeQueue.length > 0 ? state.cascadeQueue[0].delay : 0;
        }
      }
    } else if (state.phase === 'stage_clear') {
      state.stageClearTimer += dt;
    }
  }

  // =========================================================================
  // COORDINATE HELPERS & HITBOXES
  // =========================================================================
  function getRelicPos(i) {
    const gap = 10, w = 88;
    const totalW = 5 * w + 4 * gap;
    const startX = (W - totalW) / 2;
    return { x: startX + i * (w + gap) + w / 2, y: 204, w, h: 68 };
  }

  function getDiePos(i) {
    const gap = 12, size = 88;
    const totalW = 5 * size + 4 * gap;
    const startX = (W - totalW) / 2;
    return { x: startX + i * (size + gap) + size / 2, y: 632, size };
  }

  function getShopDiePos(i) {
    const gap = 12, size = 84;
    const totalW = 5 * size + 4 * gap;
    const startX = (W - totalW) / 2;
    return { x: startX + i * (size + gap) + size / 2, y: 726, size };
  }

  let hitboxes = [];
  function addHit(id, x, y, w, h, fn) { hitboxes.push({ id, x, y, w, h, fn }); }

  function getCanvasPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (SHORTS_MODE) return;
    ensureAudio();
    const p = getCanvasPos(e);
    for (let i = hitboxes.length - 1; i >= 0; i--) {
      const h = hitboxes[i];
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) {
        h.fn();
        return;
      }
    }
  });

  // =========================================================================
  // RENDERING PRIMITIVES (Ultra-Crisp Geometric Tabletop!)
  // =========================================================================
  function rr(g, x, y, w, h, r) {
    const rad = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + rad, y);
    g.arcTo(x + w, y, x + w, y + h, rad);
    g.arcTo(x + w, y + h, x, y + h, rad);
    g.arcTo(x, y + h, x, y, rad);
    g.arcTo(x, y, x + w, y, rad);
    g.closePath();
  }

  function drawFeltTable() {
    const bg = ctx.createRadialGradient(W / 2, 340, 40, W / 2, 460, 620);
    bg.addColorStop(0, '#133a2c');
    bg.addColorStop(0.65, '#0b221a');
    bg.addColorStop(1, '#06120e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Subtle geometric casino diamond lattice
    ctx.strokeStyle = 'rgba(250, 204, 21, 0.04)';
    ctx.lineWidth = 1;
    const step = 44;
    for (let x = -H; x < W + H; x += step) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H, H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + H, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  }

  function drawDie(cx, cy, size, face, opts = {}) {
    const modDef = FACE_MODS[face.mod] || FACE_MODS.normal;
    const displayVal = opts.rolling ? ((Math.floor(state.elapsed * 32 + cx) % 6) + 1) : (opts.effectiveVal || face.val);
    const rot = opts.rot || 0;
    const scale = opts.scale || 1;
    const locked = !!opts.locked;
    const frozen = !!opts.frozen;

    ctx.save();
    ctx.translate(cx, cy + (locked ? -12 : 0) + (opts.jumpY || 0));
    ctx.rotate(rot);
    ctx.scale(scale, scale);

    // Glow aura on special trigger or highlight
    if (opts.glowAlpha > 0.02 || opts.highlight) {
      ctx.shadowColor = opts.glowColor || modDef.color;
      ctx.shadowBlur = opts.highlight ? 20 : 26 * opts.glowAlpha;
    } else {
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 14;
      ctx.shadowOffsetY = 7;
    }

    // 3D beveled die body
    const half = size / 2;
    const bodyGrad = ctx.createLinearGradient(-half, -half, half, half);
    if (face.mod === 'normal') {
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.6, '#f6efe0');
      bodyGrad.addColorStop(1, '#ddd0b6');
    } else {
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.25, modDef.color);
      bodyGrad.addColorStop(1, modDef.border);
    }
    ctx.fillStyle = bodyGrad;
    rr(ctx, -half, -half, size, size, 18);
    ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

    // Inner bevel shine
    ctx.strokeStyle = locked ? '#fde047' : (frozen ? '#38bdf8' : 'rgba(255,255,255,0.65)');
    ctx.lineWidth = locked || frozen ? 4 : 2;
    rr(ctx, -half + 1.5, -half + 1.5, size - 3, size - 3, 16);
    ctx.stroke();

    // Pips or Wild Star
    if (face.mod === 'wild' && opts.showWildSymbol) {
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${Math.round(size * 0.48)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('★', 0, 2);
    } else {
      const pOff = size * 0.255;
      const pRad = displayVal === 1 ? size * 0.125 : size * 0.088;
      const coords = {
        1: [[0, 0]],
        2: [[-pOff, -pOff], [pOff, pOff]],
        3: [[-pOff, -pOff], [0, 0], [pOff, pOff]],
        4: [[-pOff, -pOff], [pOff, -pOff], [-pOff, pOff], [pOff, pOff]],
        5: [[-pOff, -pOff], [pOff, -pOff], [0, 0], [-pOff, pOff], [pOff, pOff]],
        6: [[-pOff, -pOff], [pOff, -pOff], [-pOff, 0], [pOff, 0], [-pOff, pOff], [pOff, pOff]],
      }[displayVal] || [[0, 0]];

      coords.forEach(([px, py]) => {
        ctx.fillStyle = (displayVal === 1 && face.mod === 'normal') ? '#dc2626' : modDef.pip;
        ctx.beginPath();
        ctx.arc(px, py, pRad, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Special Mod Corner Badge (Crisp & Instant Read!)
    if (face.mod !== 'normal' && modDef.badge) {
      ctx.fillStyle = 'rgba(10, 14, 22, 0.9)';
      rr(ctx, -half + 4, -half + 4, 42, 20, 7);
      ctx.fill();
      ctx.fillStyle = modDef.color;
      ctx.font = '900 11px "Chakra Petch", "Noto Sans JP", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(modDef.badge, -half + 25, -half + 14.5);
    }

    // Lock / Freeze Tag
    if (locked || frozen) {
      ctx.fillStyle = frozen ? '#0284c7' : '#facc15';
      rr(ctx, -28, half - 10, 56, 20, 8);
      ctx.fill();
      ctx.fillStyle = frozen ? '#ffffff' : '#1c1205';
      ctx.font = '900 11px "Chakra Petch", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(frozen ? '🧊 ICE' : '🔒 LOCK', 0, half);
    }
    ctx.restore();
  }

  function drawMiniFaceStrip(cx, cy, die) {
    // 6 crisp mini-squares beneath each die showing all 6 faces (normal vs modded)!
    const sw = 12, gap = 3;
    const total = 6 * sw + 5 * gap;
    const sx = cx - total / 2;
    die.faces.forEach((f, idx) => {
      const fx = sx + idx * (sw + gap);
      const md = FACE_MODS[f.mod];
      ctx.fillStyle = f.mod === 'normal' ? 'rgba(255,255,255,0.22)' : md.color;
      rr(ctx, fx, cy, sw, sw, 3);
      ctx.fill();
      if (f === die.currentFace) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    });
  }

  function wrapCenter(c, text, cx, y, maxW, lh) {
    let line = '', yy = y;
    for (const ch of text) {
      if (c.measureText(line + ch).width > maxW) {
        c.fillText(line, cx, yy); line = ch; yy += lh;
      } else line += ch;
    }
    if (line) c.fillText(line, cx, yy);
  }

  function drawFX() {
    for (const p of state.particles) {
      ctx.save();
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
      else { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    for (const f of state.floatingTexts) {
      ctx.save();
      ctx.globalAlpha = clamp(f.life / f.maxLife, 0, 1);
      ctx.font = `900 ${f.size}px "Chakra Petch", "Noto Sans JP", sans-serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'rgba(0,0,0,0.88)';
      ctx.lineWidth = 5;
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
    if (state.flashAlpha > 0.01 && state.flashColor) {
      ctx.fillStyle = state.flashColor;
      ctx.globalAlpha = state.flashAlpha;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function render() {
    hitboxes = [];
    ctx.save();
    if (state.shake > 0.2) ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);

    if (state.screen === 'title') {
      drawTitleScreen();
    } else if (state.screen === 'play') {
      drawFeltTable();
      drawPlayHUD();
      drawScoreboard();
      drawDiceTrayAndActions();
      if (state.phase === 'stage_clear') drawStageClearOverlay();
      if (state.showHandsModal) drawHandsModal();
    } else if (state.screen === 'shop') {
      drawShopScreen();
    } else if (state.screen === 'victory') {
      drawEndScreen(true);
    } else if (state.screen === 'gameover') {
      drawEndScreen(false);
    }

    drawFX();
    ctx.restore();
  }

  window.__stepFrame = (dt = 1 / 60) => { update(dt); render(); };

  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    if (!window.__manualStep) { update(dt); render(); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
