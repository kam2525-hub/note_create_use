<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SWEEP RUSH｜3Dお掃除無双 × 強化ビルド【ゲーム4日目】</title>
  <meta name="description" content="100日後にバズるゲームを作る男・4日目。散らかった3Dブロックを爆速クリーナーで一掃！3択強化ビルドでマシンが巨大化＆連鎖爆発する爽快お掃除アクション。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SWEEP RUSH｜3Dお掃除無双【無料ブラウザゲーム】" />
  <meta property="og:description" content="指1本で散らかった3Dブロックを一気に掃除！3択強化でブレード巨大化＆ボム連鎖が気持ちいい爽快ゲーム。" />
  <meta property="og:url" content="https://kam2525-hub.github.io/note_create_use/games/day04-sweep-rush/" />
  <meta property="og:image" content="https://kam2525-hub.github.io/note_create_use/shorts/day04/output/note_thumbnail.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SWEEP RUSH｜3Dお掃除無双【無料ブラウザゲーム】" />
  <meta name="twitter:description" content="3Dブロックを一掃してピカピカに！3択ビルドで超インフレするお掃除ゲーム" />
  <meta name="twitter:image" content="https://kam2525-hub.github.io/note_create_use/shorts/day04/output/note_thumbnail.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1b2538;
      --ink-soft: #5b6982;
      --paper: #ffffff;
      --sky-top: #cfe9ff;
      --sky-bot: #f4f9ff;
      --accent: #ff5a5f;
      --mint: #12c48b;
      --gold: #ffbe0b;
      --blue: #2f80ed;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
      color: var(--ink);
      font-family: 'Fredoka', 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Minimal Floating HUD (Full-bleed, zero boxy panels) */
    .hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: max(14px, env(safe-area-inset-top)) 18px 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .hud-top-row {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(27, 37, 56, 0.10);
      letter-spacing: 0.04em;
    }

    .score-float {
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.95), 0 6px 14px rgba(27, 37, 56, 0.14);
      letter-spacing: 0.02em;
    }

    .sound-btn {
      pointer-events: auto;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 12px rgba(27, 37, 56, 0.12);
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .sound-btn:active {
      transform: scale(0.92);
    }

    .progress-wrap {
      margin-top: 10px;
      width: 100%;
      max-width: 340px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      flex: 1;
      height: 14px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      padding: 3px;
      box-shadow: 0 4px 12px rgba(27, 37, 56, 0.10), inset 0 1px 2px rgba(27, 37, 56, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2f80ed 0%, #12c48b 70%, #ffbe0b 100%);
      transition: width 0.08s linear;
    }

    .progress-pct {
      font-size: 14px;
      font-weight: 900;
      color: var(--ink);
      min-width: 46px;
      text-align: right;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
    }

    .sub-hud {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .timer-pill {
      background: rgba(255, 255, 255, 0.88);
      padding: 3px 11px;
      border-radius: 999px;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(27, 37, 56, 0.08);
    }
    .timer-pill.urgent {
      background: #ff5a5f;
      color: #ffffff;
      animation: pulse 0.5s infinite alternate;
    }

    .fever-tag {
      display: none;
      background: linear-gradient(90deg, #ffbe0b, #ff5a5f);
      color: #ffffff;
      padding: 3px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(255, 90, 95, 0.35);
    }
    .fever-tag.show {
      display: inline-block;
    }

    .perk-strip {
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 92vw;
      pointer-events: none;
      z-index: 10;
    }

    .perk-chip {
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 3px 10px rgba(27, 37, 56, 0.10);
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.07); }
    }

    /* Clean Toy-Pop Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(226, 239, 255, 0.52);
      backdrop-filter: blur(6px);
      z-index: 30;
    }
    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 28px;
      padding: 26px 22px 24px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(27, 37, 56, 0.18), 0 6px 0 #dce6f5;
    }

    .eyebrow {
      display: inline-block;
      background: #fff3cd;
      color: #b57b00;
      font-size: 12px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .modal h1 {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 900;
      line-height: 1.1;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .modal p.desc {
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .cta-btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px 20px;
      background: linear-gradient(180deg, #27d99c 0%, #12b882 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #0c8b61, 0 12px 24px rgba(18, 184, 130, 0.28);
      transition: transform 0.08s;
    }
    .cta-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0c8b61;
    }

    .cta-btn.secondary {
      margin-top: 10px;
      background: #eef4fc;
      color: var(--ink);
      font-size: 15px;
      padding: 13px 16px;
      box-shadow: 0 4px 0 #d5e1f2;
    }

    /* 3-Choice Upgrade Cards */
    .upgrade-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .up-card {
      width: 100%;
      border: 2px solid #e6eef9;
      border-radius: 18px;
      background: #f8fbff;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 0 #dce7f7;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
    }
    .up-card:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #dce7f7;
    }
    .up-card.picked {
      border-color: #ffbe0b;
      background: #fff9e6;
      transform: scale(1.03);
      box-shadow: 0 0 0 4px rgba(255, 190, 11, 0.25);
    }

    .up-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      color: #ffffff;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
    }

    .up-title {
      font-size: 16px;
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .up-desc {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      line-height: 1.35;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0 20px;
    }
    .stat-box {
      background: #f3f7fd;
      border-radius: 14px;
      padding: 10px 6px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--ink-soft);
    }
    .stat-val {
      font-size: 20px;
      font-weight: 900;
      color: var(--ink);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="hud-top-row">
      <div class="stage-pill" id="stagePill">STAGE 1</div>
      <div class="score-float" id="scoreVal">0</div>
      <button class="sound-btn" id="soundBtn" type="button" aria-label="Sound toggle">🔊</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
    <div class="sub-hud">
      <div class="timer-pill" id="timerPill">22.0s</div>
      <div class="fever-tag" id="feverTag">FEVER ×2!</div>
    </div>
  </div>

  <div class="perk-strip" id="perkStrip"></div>

  <!-- Title Overlay -->
  <div class="overlay show" id="titleOverlay">
    <div class="modal">
      <div class="eyebrow">DAY 04 // 3Dお掃除アクション</div>
      <h1>SWEEP RUSH</h1>
      <p class="desc">
        指1本で散らかった3Dブロックを一掃！<br />
        洗剤ボム連鎖＆3択パワーアップで巨大化して部屋ごと吹き飛ばそう。
      </p>
      <button class="cta-btn" id="startBtn" type="button">お掃除スタート！</button>
    </div>
  </div>

  <!-- 3-Choice Upgrade Overlay -->
  <div class="overlay" id="upgradeOverlay">
    <div class="modal">
      <div class="eyebrow">STAGE CLEAR! ピカピカ達成</div>
      <h1 style="font-size:26px;">お掃除マシン強化</h1>
      <p class="desc" style="margin-bottom:8px;">次の部屋に向けて1つ選ぼう</p>
      <div class="upgrade-list" id="upgradeList"></div>
    </div>
  </div>

  <!-- Result Overlay -->
  <div class="overlay" id="resultOverlay">
    <div class="modal">
      <div class="eyebrow" id="resultRank">CLEAN MASTER</div>
      <h1 style="font-size:30px;">TIME UP!</h1>
      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-label">SCORE</div>
          <div class="stat-val" id="resScore">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">STAGE</div>
          <div class="stat-val" id="resStage">1</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">BEST</div>
          <div class="stat-val" id="resBest">0</div>
        </div>
      </div>
      <button class="cta-btn" id="retryBtn" type="button">もう1回掃除する</button>
      <button class="cta-btn secondary" id="shareBtn" type="button">記録をシェア</button>
    </div>
  </div>

  <script>
    (() => {
      const SHORTS_MODE = new URLSearchParams(window.location.search).get('shorts') === '1';
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const stagePill = document.getElementById('stagePill');
      const scoreVal = document.getElementById('scoreVal');
      const progressFill = document.getElementById('progressFill');
      const progressPct = document.getElementById('progressPct');
      const timerPill = document.getElementById('timerPill');
      const feverTag = document.getElementById('feverTag');
      const perkStrip = document.getElementById('perkStrip');
      const soundBtn = document.getElementById('soundBtn');

      const titleOverlay = document.getElementById('titleOverlay');
      const upgradeOverlay = document.getElementById('upgradeOverlay');
      const upgradeList = document.getElementById('upgradeList');
      const resultOverlay = document.getElementById('resultOverlay');
      const startBtn = document.getElementById('startBtn');
      const retryBtn = document.getElementById('retryBtn');
      const shareBtn = document.getElementById('shareBtn');

      const BEST_KEY = 'sweep_rush_best_v1';
      let bestScore = Number(localStorage.getItem(BEST_KEY) || 0);

      // Toy-pop 3D cube color palette (bright, zero dark cyber)
      const CUBE_COLORS = [
        { top: '#ff6b6b', front: '#e04848', side: '#c73838' }, // Coral
        { top: '#ffd166', front: '#f0b429', side: '#d49817' }, // Sunshine
        { top: '#2ec4b6', front: '#1da195', side: '#158278' }, // Mint
        { top: '#4ea8de', front: '#3086bd', side: '#236b99' }, // Sky
        { top: '#a663cc', front: '#8744b0', side: '#6d3194' }, // Grape
        { top: '#ff9f1c', front: '#e08206', side: '#bf6c00' }, // Tangerine
      ];

      const UPGRADES = [
        {
          id: 'wide',
          icon: '🧹',
          color: '#2f80ed',
          title: 'ワイドブレード',
          desc: '吸引幅＋35%！まとめて一気に掃除する',
        },
        {
          id: 'bubble',
          icon: '🫧',
          color: '#12c48b',
          title: '洗剤ボム弾',
          desc: '8個掃除するたびに自動爆発ボムを発射',
        },
        {
          id: 'tornado',
          icon: '🌪️',
          color: '#ff9f1c',
          title: '吸引トルネード',
          desc: '走った跡に竜巻を発生させて周囲を吸う',
        },
        {
          id: 'spark',
          icon: '⚡',
          color: '#8338ec',
          title: 'チェイン静電気',
          desc: '触れたブロックから隣の山へ電撃連鎖',
        },
        {
          id: 'magnet',
          icon: '🧲',
          color: '#ff5a5f',
          title: '強力バキューム',
          desc: '周囲のブロックをグイグイ引き寄せる',
        },
        {
          id: 'turbo',
          icon: '🚀',
          color: '#f0b429',
          title: 'ターボモーター',
          desc: '移動スピード＋25%＆FEVER時間延長',
        },
      ];

      // Room floor dimensions in world space (X: -W/2..W/2, Y: -D/2..D/2, Z: up)
      const FLOOR_W = 540;
      const FLOOR_D = 720;
      const GRID_COLS = 18;
      const GRID_ROWS = 24;
      const CELL_W = FLOOR_W / GRID_COLS;
      const CELL_D = FLOOR_D / GRID_ROWS;

      let viewW = 480;
      let viewH = 854;
      let dpr = 1;

      function resize() {
        dpr = Math.min(2, window.devicePixelRatio || 1);
        viewW = window.innerWidth;
        viewH = window.innerHeight;
        canvas.width = Math.round(viewW * dpr);
        canvas.height = Math.round(viewH * dpr);
      }
      window.addEventListener('resize', resize);
      resize();

      // =====================================================
      // Web Audio Synth (Playful Marimba/Pop + Bomb Boom)
      // =====================================================
      let audioCtx = null;
      let soundOn = true;
      let bgmTimer = null;
      let bgmTick = 0;

      function ensureAudio() {
        if (SHORTS_MODE || !soundOn) return;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        startBgm();
      }

      function playTone(freq, dur, type = 'sine', vol = 0.09, slideTo = null) {
        if (SHORTS_MODE || !soundOn || !audioCtx || audioCtx.state !== 'running') return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      const PENTA = [392.0, 440.0, 493.88, 587.33, 659.25, 783.99, 880.0, 987.77, 1174.66];
      let lastPopTime = 0;
      function playPop(combo) {
        const now = performance.now();
        if (now - lastPopTime < 28) return;
        lastPopTime = now;
        const f = PENTA[Math.min(PENTA.length - 1, combo % PENTA.length)];
        playTone(f, 0.09, 'triangle', 0.11, f * 1.18);
      }

      function playBombSfx() {
        playTone(170, 0.28, 'sawtooth', 0.18, 42);
        playTone(523.25, 0.18, 'sine', 0.12, 880);
      }

      function playClearSfx() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => playTone(f, 0.18, 'triangle', 0.12), idx * 55);
        });
      }

      function startBgm() {
        if (bgmTimer || SHORTS_MODE) return;
        const bass = [130.81, 130.81, 164.81, 196.0, 146.83, 146.83, 196.0, 164.81];
        bgmTimer = setInterval(() => {
          if (!soundOn || !audioCtx || audioCtx.state !== 'running' || state.phase !== 'play') return;
          const f = bass[bgmTick % bass.length];
          playTone(f, 0.14, 'triangle', 0.04);
          if (bgmTick % 2 === 1) playTone(f * 3, 0.05, 'sine', 0.025);
          bgmTick++;
        }, 210);
      }

      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
        if (soundOn) ensureAudio();
      });

      // =====================================================
      // Game State
      // =====================================================
      const state = {
        phase: 'title', // title | play | upgrade | result
        stage: 1,
        score: 0,
        combo: 0,
        comboTimer: 0,
        fever: 0,
        timeLeft: 22.0,
        cleanedCells: new Uint8Array(GRID_COLS * GRID_ROWS),
        cleanedCount: 0,
        totalBlocks: 0,
        blocksCleared: 0,
        sweptSinceBubble: 0,
        tornadoCooldown: 0,

        // Player sweeper
        px: 0,
        py: 200,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        baseRadius: 34,
        speed: 410,
        pointerActive: false,
        targetX: 0,
        targetY: 200,
        invuln: 0,

        perks: {
          wide: 0,
          bubble: 0,
          tornado: 0,
          spark: 0,
          magnet: 0,
          turbo: 0,
        },

        blocks: [],
        debris: [],
        rings: [],
        bubbles: [],
        tornadoes: [],
        bolts: [],
        popups: [],

        // Camera & FX
        camX: 0,
        camY: 140,
        shake: 0,
        zoomBump: 0,
        flashAlpha: 0,
        flashColor: '#ffffff',
        ambientT: 0,

        // Shorts mode
        shortsT: 0,
        shortsStage: 0,
        events: [],
      };

      function sweeperRadius() {
        return state.baseRadius * (1 + state.perks.wide * 0.35) * (state.fever > 0 ? 1.15 : 1.0);
      }

      function markFloorCleaned(wx, wy, rad) {
        const minC = Math.max(0, Math.floor((wx - rad + FLOOR_W / 2) / CELL_W));
        const maxC = Math.min(GRID_COLS - 1, Math.floor((wx + rad + FLOOR_W / 2) / CELL_W));
        const minR = Math.max(0, Math.floor((wy - rad + FLOOR_D / 2) / CELL_D));
        const maxR = Math.min(GRID_ROWS - 1, Math.floor((wy + rad + FLOOR_D / 2) / CELL_D));
        for (let r = minR; r <= maxR; r++) {
          for (let c = minC; c <= maxC; c++) {
            const cx = -FLOOR_W / 2 + (c + 0.5) * CELL_W;
            const cy = -FLOOR_D / 2 + (r + 0.5) * CELL_D;
            if ((cx - wx) * (cx - wx) + (cy - wy) * (cy - wy) <= (rad + 14) * (rad + 14)) {
              const idx = r * GRID_COLS + c;
              if (state.cleanedCells[idx] === 0) {
                state.cleanedCells[idx] = 1;
                state.cleanedCount++;
              }
            }
          }
        }
      }

      function spawnStage(stageNum, customLayout = false) {
        state.blocks = [];
        state.debris = [];
        state.rings = [];
        state.bubbles = [];
        state.tornadoes = [];
        state.bolts = [];
        state.cleanedCells.fill(0);
        state.cleanedCount = 0;
        state.blocksCleared = 0;

        state.px = 0;
        state.py = FLOOR_D * 0.36;
        state.targetX = state.px;
        state.targetY = state.py;
        state.angle = -Math.PI / 2;

        if (customLayout) {
          // Dense curated clusters for visual spectacle
          const clusters = [
            { cx: 0, cy: 130, rx: 140, ry: 95, step: 28, hMax: 2 },
            { cx: -115, cy: -50, rx: 105, ry: 90, step: 28, hMax: 2 },
            { cx: 115, cy: -50, rx: 105, ry: 90, step: 28, hMax: 2 },
            { cx: 0, cy: -220, rx: 190, ry: 85, step: 29, hMax: 3 },
          ];
          let id = 1;
          clusters.forEach((cl, ci) => {
            for (let x = cl.cx - cl.rx; x <= cl.cx + cl.rx; x += cl.step) {
              for (let y = cl.cy - cl.ry; y <= cl.cy + cl.ry; y += cl.step) {
                const dx = (x - cl.cx) / cl.rx;
                const dy = (y - cl.cy) / cl.ry;
                if (dx * dx + dy * dy > 1.05) continue;
                const stack = 1 + Math.floor(Math.random() * cl.hMax);
                for (let s = 0; s < stack; s++) {
                  const col = CUBE_COLORS[(id + s + ci) % CUBE_COLORS.length];
                  state.blocks.push({
                    id: id++,
                    x: x + (Math.random() - 0.5) * 6,
                    y: y + (Math.random() - 0.5) * 6,
                    z: s * 22,
                    size: 20 + (s === 0 ? 3 : 0),
                    kind: 'cube',
                    col,
                    vx: 0,
                    vy: 0,
                    vz: 0,
                    rot: (Math.random() - 0.5) * 0.4,
                    sucked: false,
                  });
                }
              }
            }
          });
          // Place strategic Soap Bombs & Vortex Fans inside piles
          const specials = [
            { x: -10, y: 120, kind: 'bomb' },
            { x: -110, y: -45, kind: 'vortex' },
            { x: 110, y: -45, kind: 'bomb' },
            { x: 0, y: -215, kind: 'bomb' },
          ];
          specials.forEach((sp) => {
            state.blocks.push({
              id: id++,
              x: sp.x,
              y: sp.y,
              z: 24,
              size: 26,
              kind: sp.kind,
              col: sp.kind === 'bomb'
                ? { top: '#ffbe0b', front: '#ff5a5f', side: '#d9383e' }
                : { top: '#2ec4b6', front: '#2f80ed', side: '#1f5fb8' },
              vx: 0,
              vy: 0,
              vz: 0,
              rot: 0,
              sucked: false,
            });
          });
        } else {
          // Procedural dense toy-block room per stage
          const countTarget = Math.min(185, 95 + stageNum * 22);
          let id = 1;
          // Create 3-5 colorful toy piles across the room
          const numPiles = 3 + Math.min(3, Math.floor(stageNum / 2));
          const piles = [];
          for (let p = 0; p < numPiles; p++) {
            piles.push({
              x: (Math.random() - 0.5) * (FLOOR_W - 140),
              y: -FLOOR_D * 0.34 + (p / Math.max(1, numPiles - 1)) * (FLOOR_D * 0.52),
              colIdx: (p + stageNum) % CUBE_COLORS.length,
            });
          }

          for (let i = 0; i < countTarget; i++) {
            const pile = piles[i % piles.length];
            const ang = Math.random() * Math.PI * 2;
            const dist = Math.pow(Math.random(), 0.65) * 115;
            const bx = Math.max(-FLOOR_W / 2 + 28, Math.min(FLOOR_W / 2 - 28, pile.x + Math.cos(ang) * dist));
            const by = Math.max(-FLOOR_D / 2 + 28, Math.min(FLOOR_D * 0.28, pile.y + Math.sin(ang) * dist));
            const stackLevel = Math.random() < 0.28 ? 1 : 0;
            const col = CUBE_COLORS[(pile.colIdx + (Math.random() < 0.3 ? 1 : 0)) % CUBE_COLORS.length];
            state.blocks.push({
              id: id++,
              x: bx,
              y: by,
              z: stackLevel * 22,
              size: 20 + Math.random() * 5,
              kind: 'cube',
              col,
              vx: 0,
              vy: 0,
              vz: 0,
              rot: (Math.random() - 0.5) * 0.6,
              sucked: false,
            });
          }

          // Add Soap Bombs & Vortex Fans
          const bombCount = 2 + Math.min(3, Math.floor(stageNum / 2));
          for (let b = 0; b < bombCount; b++) {
            const pile = piles[b % piles.length];
            state.blocks.push({
              id: id++,
              x: pile.x + (Math.random() - 0.5) * 35,
              y: pile.y + (Math.random() - 0.5) * 35,
              z: 22,
              size: 25,
              kind: b % 3 === 1 ? 'vortex' : 'bomb',
              col: b % 3 === 1
                ? { top: '#2ec4b6', front: '#2f80ed', side: '#1f5fb8' }
                : { top: '#ffbe0b', front: '#ff5a5f', side: '#d9383e' },
              vx: 0,
              vy: 0,
              vz: 0,
              rot: 0,
              sucked: false,
            });
          }

          // Add 1-3 Spike Hazards from Stage 2+
          if (stageNum >= 2) {
            const hazCount = Math.min(3, stageNum - 1);
            for (let h = 0; h < hazCount; h++) {
              state.blocks.push({
                id: id++,
                x: (Math.random() - 0.5) * (FLOOR_W - 140),
                y: -FLOOR_D * 0.25 + Math.random() * (FLOOR_D * 0.4),
                z: 0,
                size: 26,
                kind: 'hazard',
                col: { top: '#3a4254', front: '#242a38', side: '#171b26' },
                vx: 0,
                vy: 0,
                vz: 0,
                rot: 0,
                sucked: false,
              });
            }
          }
        }

        state.totalBlocks = state.blocks.filter((b) => b.kind !== 'hazard').length;
        markFloorCleaned(state.px, state.py, sweeperRadius());
        syncHUD();
      }

      function cleanPercent() {
        if (state.totalBlocks <= 0) return 100;
        const pct = Math.round((state.blocksCleared / state.totalBlocks) * 100);
        return Math.min(100, Math.max(0, pct));
      }

      function syncHUD() {
        stagePill.textContent = `STAGE ${state.stage}`;
        scoreVal.textContent = state.score.toLocaleString();
        const pct = cleanPercent();
        progressFill.style.width = `${pct}%`;
        progressPct.textContent = `${pct}%`;
        timerPill.textContent = `${Math.max(0, state.timeLeft).toFixed(1)}s`;
        timerPill.classList.toggle('urgent', state.timeLeft <= 5.0 && state.phase === 'play');
        feverTag.classList.toggle('show', state.fever > 0);

        // Render active perk chips (hidden in ?shorts=1 for clean full-bleed video)
        if (SHORTS_MODE) {
          perkStrip.style.display = 'none';
        } else {
          perkStrip.innerHTML = '';
          UPGRADES.forEach((u) => {
            const lv = state.perks[u.id];
            if (lv > 0) {
              const chip = document.createElement('div');
              chip.className = 'perk-chip';
              chip.textContent = `${u.icon} ${u.title} Lv.${lv}`;
              perkStrip.appendChild(chip);
            }
          });
        }
      }

      // =====================================================
      // Sweeping, Explosions, Chain Reactions
      // =====================================================
      function addPopup(x, y, z, text, color = '#1b2538', big = false) {
        state.popups.push({ x, y, z, text, color, big, life: 0.75, maxLife: 0.75 });
      }

      function spawnDebris(x, y, z, col, count = 4) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 80 + Math.random() * 190;
          state.debris.push({
            x,
            y,
            z: z + 6,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            vz: 140 + Math.random() * 210,
            size: 6 + Math.random() * 6,
            col,
            life: 0.55 + Math.random() * 0.25,
            maxLife: 0.8,
          });
        }
      }

      function sweepBlock(b, source = 'sweep') {
        if (b.removed) return;

        if (b.kind === 'hazard') {
          if (state.fever > 0) {
            // Smash hazard in FEVER!
            b.removed = true;
            spawnDebris(b.x, b.y, b.z, b.col, 8);
            state.score += 180;
            state.shake = Math.max(state.shake, 7);
            addPopup(b.x, b.y, 38, 'SMASH +180', '#ffbe0b', true);
            state.events.push({ type: 'bomb', x: b.x, y: b.y });
          } else if (state.invuln <= 0 && source === 'sweep') {
            state.invuln = 0.85;
            state.combo = 0;
            state.shake = Math.max(state.shake, 11);
            state.flashAlpha = 0.28;
            state.flashColor = '#ff5a5f';
            state.timeLeft = Math.max(0.5, state.timeLeft - 1.5);
            addPopup(b.x, b.y, 40, '-1.5s!', '#ff5a5f', true);
            playTone(150, 0.22, 'sawtooth', 0.16, 65);
          }
          return;
        }

        b.removed = true;
        state.blocksCleared++;
        state.combo++;
        state.comboTimer = 1.65;
        state.sweptSinceBubble++;

        if (state.combo >= 14 && state.fever <= 0) {
          state.fever = 4.2 + state.perks.turbo * 1.2;
          addPopup(state.px, state.py, 48, 'FEVER ×2!', '#ff5a5f', true);
          state.events.push({ type: 'fever' });
        }

        const mult = state.fever > 0 ? 2 : 1;
        const pts = (15 + Math.min(45, state.combo * 2)) * mult;
        state.score += pts;
        markFloorCleaned(b.x, b.y, 26);

        if (b.kind === 'bomb') {
          triggerSoapBomb(b.x, b.y);
          return;
        }
        if (b.kind === 'vortex') {
          triggerVortex(b.x, b.y);
          return;
        }

        spawnDebris(b.x, b.y, b.z, b.col, 3);
        playPop(state.combo);
        state.events.push({ type: 'pop', combo: state.combo });

        // Perk: Bubble Bomb every N sweeps
        if (state.perks.bubble > 0) {
          const thresh = Math.max(4, 10 - state.perks.bubble * 2);
          if (state.sweptSinceBubble >= thresh) {
            state.sweptSinceBubble = 0;
            launchAutoBubble();
          }
        }

        // Perk: Spark chain lightning
        if (state.perks.spark > 0 && Math.random() < 0.28 + state.perks.spark * 0.14) {
          triggerSparkChain(b.x, b.y, 1 + state.perks.spark);
        }
      }

      function triggerSoapBomb(bx, by) {
        const rad = 132 + state.perks.wide * 16;
        state.rings.push({ x: bx, y: by, r: 16, maxR: rad, color: '#ffbe0b', life: 0.42, maxLife: 0.42 });
        state.rings.push({ x: bx, y: by, r: 8, maxR: rad * 0.85, color: '#2ec4b6', life: 0.34, maxLife: 0.34 });
        state.shake = Math.max(state.shake, 13);
        state.zoomBump = Math.max(state.zoomBump, 0.055);
        state.flashAlpha = 0.22;
        state.flashColor = '#fff7d6';
        markFloorCleaned(bx, by, rad);
        playBombSfx();
        if (state.popups.length < 3) {
          addPopup(bx, by, 50, 'BOOM!!', '#ff5a5f', true);
        }
        state.events.push({ type: 'bomb', x: bx, y: by });

        const victims = [];
        for (const other of state.blocks) {
          if (other.removed || other.kind === 'hazard') continue;
          const d = Math.hypot(other.x - bx, other.y - by);
          if (d <= rad) victims.push(other);
        }
        victims.forEach((v) => sweepBlock(v, 'bomb'));
      }

      function triggerVortex(vx, vy) {
        state.tornadoes.push({
          x: vx,
          y: vy,
          r: 135,
          life: 2.3,
          maxLife: 2.3,
          spin: 0,
        });
        addPopup(vx, vy, 45, 'VORTEX!', '#2f80ed', true);
        playTone(620, 0.25, 'sine', 0.14, 1180);
        state.events.push({ type: 'vortex' });
      }

      function launchAutoBubble() {
        // Find densest remaining block target
        const candidates = state.blocks.filter((b) => !b.removed && b.kind !== 'hazard');
        if (candidates.length === 0) return;
        const target = candidates[Math.floor(Math.random() * candidates.length)];
        state.bubbles.push({
          x: state.px,
          y: state.py,
          z: 24,
          tx: target.x,
          ty: target.y,
          life: 0.38,
          maxLife: 0.38,
        });
      }

      function triggerSparkChain(sx, sy, jumps) {
        let cx = sx;
        let cy = sy;
        const pts = [{ x: cx, y: cy }];
        for (let j = 0; j < jumps; j++) {
          let best = null;
          let bestD = 125;
          for (const b of state.blocks) {
            if (b.removed || b.kind === 'hazard') continue;
            const d = Math.hypot(b.x - cx, b.y - cy);
            if (d > 4 && d < bestD) {
              bestD = d;
              best = b;
            }
          }
          if (!best) break;
          pts.push({ x: best.x, y: best.y });
          cx = best.x;
          cy = best.y;
          sweepBlock(best, 'spark');
        }
        if (pts.length > 1) {
          state.bolts.push({ pts, life: 0.22, maxLife: 0.22 });
        }
      }

      // =====================================================
      // Stage Clear & 3-Choice Upgrade Modal
      // =====================================================
      function openUpgradeModal() {
        state.phase = 'upgrade';
        playClearSfx();
        state.events.push({ type: 'stage_clear' });

        // Pick 3 distinct upgrades
        const pool = [...UPGRADES].sort(() => Math.random() - 0.5);
        const picks = pool.slice(0, 3);
        upgradeList.innerHTML = '';

        picks.forEach((u) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'up-card';
          btn.dataset.id = u.id;
          const nextLv = state.perks[u.id] + 1;
          btn.innerHTML = `
            <div class="up-icon" style="background:${u.color}">${u.icon}</div>
            <div>
              <div class="up-title">${u.title} <span style="color:${u.color}">Lv.${nextLv}</span></div>
              <div class="up-desc">${u.desc}</div>
            </div>
          `;
          btn.addEventListener('click', () => {
            ensureAudio();
            state.perks[u.id]++;
            upgradeOverlay.classList.remove('show');
            state.stage++;
            state.timeLeft = Math.min(28, state.timeLeft + 10.5);
            state.phase = 'play';
            spawnStage(state.stage, false);
            playTone(740, 0.14, 'triangle', 0.14, 1046);
          });
          upgradeList.appendChild(btn);
        });

        upgradeOverlay.classList.add('show');
      }

      function finishGame() {
        state.phase = 'result';
        if (state.score > bestScore) {
          bestScore = state.score;
          localStorage.setItem(BEST_KEY, String(bestScore));
        }
        document.getElementById('resScore').textContent = state.score.toLocaleString();
        document.getElementById('resStage').textContent = String(state.stage);
        document.getElementById('resBest').textContent = bestScore.toLocaleString();

        const rank =
          state.score >= 25000 ? 'GOD CLEANER' :
          state.score >= 12000 ? 'MEGA SWEEPER' :
          state.score >= 5000 ? 'PRO CLEANER' : 'ROOKIE SWEEPER';
        document.getElementById('resultRank').textContent = rank;
        resultOverlay.classList.add('show');
      }

      function startNewRun() {
        ensureAudio();
        titleOverlay.classList.remove('show');
        upgradeOverlay.classList.remove('show');
        resultOverlay.classList.remove('show');

        state.phase = 'play';
        state.stage = 1;
        state.score = 0;
        state.combo = 0;
        state.comboTimer = 0;
        state.fever = 0;
        state.timeLeft = 22.0;
        state.sweptSinceBubble = 0;
        state.invuln = 0;
        Object.keys(state.perks).forEach((k) => { state.perks[k] = 0; });
        spawnStage(1, false);
      }

      startBtn.addEventListener('click', startNewRun);
      retryBtn.addEventListener('click', startNewRun);

      shareBtn.addEventListener('click', async () => {
        const text = `【SWEEP RUSH｜4日目】SCORE ${state.score.toLocaleString()} / STAGE ${state.stage} まで掃除した！ #100日後にバズるゲームを作る男`;
        const url = window.location.href;
        if (navigator.share) {
          try {
            await navigator.share({ title: 'SWEEP RUSH', text, url });
            return;
          } catch (e) {}
        }
        try {
          await navigator.clipboard.writeText(`${text}\n${url}`);
          shareBtn.textContent = 'コピー完了！';
          setTimeout(() => { shareBtn.textContent = '記録をシェア'; }, 1600);
        } catch (e) {}
      });

      // =====================================================
      // 3D Perspective Projection (True Camera Depth!)
      // =====================================================
      function project3D(wx, wy, wz) {
        // Camera looks from front-top toward floor center
        const camPitch = 0.72; // ~41 deg tilt
        const cosP = Math.cos(camPitch);
        const sinP = Math.sin(camPitch);

        const dx = wx - state.camX * 0.35;
        const dy = wy - state.camY * 0.35;

        // Rotate world Y,Z into camera space
        const camDist = 760 / (1 + state.zoomBump);
        const yRot = dy * cosP - wz * sinP;
        const zRot = dy * sinP + wz * cosP;

        const depth = camDist + yRot;
        const focal = Math.min(viewW * 1.24, viewH * 0.78);
        const scale = focal / Math.max(160, depth);

        const sx = viewW * 0.5 + dx * scale;
        const sy = viewH * 0.48 + (zRot * -1 + 88) * scale;
        return { x: sx, y: sy, scale, depth };
      }

      // Inverse ray-floor intersection for crisp touch/mouse steering
      function screenToFloor(clientX, clientY) {
        // Iterative approximation on Z=0 plane
        let wx = state.px;
        let wy = state.py;
        for (let i = 0; i < 6; i++) {
          const p = project3D(wx, wy, 0);
          const errX = clientX - p.x;
          const errY = clientY - p.y;
          wx += errX / Math.max(0.25, p.scale);
          wy += errY / (Math.max(0.25, p.scale) * 0.68);
        }
        return {
          x: Math.max(-FLOOR_W / 2 + 24, Math.min(FLOOR_W / 2 - 24, wx)),
          y: Math.max(-FLOOR_D / 2 + 24, Math.min(FLOOR_D / 2 - 24, wy)),
        };
      }

      // Pointer & Keyboard Controls
      const keys = {};
      window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

      canvas.addEventListener('pointerdown', (e) => {
        if (SHORTS_MODE || state.phase !== 'play') return;
        ensureAudio();
        state.pointerActive = true;
        const pt = screenToFloor(e.clientX, e.clientY);
        state.targetX = pt.x;
        state.targetY = pt.y;
      });
      canvas.addEventListener('pointermove', (e) => {
        if (SHORTS_MODE || !state.pointerActive || state.phase !== 'play') return;
        const pt = screenToFloor(e.clientX, e.clientY);
        state.targetX = pt.x;
        state.targetY = pt.y;
      });
      const stopPtr = () => { state.pointerActive = false; };
      canvas.addEventListener('pointerup', stopPtr);
      canvas.addEventListener('pointercancel', stopPtr);

      // =====================================================
      // Simulation Step
      // =====================================================
      function stepSim(dt) {
        state.ambientT += dt;
        state.shake = Math.max(0, state.shake - dt * 36);
        state.zoomBump *= Math.pow(0.06, dt);
        state.flashAlpha = Math.max(0, state.flashAlpha - dt * 1.4);

        if (state.phase === 'title') {
          // Gentle live demo idle animation behind title card
          state.camX = Math.sin(state.ambientT * 0.6) * 40;
          state.camY = 120 + Math.cos(state.ambientT * 0.5) * 30;
          return;
        }

        if (state.phase !== 'play') return;

        if (!SHORTS_MODE) {
          state.timeLeft -= dt;
          if (state.timeLeft <= 0) {
            state.timeLeft = 0;
            syncHUD();
            finishGame();
            return;
          }
        }

        if (state.invuln > 0) state.invuln -= dt;
        if (state.fever > 0) state.fever = Math.max(0, state.fever - dt);
        if (state.comboTimer > 0) {
          state.comboTimer -= dt;
          if (state.comboTimer <= 0) state.combo = 0;
        }

        // Steering
        const spd = state.speed * (1 + state.perks.turbo * 0.25) * (state.fever > 0 ? 1.2 : 1.0);
        let kx = 0;
        let ky = 0;
        if (keys['arrowleft'] || keys['a']) kx -= 1;
        if (keys['arrowright'] || keys['d']) kx += 1;
        if (keys['arrowup'] || keys['w']) ky -= 1;
        if (keys['arrowdown'] || keys['s']) ky += 1;

        if (kx !== 0 || ky !== 0) {
          const len = Math.hypot(kx, ky);
          state.vx = (kx / len) * spd;
          state.vy = (ky / len) * spd;
          state.px += state.vx * dt;
          state.py += state.vy * dt;
          state.angle = Math.atan2(state.vy, state.vx);
        } else if (state.pointerActive || SHORTS_MODE) {
          const dx = state.targetX - state.px;
          const dy = state.targetY - state.py;
          const dist = Math.hypot(dx, dy);
          if (dist > 4) {
            const step = Math.min(dist, spd * dt);
            state.vx = (dx / dist) * spd;
            state.vy = (dy / dist) * spd;
            state.px += (dx / dist) * step;
            state.py += (dy / dist) * step;
            state.angle = Math.atan2(dy, dx);
          } else {
            state.vx = 0;
            state.vy = 0;
          }
        }

        state.px = Math.max(-FLOOR_W / 2 + 24, Math.min(FLOOR_W / 2 - 24, state.px));
        state.py = Math.max(-FLOOR_D / 2 + 24, Math.min(FLOOR_D / 2 - 24, state.py));

        // Smooth camera follow
        state.camX += (state.px * 0.45 - state.camX) * Math.min(1, dt * 6.5);
        state.camY += ((state.py + 80) * 0.45 - state.camY) * Math.min(1, dt * 6.5);

        const rad = sweeperRadius();
        markFloorCleaned(state.px, state.py, rad);

        // Perk: Tornado trail
        if (state.perks.tornado > 0) {
          state.tornadoCooldown -= dt;
          if (state.tornadoCooldown <= 0 && Math.hypot(state.vx, state.vy) > 40) {
            state.tornadoCooldown = Math.max(0.55, 1.3 - state.perks.tornado * 0.25);
            state.tornadoes.push({ x: state.px, y: state.py, r: 85 + state.perks.tornado * 18, life: 1.5, maxLife: 1.5, spin: 0 });
          }
        }

        // Sweep & Magnet Pull
        const magRad = rad + 36 + state.perks.magnet * 55;
        for (const b of state.blocks) {
          if (b.removed) continue;
          const dx = state.px - b.x;
          const dy = state.py - b.y;
          const d = Math.hypot(dx, dy);

          if (b.kind !== 'hazard' && state.perks.magnet > 0 && d < magRad && d > rad) {
            const pull = (160 + state.perks.magnet * 95) * dt;
            b.x += (dx / d) * pull;
            b.y += (dy / d) * pull;
          }

          if (d <= rad + b.size * 0.52) {
            sweepBlock(b, 'sweep');
          }
        }

        // Active Tornadoes
        for (let i = state.tornadoes.length - 1; i >= 0; i--) {
          const tr = state.tornadoes[i];
          tr.life -= dt;
          tr.spin += dt * 14;
          for (const b of state.blocks) {
            if (b.removed || b.kind === 'hazard') continue;
            const dx = tr.x - b.x;
            const dy = tr.y - b.y;
            const d = Math.hypot(dx, dy);
            if (d < tr.r) {
              if (d < 34) {
                sweepBlock(b, 'vortex');
              } else {
                const pull = 280 * dt;
                b.x += (dx / d) * pull;
                b.y += (dy / d) * pull;
              }
            }
          }
          if (tr.life <= 0) state.tornadoes.splice(i, 1);
        }

        // Auto Bubbles
        for (let i = state.bubbles.length - 1; i >= 0; i--) {
          const bb = state.bubbles[i];
          bb.life -= dt;
          const t = 1 - Math.max(0, bb.life) / bb.maxLife;
          bb.cx = bb.x + (bb.tx - bb.x) * t;
          bb.cy = bb.y + (bb.ty - bb.y) * t;
          bb.cz = 20 + Math.sin(t * Math.PI) * 95;
          if (bb.life <= 0) {
            triggerSoapBomb(bb.tx, bb.ty);
            state.bubbles.splice(i, 1);
          }
        }

        // Prune removed blocks
        if (state.blocks.some((b) => b.removed)) {
          state.blocks = state.blocks.filter((b) => !b.removed);
        }

        // Debris physics
        for (let i = state.debris.length - 1; i >= 0; i--) {
          const d = state.debris[i];
          d.life -= dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.z += d.vz * dt;
          d.vz -= 680 * dt;
          if (d.z < 0) {
            d.z = 0;
            d.vz *= -0.45;
          }
          if (d.life <= 0) state.debris.splice(i, 1);
        }

        // Rings, Bolts, Popups
        for (let i = state.rings.length - 1; i >= 0; i--) {
          state.rings[i].life -= dt;
          if (state.rings[i].life <= 0) state.rings.splice(i, 1);
        }
        for (let i = state.bolts.length - 1; i >= 0; i--) {
          state.bolts[i].life -= dt;
          if (state.bolts[i].life <= 0) state.bolts.splice(i, 1);
        }
        for (let i = state.popups.length - 1; i >= 0; i--) {
          state.popups[i].life -= dt;
          state.popups[i].z += 42 * dt;
          if (state.popups[i].life <= 0) state.popups.splice(i, 1);
        }

        syncHUD();

        // Check Stage Clear (97%+ cleaned auto-completes remaining stragglers cleanly!)
        const remainingNonHaz = state.blocks.filter((b) => b.kind !== 'hazard').length;
        if (remainingNonHaz === 0 || (!SHORTS_MODE && cleanPercent() >= 97)) {
          // Auto-pop last few blocks for crisp 100% clean satisfaction
          state.blocks.filter((b) => b.kind !== 'hazard').forEach((b) => {
            b.removed = true;
            state.blocksCleared++;
            spawnDebris(b.x, b.y, b.z, b.col, 3);
          });
          state.blocks = state.blocks.filter((b) => !b.removed);
          syncHUD();
          if (!SHORTS_MODE) openUpgradeModal();
        }
      }

      // =====================================================
      // 3D Toy Diorama Renderer
      // =====================================================
      function draw3DCube(wx, wy, wz, size, col, highlight = false) {
        const h = size * 0.5;
        const height = size * 0.92;
        // 8 corners (top 4 + bottom 4)
        const b0 = project3D(wx - h, wy - h, wz);
        const b1 = project3D(wx + h, wy - h, wz);
        const b2 = project3D(wx + h, wy + h, wz);
        const b3 = project3D(wx - h, wy + h, wz);

        const t0 = project3D(wx - h, wy - h, wz + height);
        const t1 = project3D(wx + h, wy - h, wz + height);
        const t2 = project3D(wx + h, wy + h, wz + height);
        const t3 = project3D(wx - h, wy + h, wz + height);

        // Soft cast shadow on floor
        if (wz < 40) {
          const sh = project3D(wx + 6, wy + 8, 0);
          ctx.fillStyle = 'rgba(27, 45, 78, 0.14)';
          ctx.beginPath();
          ctx.ellipse(sh.x, sh.y, h * sh.scale * 1.15, h * sh.scale * 0.72, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Front face (y + h)
        ctx.fillStyle = highlight ? '#ffffff' : col.front;
        ctx.beginPath();
        ctx.moveTo(t3.x, t3.y);
        ctx.lineTo(t2.x, t2.y);
        ctx.lineTo(b2.x, b2.y);
        ctx.lineTo(b3.x, b3.y);
        ctx.closePath();
        ctx.fill();

        // Right/Left side face depending on camera offset
        if (wx < state.camX * 0.35) {
          ctx.fillStyle = col.side;
          ctx.beginPath();
          ctx.moveTo(t1.x, t1.y);
          ctx.lineTo(t2.x, t2.y);
          ctx.lineTo(b2.x, b2.y);
          ctx.lineTo(b1.x, b1.y);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = col.side;
          ctx.beginPath();
          ctx.moveTo(t0.x, t0.y);
          ctx.lineTo(t3.x, t3.y);
          ctx.lineTo(b3.x, b3.y);
          ctx.lineTo(b0.x, b0.y);
          ctx.closePath();
          ctx.fill();
        }

        // Top face
        ctx.fillStyle = highlight ? '#fffbe6' : col.top;
        ctx.beginPath();
        ctx.moveTo(t0.x, t0.y);
        ctx.lineTo(t1.x, t1.y);
        ctx.lineTo(t2.x, t2.y);
        ctx.lineTo(t3.x, t3.y);
        ctx.closePath();
        ctx.fill();

        // Crisp subtle top bevel
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = Math.max(1, 1.4 * t0.scale);
        ctx.stroke();
      }

      function drawSweeper3D(wx, wy, rad) {
        const pCenter = project3D(wx, wy, 0);
        const s = pCenter.scale;
        const rPx = rad * s;

        // Suction aura ring
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(pCenter.x, pCenter.y, rPx * 1.08, rPx * 0.72, 0, 0, Math.PI * 2);
        ctx.strokeStyle = state.fever > 0 ? '#ffbe0b' : 'rgba(18, 196, 139, 0.65)';
        ctx.lineWidth = Math.max(2, 4 * s);
        ctx.stroke();

        // Ground shadow
        ctx.fillStyle = 'rgba(27, 37, 56, 0.20)';
        ctx.beginPath();
        ctx.ellipse(pCenter.x + 5 * s, pCenter.y + 7 * s, rPx * 0.96, rPx * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();

        // 3D Cylindrical Sweeper Body (extruded bottom -> top)
        const pTop = project3D(wx, wy, 20);
        const bodyGrad = ctx.createLinearGradient(pTop.x - rPx, pTop.y, pTop.x + rPx, pTop.y);
        bodyGrad.addColorStop(0, state.fever > 0 ? '#ff5a5f' : '#1b72e8');
        bodyGrad.addColorStop(0.5, state.fever > 0 ? '#ffbe0b' : '#4fa3ff');
        bodyGrad.addColorStop(1, state.fever > 0 ? '#e03e52' : '#1558b8');

        // Extrusion skirt
        ctx.fillStyle = state.fever > 0 ? '#c92c3e' : '#124a9c';
        ctx.beginPath();
        ctx.ellipse(pCenter.x, pCenter.y, rPx * 0.92, rPx * 0.58, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(pTop.x - rPx * 0.92, pTop.y, rPx * 1.84, pCenter.y - pTop.y);

        // Top cap
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.ellipse(pTop.x, pTop.y, rPx * 0.92, rPx * 0.58, 0, 0, Math.PI * 2);
        ctx.fill();

        // Spinning glossy brush blades on top
        const spinA = state.ambientT * 9.5;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(2, 4.5 * s);
        ctx.lineCap = 'round';
        for (let k = 0; k < 3; k++) {
          const a = spinA + (k * Math.PI * 2) / 3;
          ctx.beginPath();
          ctx.moveTo(pTop.x, pTop.y);
          ctx.lineTo(pTop.x + Math.cos(a) * rPx * 0.65, pTop.y + Math.sin(a) * rPx * 0.40);
          ctx.stroke();
        }

        // Bright center dome
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(pTop.x, pTop.y - 2 * s, rPx * 0.24, rPx * 0.16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function render() {
        ctx.save();
        ctx.scale(dpr, dpr);

        if (state.shake > 0.2) {
          const sx = (Math.random() - 0.5) * state.shake * 1.8;
          const sy = (Math.random() - 0.5) * state.shake * 1.8;
          ctx.translate(sx, sy);
        }

        // Bright sky-mint studio backdrop
        const bgGrad = ctx.createLinearGradient(0, 0, 0, viewH);
        bgGrad.addColorStop(0, '#cbe6ff');
        bgGrad.addColorStop(0.55, '#eaf5ff');
        bgGrad.addColorStop(1, '#f8fbff');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(-20, -20, viewW + 40, viewH + 40);

        // 3D Floor Platform Slab (with thick side plinth)
        const fl0 = project3D(-FLOOR_W / 2, -FLOOR_D / 2, 0);
        const fl1 = project3D(FLOOR_W / 2, -FLOOR_D / 2, 0);
        const fl2 = project3D(FLOOR_W / 2, FLOOR_D / 2, 0);
        const fl3 = project3D(-FLOOR_W / 2, FLOOR_D / 2, 0);

        const fb2 = project3D(FLOOR_W / 2, FLOOR_D / 2, -32);
        const fb3 = project3D(-FLOOR_W / 2, FLOOR_D / 2, -32);

        // Floor drop shadow
        ctx.fillStyle = 'rgba(27, 45, 78, 0.12)';
        ctx.beginPath();
        ctx.moveTo(fb3.x - 16, fb3.y + 18);
        ctx.lineTo(fb2.x + 16, fb2.y + 18);
        ctx.lineTo(fl2.x + 12, fl2.y + 10);
        ctx.lineTo(fl3.x - 12, fl3.y + 10);
        ctx.closePath();
        ctx.fill();

        // Floor front slab thickness
        ctx.fillStyle = '#c5d6ec';
        ctx.beginPath();
        ctx.moveTo(fl3.x, fl3.y);
        ctx.lineTo(fl2.x, fl2.y);
        ctx.lineTo(fb2.x, fb2.y);
        ctx.lineTo(fb3.x, fb3.y);
        ctx.closePath();
        ctx.fill();

        // Floor top surface (starts dusty soft gray-blue, turns gleaming pearl white as swept!)
        ctx.fillStyle = '#dfe9f5';
        ctx.beginPath();
        ctx.moveTo(fl0.x, fl0.y);
        ctx.lineTo(fl1.x, fl1.y);
        ctx.lineTo(fl2.x, fl2.y);
        ctx.lineTo(fl3.x, fl3.y);
        ctx.closePath();
        ctx.fill();

        // Render cleaned shiny white floor tiles
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < GRID_COLS; c++) {
            const idx = r * GRID_COLS + c;
            const x0 = -FLOOR_W / 2 + c * CELL_W;
            const y0 = -FLOOR_D / 2 + r * CELL_D;
            const p0 = project3D(x0, y0, 0);
            const p1 = project3D(x0 + CELL_W + 0.5, y0, 0);
            const p2 = project3D(x0 + CELL_W + 0.5, y0 + CELL_D + 0.5, 0);
            const p3 = project3D(x0, y0 + CELL_D + 0.5, 0);

            if (state.cleanedCells[idx] === 1) {
              ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#f4fbff';
              ctx.beginPath();
              ctx.moveTo(p0.x, p0.y);
              ctx.lineTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p3.x, p3.y);
              ctx.closePath();
              ctx.fill();
            } else if ((r + c) % 2 === 0) {
              ctx.fillStyle = 'rgba(182, 200, 224, 0.25)';
              ctx.beginPath();
              ctx.moveTo(p0.x, p0.y);
              ctx.lineTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.lineTo(p3.x, p3.y);
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        // Shockwave rings on floor
        for (const rg of state.rings) {
          const t = 1 - rg.life / rg.maxLife;
          const r = rg.r + (rg.maxR - rg.r) * t;
          const pc = project3D(rg.x, rg.y, 4);
          ctx.save();
          ctx.globalAlpha = 1 - t;
          ctx.strokeStyle = rg.color;
          ctx.lineWidth = Math.max(2, 8 * pc.scale * (1 - t));
          ctx.beginPath();
          ctx.ellipse(pc.x, pc.y, r * pc.scale, r * pc.scale * 0.62, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Tornadoes
        for (const tr of state.tornadoes) {
          const pc = project3D(tr.x, tr.y, 14);
          const alpha = Math.min(1, tr.life / 0.4);
          ctx.save();
          ctx.globalAlpha = alpha * 0.85;
          for (let ring = 0; ring < 4; ring++) {
            const rz = 6 + ring * 13;
            const pr = project3D(tr.x, tr.y, rz);
            const rr = (18 + ring * 14) * pr.scale;
            ctx.strokeStyle = ring % 2 === 0 ? '#2ec4b6' : '#ffffff';
            ctx.lineWidth = 3.5 * pr.scale;
            ctx.beginPath();
            ctx.ellipse(
              pr.x + Math.cos(tr.spin + ring) * 4,
              pr.y,
              rr,
              rr * 0.55,
              0,
              0,
              Math.PI * 2
            );
            ctx.stroke();
          }
          ctx.restore();
        }

        // Depth-sort all 3D entities (blocks + sweeper + debris) back-to-front
        const drawQueue = [];
        for (const b of state.blocks) {
          drawQueue.push({ sortY: b.y + b.z * 0.05, kind: 'block', obj: b });
        }
        if (state.phase !== 'title') {
          drawQueue.push({ sortY: state.py + 8, kind: 'sweeper' });
        }
        for (const d of state.debris) {
          drawQueue.push({ sortY: d.y + 4, kind: 'debris', obj: d });
        }

        drawQueue.sort((a, b) => a.sortY - b.sortY);

        for (const item of drawQueue) {
          if (item.kind === 'sweeper') {
            drawSweeper3D(state.px, state.py, sweeperRadius());
          } else if (item.kind === 'block') {
            const b = item.obj;
            const bob = (b.kind === 'bomb' || b.kind === 'vortex') ? Math.sin(state.ambientT * 6 + b.id) * 4 : 0;
            draw3DCube(b.x, b.y, b.z + bob, b.size, b.col, b.kind === 'bomb' && Math.sin(state.ambientT * 12) > 0.6);

            if (b.kind === 'bomb' || b.kind === 'vortex' || b.kind === 'hazard') {
              const pTop = project3D(b.x, b.y, b.z + b.size + 10 + bob);
              ctx.save();
              ctx.font = `900 ${Math.round(16 * pTop.scale)}px "Fredoka", sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#ffffff';
              ctx.strokeStyle = '#1b2538';
              ctx.lineWidth = Math.max(2, 4 * pTop.scale);
              const icon = b.kind === 'bomb' ? 'BOMB!' : b.kind === 'vortex' ? 'SPIN!' : '▲';
              ctx.strokeText(icon, pTop.x, pTop.y);
              ctx.fillText(icon, pTop.x, pTop.y);
              ctx.restore();
            }
          } else if (item.kind === 'debris') {
            const d = item.obj;
            draw3DCube(d.x, d.y, d.z, d.size * Math.min(1, d.life * 2.5), d.col, false);
          }
        }

        // Flying Bubble Bombs
        for (const bb of state.bubbles) {
          const p = project3D(bb.cx ?? bb.x, bb.cy ?? bb.y, bb.cz ?? 20);
          ctx.save();
          ctx.fillStyle = 'rgba(46, 196, 182, 0.88)';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3 * p.scale;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 16 * p.scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        // Chain Lightning Bolts
        for (const bt of state.bolts) {
          ctx.save();
          ctx.globalAlpha = bt.life / bt.maxLife;
          ctx.strokeStyle = '#8338ec';
          ctx.lineWidth = 6;
          ctx.lineJoin = 'round';
          ctx.beginPath();
          bt.pts.forEach((pt, idx) => {
            const p = project3D(pt.x, pt.y, 16);
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }

        // Floating 3D Score Popups
        for (const pp of state.popups) {
          const p = project3D(pp.x, pp.y, pp.z);
          ctx.save();
          ctx.globalAlpha = Math.min(1, (pp.life / pp.maxLife) * 1.4);
          ctx.font = `900 ${Math.round((pp.big ? 24 : 16) * p.scale)}px "Fredoka", "M PLUS Rounded 1c", sans-serif`;
          ctx.textAlign = 'center';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 5 * p.scale;
          ctx.strokeText(pp.text, p.x, p.y);
          ctx.fillStyle = pp.color;
          ctx.fillText(pp.text, p.x, p.y);
          ctx.restore();
        }

        if (state.flashAlpha > 0) {
          ctx.fillStyle = state.flashColor;
          ctx.globalAlpha = state.flashAlpha;
          ctx.fillRect(0, 0, viewW, viewH);
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      // =====================================================
      // Deterministic ?shorts=1 Choreography (18.0s, 100+ Events)
      // =====================================================
      function setupShortsShowcase() {
        titleOverlay.classList.remove('show');
        upgradeOverlay.classList.remove('show');
        resultOverlay.classList.remove('show');

        state.phase = 'play';
        state.stage = 1;
        state.score = 0;
        state.combo = 0;
        state.fever = 0;
        state.timeLeft = 18.0;
        state.shortsT = 0;
        state.shortsStage = 0;
        state.events = [];
        Object.keys(state.perks).forEach((k) => { state.perks[k] = 0; });
        spawnStage(1, true);
        state.px = 0;
        state.py = 240;
        state.targetX = 0;
        state.targetY = 135;
        state.speed = 460;
        render();
      }

      function stepShortsDirector(dt) {
        state.shortsT += dt;
        const t = state.shortsT;

        // 0.0s - 5.5s: Instant blitz straight into piles + Soap Bomb + Vortex!
        if (state.shortsStage === 0) {
          state.targetX = Math.sin(t * 3.8) * 115;
          state.targetY = 140 - t * 62;
          if (t >= 3.2) {
            state.shortsStage = 1;
            state.targetX = -115;
            state.targetY = -45;
          }
        } else if (state.shortsStage === 1) {
          if (t >= 4.4) {
            state.shortsStage = 2;
            state.targetX = 105;
            state.targetY = -55;
          }
        } else if (state.shortsStage === 2 && t >= 5.6) {
          // Stage 1 Clear -> Fast crisp 3-choice upgrade modal (2.3s)
          state.shortsStage = 3;
          openUpgradeModal();
          const cards = upgradeList.querySelectorAll('.up-card');
          if (cards[0]) {
            cards[0].innerHTML = `
              <div class="up-icon" style="background:#2f80ed">🧹</div>
              <div>
                <div class="up-title">ワイドブレード <span style="color:#2f80ed">Lv.1</span></div>
                <div class="up-desc">吸引幅＋35%！一気に3列お掃除</div>
              </div>`;
          }
        } else if (state.shortsStage === 3 && t >= 7.1) {
          state.shortsStage = 4;
          const first = upgradeList.querySelector('.up-card');
          if (first) first.classList.add('picked');
        } else if (state.shortsStage === 4 && t >= 7.9) {
          // Stage 2: MEGA WIDE + MAGNET sweep (no auto-bubble wipe so cubes fill 7.9s-12.8s!)
          state.shortsStage = 5;
          upgradeOverlay.classList.remove('show');
          state.stage = 2;
          state.perks.wide = 2;
          state.perks.bubble = 0;
          state.perks.spark = 0;
          state.perks.magnet = 1;
          state.fever = 10.5;
          state.phase = 'play';
          spawnStage(2, true);
          // Add extra dense blocks in Stage 2 so giant sweeper mows for full 5 seconds
          let eid2 = 7000;
          for (let x = -180; x <= 180; x += 26) {
            for (let y = -220; y <= 180; y += 26) {
              const col = CUBE_COLORS[(eid2) % CUBE_COLORS.length];
              state.blocks.push({
                id: eid2++, x, y, z: 22, size: 22, kind: 'cube', col,
                vx: 0, vy: 0, vz: 0, rot: 0, sucked: false,
              });
            }
          }
          state.totalBlocks = state.blocks.filter((b) => b.kind !== 'hazard').length;
          state.px = -140;
          state.py = 230;
          state.targetX = 0;
          state.targetY = 120;
          state.speed = 460;
        } else if (state.shortsStage === 5) {
          const phaseT = t - 7.9;
          state.targetX = Math.sin(phaseT * 2.8) * 165;
          state.targetY = 180 - phaseT * 62;
          if (t >= 12.8) {
            state.shortsStage = 6;
            state.stage = 3;
            state.perks.wide = 3;
            state.perks.bubble = 0;
            state.perks.spark = 1;
            state.fever = 6.0;
            // Build pure giant rainbow 3D pyramid (no early chain bombs until 16.5s)
            state.blocks = [];
            state.debris = [];
            state.rings = [];
            state.tornadoes = [];
            state.cleanedCells.fill(0);
            state.cleanedCount = 0;
            state.blocksCleared = 0;
            let eid = 9000;
            for (let x = -195; x <= 195; x += 26) {
              for (let y = -230; y <= 170; y += 26) {
                const distC = Math.hypot(x / 195, (y + 30) / 200);
                const layers = distC < 0.45 ? 3 : distC < 0.85 ? 2 : 1;
                for (let l = 0; l < layers; l++) {
                  const col = CUBE_COLORS[(eid + l) % CUBE_COLORS.length];
                  state.blocks.push({
                    id: eid++, x, y, z: l * 22, size: 22, kind: 'cube', col,
                    vx: 0, vy: 0, vz: 0, rot: 0, sucked: false,
                  });
                }
              }
            }
            state.totalBlocks = state.blocks.length;
            state.px = 0;
            state.py = 250;
            state.targetX = 0;
            state.targetY = 100;
            state.speed = 500;
          }
        } else if (state.shortsStage === 6) {
          const fT = t - 12.8;
          state.targetX = Math.sin(fT * 3.2) * 155;
          state.targetY = 140 - fT * 68;
          if (t >= 16.5 && state.shortsStage === 6) {
            state.shortsStage = 7;
            triggerSoapBomb(0, -140);
          }
        }
      }

      window.__SHORTS_MANUAL__ = SHORTS_MODE;
      window.__SHORTS_STEP__ = (dtMs) => {
        const dt = dtMs / 1000;
        if (SHORTS_MODE) stepShortsDirector(dt);
        stepSim(dt);
        render();
        return {
          t: state.shortsT,
          phase: state.phase,
          score: state.score,
          stage: state.stage,
          pct: cleanPercent(),
          events: state.events.splice(0, state.events.length),
        };
      };

      if (SHORTS_MODE) {
        setupShortsShowcase();
      } else {
        spawnStage(1, false);
        render();
      }

      let lastNow = performance.now();
      function loop(now) {
        const dt = Math.min(0.033, (now - lastNow) / 1000);
        lastNow = now;
        if (!window.__SHORTS_MANUAL__) {
          if (SHORTS_MODE) stepShortsDirector(dt);
          stepSim(dt);
          render();
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
