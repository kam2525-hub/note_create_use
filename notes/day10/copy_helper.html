<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Day 10 投稿ヘルパー｜おなら立ち幅跳び 999</title>
  <style>
    :root {
      --bg: #fffdf5;
      --card: #ffffff;
      --ink: #111827;
      --muted: #475569;
      --gold: #facc15;
      --orange: #f97316;
      --lime: #84cc16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: linear-gradient(180deg, #bae6fd 0%, #fef9c3 100%);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; font-weight: 900; }
    .lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .action-link {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 14px;
      border: 3px solid var(--ink);
      padding: 13px 16px;
      font-weight: 900;
      font-size: 14px;
      background: linear-gradient(180deg, #fde047, #f97316);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
    }
    .action-link.secondary { background: #ffffff; color: var(--ink); }
    .section {
      background: var(--card);
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: 5px 5px 0 var(--ink);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .section-title { font-size: 15px; font-weight: 900; color: #ea580c; }
    .copy-btn {
      border: 2.5px solid var(--ink);
      border-radius: 10px;
      padding: 7px 14px;
      background: #a3e635;
      color: var(--ink);
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }
    .copy-btn.done { background: var(--gold); }
    textarea {
      width: 100%;
      background: #fffbeb;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Day 10 投稿ヘルパー（ゲーム10日目：おなら立ち幅跳び 999）</h1>
    <p class="lead">X万バズ狙い『おなら立ち幅跳び 999』のYouTube Shorts・X・note投稿用コピペ画面です。</p>

    <div class="quick-bar">
      <a class="action-link" id="xIntentBtn" href="#" target="_blank" rel="noopener">X（Twitter）の投稿画面を開く</a>
      <a class="action-link secondary" href="https://note.com/notes/new" target="_blank" rel="noopener">note 新規記事作成を開く</a>
      <a class="action-link secondary" href="../../games/day10-onara-long-jump/">ゲーム本体を開く</a>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">YouTube Shorts タイトル</span>
        <button class="copy-btn" data-target="ytTitle">コピー</button>
      </div>
      <textarea id="ytTitle" rows="2" readonly>【Day 10】東京の砂場から「おなら」だけで世界のどこまで飛べるかゲーム作らせたら草ｗｗｗ #クソゲー #バカゲー #Shorts</textarea>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">YouTube Shorts 説明文</span>
        <button class="copy-btn" data-target="ytDesc">コピー</button>
      </div>
      <textarea id="ytDesc" rows="13" readonly>スマホ・PCで今すぐ無料で遊べます▼
https://kam2525-hub.github.io/note_create_use/games/day10-onara-long-jump/

🔥 100日後にバズるゲームを見たい人は、チャンネル登録よろしく！
💬 作ってほしいゲームがあったら、ぜひコメント欄で教えてね！（次の制作に採用するかも!?）

#Shorts #YouTubeShorts #おすすめ #バズれ #100日後にバズるゲーム #Day10 #おなら #立ち幅跳び #ダダサバイバー #クソゲー #バカゲー #AIゲーム #ブラウザゲーム #無料ゲーム #個人開発</textarea>
    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">X（Twitter）投稿文</span>
        <button class="copy-btn" data-target="xPost">コピー</button>
      </div>
      <textarea id="xPost" rows="5" readonly>AIに「おならで東京の砂場から世界へ飛ぶ立ち幅跳びゲーム」作らせたら、単純なのにサメミサイル回避×1プレイ進化が中毒性ヤバくて無限に遊べるｗｗｗ
あと〇〇mで横浜だったのにくっそ…👇
https://kam2525-hub.github.io/note_create_use/games/day10-onara-long-jump/
#100日後にバズるゲーム #個人開発 #クソゲー</textarea>
    </div>
  </div>

  <script>
    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const ta = document.getElementById(btn.dataset.target);
        if (!ta) return;
        try { await navigator.clipboard.writeText(ta.value); }
        catch { ta.select(); document.execCommand('copy'); }
        const orig = btn.textContent;
        btn.textContent = 'コピー完了!';
        btn.classList.add('done');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 1600);
      });
    });
    const xBtn = document.getElementById('xIntentBtn');
    xBtn.href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(document.getElementById('xPost').value);
  </script>
</body>
</html>
