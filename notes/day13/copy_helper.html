## ここがバカ＆やり込めるポイント

1. **💥 無理に流すと即終了「蓋ペロッ!! 麺ドバァァ!!」**：
   画面を傾けてお湯を流しますが、調子に乗って傾けすぎると水圧と麺の重みで蓋がめくれ上がり、60本以上の3Dちぢれ麺とキャベツが一気にシンクの排水口へ流れ落ちます。
2. **✨ 操作は「傾ける」＋「ひと振り」だけなのに極限まで沼る**：
   お湯を半分以上切ったら、最後は「ひと振り」で表面張力の残り数滴をスパッとカット！ただし振りすぎると麺が1本ずつ隙間から抜けていくチキンレース。「あと1回振るか、ここで蓋を開けるか」で **残湯 0.00mL ＆ 麺流出 0本（S+ランク）** を狙えます。
3. **🎧 ASMR級の「気持ちいい湯切り音」**：
   ステンレスシンクに注がれる温かみのある水流とコポコポ水泡音、ひと振りで弾ける水滴音、蓋を開ける爽快なペリッという音までWeb Audioで手作りしました。
4. **🍜 5種類のカップ＆スプレッドシート全国ランキング対応**：
   `並盛`・`大盛`・`特盛2玉`・`激辛`・`極（深夜の弱粘着蓋）`の5種類に加え、残湯 0.00mL 順の記録ランキング（Googleスプレッドシート/GAS連携対応）を搭載しています。</textarea>

    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const el = document.getElementById(btn.dataset.target);
        try { await navigator.clipboard.writeText(el.value); } catch (_) { el.select(); document.execCommand('copy'); }
        btn.textContent = 'コピー済み'; btn.classList.add('done');
        setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1500);
      });
    });
    document.getElementById('xBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(document.getElementById('xText').value);
