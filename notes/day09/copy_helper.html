  <style>
    :root {
      --bg: #07090f;
      --card: #101522;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #00e5ff;
      --red: #ff1744;
      --gold: #ffd400;
      --border: #25304a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 60px;
      background: radial-gradient(circle at 20% 0%, #240c18 0%, #07090f 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      line-height: 1.65;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    .lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    .quick-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }
    .action-link {
      display: block;
      text-align: center;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 900;
      font-size: 14px;
      background: linear-gradient(90deg, #ff1744, #ff6d00);
      color: #ffffff;
    }
    .action-link.secondary { background: #161d30; color: var(--text); border: 1px solid var(--border); }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--accent); }
    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      background: var(--red);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .copy-btn.done { background: var(--gold); color: #09090b; }
    textarea {
      width: 100%;
      background: #080c16;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }
  </style>
</head>

  <script>
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const el = document.getElementById(btn.dataset.target);
        navigator.clipboard.writeText(el.value).then(() => {
          btn.textContent = 'コピー完了!';
          btn.classList.add('done');
          setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('done'); }, 1500);
        });
      });
    });
    const xText = document.getElementById('xPost').value;
    document.getElementById('xIntentBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(xText);
  </script>
