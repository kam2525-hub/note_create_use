      <textarea id="noteBody" rows="16" readonly>100日後にバズるゲームを作る男、5日目です。

これまで1〜4日目はすべて反射神経・アクション系を作ってきましたが、5日目の今日は純粋なゲーム性とビルド構築の中毒性だけで勝負するターン制ローグライト『DICE OVERDRIVE』を作りました！

スマホでもPCでも、インストール不要・ブラウザだけで今すぐ無料で遊べます👇

https://kam2525-hub.github.io/note_create_use/games/day05-dice-overdrive/

■ 遊び方：ロック＆振り直し → ダイス面改造 → 倍率インフレ爆発！
1. 🎲 5個のサイコロをロック＆リロールしてポーカー役（フルハウス・ストレート・ファイブダイス等）を作る
2. ⚒️ ショップでサイコロの「1面」を禁断の特殊面に直接改造！
   ・✨ 黄金面（×3倍）
   ・⚡ 連鎖面（2回連続リトリガー発動）
   ・🪞 鏡面（左隣の目をコピー＆×2倍）
   ・💥 爆弾面（チップ+50 & 倍率+4）
   ・💎 ダイヤ面（チップ+90爆盛り）
   ・🃏 ワイルド面（最強の役になる出目に自動変化）
3. 🏺 12種の壊れレリック（6の覇王・先頭エコー・幸運の四葉・無限ループなど）を最大5個装備して乗算シナジー爆発！

■ 見どころ
・基礎チップ×スコア倍率が左から順にドミノ連鎖し、数百点→数万点→数億点へ跳ね上がる快感！
・全8ステージ（ボスギミックあり）＋制覇後は最強ビルドで挑める「♾️無限エンドレス」搭載！

ぜひ1ハンド100万点・1億点を目指して遊んでみてください！

  <script>
    const xText = document.getElementById('xText').value;
    document.getElementById('xIntentBtn').href =
      'https://twitter.com/intent/tweet?text=' + encodeURIComponent(xText);

    document.querySelectorAll('.copy-btn[data-target]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const el = document.getElementById(btn.dataset.target);
        try {
          await navigator.clipboard.writeText(el.value);
        } catch (_) {
          el.select();
          document.execCommand('copy');
        }
        const orig = btn.textContent;
        btn.textContent = 'コピー完了!';
        btn.classList.add('done');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('done');
        }, 1500);
      });
    });
  </script>
