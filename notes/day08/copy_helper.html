    body {

      font-size: 14px;
      background: linear-gradient(90deg, #38bdf8, #f97316);
      color: #ffffff;
    }
    .action-link.secondary { background: #142038; color: var(--text); border: 1px solid var(--border); }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .section-title { font-size: 15px; font-weight: 800; color: var(--accent); }
    .copy-btn {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      background: #f97316;
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }
    .copy-btn.done { background: var(--gold); color: #09090b; }
    textarea {
      width: 100%;
      background: #080f1f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
    }
    .thumb-preview { width: 100%; border-radius: 12px; display: block; margin-top: 8px; border: 1px solid var(--border); }
  </style>
</head>

  </div>
  <script>
    const xText = document.getElementById('xText').value;
    document.getElementById('xIntentBtn').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(xText);
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const el = document.getElementById(btn.dataset.target);
        try {
          await navigator.clipboard.writeText(el.value);
        } catch (_) {
          el.select();
          document.execCommand('copy');
        }
        const orig = btn.textContent;
        btn.textContent = 'コピー完了!';
        btn.classList.add('done');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('done'); }, 1400);
      });
    });
  </script>
