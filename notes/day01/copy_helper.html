    h1 {
      font-size: 24px;
      margin: 0 0 8px;
      letter-spacing: 0.02em;
    }
    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 14px;
    }
    .section {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    .section-head {
      display: flex;

    <h1>Day 01 投稿コピペヘルパー（JUST SLASH 99）</h1>

    <div class="section">

    </div>

    <div class="section">
      <div class="section-head">
        <span class="section-title">note 本文</span>
        <button class="copy-btn" data-target="noteBody">コピー</button>
      </div>
      <textarea id="noteBody" rows="16" readonly>「あと1ミリだったのに…！」

そう言いながら、気づいたら10回連続でリトライしてしまう。
そんな「脳汁特化型」の超シンプル・タイミングゲームを1本つくりました！

スマホでもPCでも、インストール不要・ブラウザだけで今すぐ無料で遊べます👇

▶ ゲームを遊ぶ（URL）
https://kam2525-hub.github.io/note_create_use/games/day01-just-slash/

---

■ ルールは1秒でわかる「2つだけ」

1. 左右に爆速で走る光のバーが、中心の GOLD ゾーン に重なった瞬間にタップ（PCは Space キー）！
2. 5連続成功で「FEVER TIME」に突入！スコア2倍＆BGMがギアアップします🔥

……ただし、たまに「赤いTRAPゾーン」が出現します。
赤いときにうっかり押してしまうと即ミス！見送ってスルーできればボーナス点です。

---

■ なぜ「気持ちいい」のか？（こだわりポイント）

短い時間でも思わずハマるように、3つの仕掛けを入れています。

・音階が上がるヒット音：コンボが繋がるほど「ド→レ→ミ→ファ→ソ…」と音が上がり、脳が勝手に気持ちよくなります（右上の「BGM ON」で聴きながら遊ぶのがおすすめです）
・0.03秒のヒットストップ＋画面シェイク：ど真ん中の「GOD」判定が決まると、一瞬画面が止まって衝撃波とパーティクルが弾けます
・0.1秒でリスタート：負けた瞬間にSpaceキー／ボタン1回で即やり直し。ストレスゼロで「あと1回！」が止まりません

---

■ あなたは何点いける？

・2,200点以上：Aランク（超反応スナイパー）
・4,500点以上：Sランク（脳汁ドバドバの覇者）
・8,000点以上：S++ランク（人間卒業・0.01秒の神）

まずは Sランク（4,500点） を目指してみてください！
最高記録が出たら、ぜひコメント欄や X でスコアを教えてください👇</textarea>

  <script>
    document.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const el = document.getElementById(btn.dataset.target);
        await navigator.clipboard.writeText(el.value);
        const orig = btn.textContent;
        btn.textContent = 'コピー完了！';
        btn.classList.add('done');
        setTimeout(() => {
          btn.textContent = orig;
          btn.classList.remove('done');
        }, 1400);
      });
    });
  </script>
